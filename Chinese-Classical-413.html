            segments: [
                {
                    original: "西湖香市，起於花朝，盡於端午。山東進香普陀者日至，嘉、湖進香天竺者日至，至則與湖之人市焉，故曰香市。",
                    translation: "西湖的香市，從農曆二月十二的花朝節開始，到五月初五的端午節結束。從山東到普陀山進香的香客每天都有人來，從嘉興、湖州到天竺寺進香的香客也是每天都有人來。他們到了這裡，就和西湖當地的人做起買賣交易，所以稱之為「香市」。",
                    audioText: "西湖香市，起於花朝，盡於端午。，山東進香普陀者日至，，嘉、湖進香天竺者日至，，至則與湖之人市焉，故曰香市。",
                    notes: {
                        "香市": { zhuyin: "ㄒㄧㄤ ㄕˋ", type: "名詞", def: "兼具進香與交易的臨時集市。" },
                        "花朝": { zhuyin: "ㄏㄨㄚ ㄓㄠ", type: "名詞", def: "農曆二月花朝節。" },
                        "端午": { zhuyin: "ㄉㄨㄢ ㄨˇ", type: "名詞", def: "農曆五月初五。" },
                        "普陀": { zhuyin: "ㄆㄨˇ ㄊㄨㄛˊ", type: "名詞", def: "觀音菩薩道場。" },
                        "嘉、湖": { zhuyin: "ㄐㄧㄚ、ㄏㄨˊ", type: "名詞", def: "嘉興、湖州。" },
                        "天竺": { zhuyin: "ㄊㄧㄢ ㄓㄨˊ", type: "名詞", def: "西湖山中進香勝地。" },
                        "日至": { zhuyin: "ㄖˋ ㄓˋ", type: "副詞+動詞", def: "每天都有人來。" },
                        "市焉": { zhuyin: "ㄕˋ ㄧㄢ", type: "動賓結構", def: "在此進行交易。" }

                {
                    original: "此時春暖，桃柳明媚，鼓吹清和，岸無留船，寓無留客，肆無留釀。袁石公所謂:「山色如娥，花光如頰，溫風如酒，波紋如綾」，已畫出西湖三月。",
                    translation: "這個時候春意盎然，桃花和柳樹鮮明可愛，傳來的音樂聲清越和諧。岸邊沒有空閒停泊的船隻，客棧裡沒有空房，酒館裡的酒也被喝得一滴不剩。明代文人袁宏道所說的：「山色秀美如同女子的蛾眉，花朵嬌艷如同少女的面頰，和暖的春風令人如飲美酒般陶醉，水波細緻如同精美的絲綢」，這幾句話已經生動地描繪出了西湖三月的美景。",
                    audioText: "此時春暖，桃柳明媚，，鼓吹清和，，岸無留船，寓無留客，肆無留釀。，袁石公所謂:，山色如娥，，花光如頰，，溫風如酒，，波紋如綾，，已畫出西湖三月。",
                    notes: {
                        "明媚": { zhuyin: "ㄇㄧㄥˊ ㄇㄟˋ", type: "形容詞", def: "景物鮮明可愛。" },
                        "鼓吹": { zhuyin: "ㄍㄨˇ ㄔㄨㄟ", type: "名詞", def: "泛指音樂演奏。" },
                        "清和": { zhuyin: "ㄑㄧㄥ ㄏㄜˊ", type: "形容詞", def: "清越和諧。" },
                        "岸無留船": { zhuyin: "ㄢˋ ㄨˊ ㄌㄧㄡˊ ㄔㄨㄢˊ", type: "片語", def: "岸邊沒有空船。" },
                        "肆無留釀": { zhuyin: "ㄙˋ ㄨˊ ㄌㄧㄡˊ ㄋㄧㄤˋ", type: "片語", def: "酒館沒有剩酒。" },
                        "袁石公": { zhuyin: "ㄩㄢˊ ㄕˊ ㄍㄨㄥ", type: "名詞", def: "袁宏道。" },
                        "娥": { zhuyin: "ㄜˊ", type: "名詞", def: "蛾眉，喻山色秀美。" },
                        "頰": { zhuyin: "ㄐㄧㄚˊ", type: "名詞", def: "面頰，喻花朵嬌艷。" },
                        "綾": { zhuyin: "ㄌㄧㄥˊ", type: "名詞", def: "絲織品，喻水波。" }
                    }
                },
                {
                    original: "而此以香客雜來，光景又別。士女閑都，不勝其村莊野婦之喬畫；芳蘭薌澤，不勝其合香芫荽之薰蒸；絲竹管絃，不勝其搖鼓欱笙之聒帳；鼎彞光怪，不勝其泥人竹馬之行情；宋、元名畫，不勝其湖景佛圖之紙貴。",
                    translation: "然而，這時因為各地的香客雜亂地湧來，景象又完全不同了。高雅端莊的上流社會男女，在數量聲勢上抵不過那些打扮得粗俗誇張的鄉野村婦；高雅名貴的蘭花香氣，抵不過那些廉價混合香料和香菜散發出的刺鼻味道；高雅的管弦音樂，抵不過小販招攬生意的撥浪鼓和吹笙的吵鬧聲；名貴的古董銅器，抵不過廉價泥人竹馬玩具的熱銷行情；宋代、元代的名家畫作，抵不過那些印著西湖風景和佛像的便宜圖畫那樣搶手暢銷。",
                    audioText: "而此以香客雜來，光景又別。，士女閑都，不勝其村莊野婦之喬畫；，芳蘭薌澤，不勝其合香芫荽之薰蒸；，絲竹管絃，不勝其搖鼓欱笙之聒帳；，鼎彞光怪，不勝其泥人竹馬之行情；，宋、元名畫，不勝其湖景佛圖之紙貴。",
                    notes: {
                        "光景": { zhuyin: "ㄍㄨㄤ ㄐㄧㄥˇ", type: "名詞", def: "景象。" },
                        "士女": { zhuyin: "ㄕˋ ㄋㄩˇ", type: "名詞", def: "上流社會男女。" },
                        "閑都": { zhuyin: "ㄒㄧㄢˊ ㄉㄨ", type: "形容詞", def: "雅致端莊。" },
                        "不勝其": { zhuyin: "ㄅㄨˋ ㄕㄥ ㄑㄧˊ", type: "動詞片語", def: "抵不過、比不上。" },
                        "喬畫": { zhuyin: "ㄑㄧㄠˊ ㄏㄨㄚˋ", type: "名詞", def: "粗俗誇張的打扮。" },
                        "芳蘭薌澤": { zhuyin: "ㄈㄤ ㄌㄢˊ ㄒㄧㄤ ㄗㄜˊ", type: "名詞", def: "高雅名貴的香氣。" },
                        "合香": { zhuyin: "ㄏㄜˊ ㄒㄧㄤ", type: "名詞", def: "廉價混合香。" },
                        "芫荽": { zhuyin: "ㄩㄢˊ ㄙㄨㄟ", type: "名詞", def: "香菜。" },
                        "絲竹管絃": { zhuyin: "ㄙ ㄓㄨˊ ㄍㄨㄢˇ ㄒㄧㄢˊ", type: "名詞", def: "高雅的音樂。" },
                        "搖鼓欱笙": { zhuyin: "ㄧㄠˊ ㄍㄨˇ ㄏㄜ ㄕㄥ", type: "名詞", def: "小販的粗俗樂器。" },
                        "聒帳": { zhuyin: "ㄍㄨㄚ ㄓㄤˋ", type: "形容詞", def: "聲音吵鬧。" },
                        "鼎彞光怪": { zhuyin: "ㄉㄧㄥˇ ㄧˊ ㄍㄨㄤ ㄍㄨㄞˋ", type: "名詞", def: "名貴的古董銅器。" },
                        "泥人竹馬": { zhuyin: "ㄋㄧˊ ㄖㄣˊ ㄓㄨˊ ㄇㄚˇ", type: "名詞", def: "廉價兒童玩具。" },
                        "紙貴": { zhuyin: "ㄓˇ ㄍㄨㄟˋ", type: "形容詞", def: "極度暢銷。" }
                    }
                },
                {
                    original: "如逃如逐，如奔如追，撩撲不開，牽挽不住。數百十萬男男女女、老老少少，日簇擁於寺之前後左右者，凡四閱月方罷。恐大江以東，斷無此二地矣。",
                    translation: "人們像在逃跑、像在追逐、像在狂奔，人擠人互相碰撞根本分不開，想拉都拉不住。數以百萬計的男男女女、老老少少，每天就這樣擁擠在寺廟的前後左右，整整持續了四個月才結束。恐怕在長江以東的江南地區，絕對找不到第二個像這樣瘋狂熱鬧的地方了。",
                    audioText: "如逃如逐，如奔如追，，撩撲不開，牽挽不住。，數百十萬男男女女、老老少少，，日簇擁於寺之前後左右者，，凡四閱月方罷。，恐大江以東，，斷無此二地矣。",
                    notes: {
                        "撩撲不開": { zhuyin: "ㄌㄧㄠ ㄆㄨ ㄅㄨˋ ㄎㄞ", type: "動詞片語", def: "擁擠碰撞，無法分開。" },
                        "牽挽不住": { zhuyin: "ㄑㄧㄢ ㄨㄢˇ ㄅㄨˋ ㄓㄨˋ", type: "動詞片語", def: "拉扯不住，隨波逐流。" },
                        "簇擁": { zhuyin: "ㄘㄨˋ ㄩㄥˇ", type: "動詞", def: "群聚擁擠在一起。" },
                        "四閱月": { zhuyin: "ㄙˋ ㄩㄝˋ ㄩㄝˋ", type: "名詞", def: "整整四個月。" }

            // 20題高難度考題
            quiz: [
                { q: "關於「西湖香市」的時間，下列敘述何者正確？", opts: ["A. 從春節到清明", "B. 從二月花朝節到五月端午節", "C. 僅限於三月", "D. 整個秋季"], ans: "B", exp: "文中開篇即點明「起於花朝，盡於端午」，長達「四閱月」。" },
                { q: "「至則與湖之人市焉」中的「市」字，其詞性與字義為何？", opts: ["A. 名詞，市場", "B. 動詞，進行交易、買賣", "C. 形容詞，熱鬧的", "D. 副詞，在市集裡"], ans: "B", exp: "「市」在此處為名詞轉作動詞，意指香客到了西湖，便與當地人進行商品交易。" },
                { q: "「岸無留船，寓無留客，肆無留釀」使用了什麼修辭手法來表現遊客之多？", opts: ["A. 擬人", "B. 排比與誇飾", "C. 借代", "D. 譬喻"], ans: "B", exp: "連用三個結構相同的「無留」句型構成排比，並以極端的說法（一滴酒都沒剩）達到誇飾的效果。" },
                { q: "袁宏道所謂「山色如娥」中的「娥」是指？", opts: ["A. 嫦娥", "B. 美女的蛾眉，喻山色清秀", "C. 飛蛾", "D. 鵝"], ans: "B", exp: "娥，同「蛾」，指古代美女細長的眉毛，用來比喻西湖群山婉約秀美的輪廓。" },
                { q: "張岱引用袁宏道的名言「山色如娥...波紋如綾」，其寫作上的作用為何？", opts: ["A. 為了炫耀自己書讀得多", "B. 作為反襯，先寫西湖傳統的「雅」，再帶出香市獨特的「俗」與熱鬧", "C. 完全同意袁宏道，認為西湖只有雅致", "D. 諷刺袁宏道不會寫文章"], ans: "B", exp: "作者先用名家筆墨鋪陳西湖的文雅幽靜，隨即筆鋒一轉「而此以香客雜來，光景又別」，形成強烈的雅俗對比。" },
                { q: "「士女閑都」中「閑都」的意思是？", opts: ["A. 閒暇無事", "B. 雅致端莊、文雅美麗", "C. 繁華的都市", "D. 散步的樣子"], ans: "B", exp: "閑，通「嫻」，嫻靜；都，美好。指上流社會男女高雅端莊的姿態。" },
                { q: "「不勝其村莊野婦之喬畫」中的「喬畫」意指？", opts: ["A. 古代名畫", "B. 粗俗做作、誇張的打扮", "C. 喬裝成男人", "D. 橋上的畫作"], ans: "B", exp: "喬，做作、假裝。喬畫指鄉野村婦刻意、誇張且俗氣的化妝打扮。" },
                { q: "作者連用五個「不勝其...」，表達了當時西湖香市怎樣的現象？", opts: ["A. 雅致的文化完全被消滅了", "B. 數量龐大、充滿生命力的世俗氣息(俗)，在聲勢上壓倒了少數文人的雅致(雅)", "C. 證明張岱非常討厭這些村民", "D. 顯示當時物價通貨膨脹嚴重"], ans: "B", exp: "張岱以這五組對比，客觀且生動地描繪了世俗大眾力量的龐大，它在香市期間完全淹沒了文人的精緻文化。" },
                { q: "「芳蘭薌澤」對比的是何種氣味？", opts: ["A. 鼎彞光怪", "B. 搖鼓欱笙", "C. 合香芫荽", "D. 泥人竹馬"], ans: "C", exp: "「芳蘭薌澤」是名貴高雅的香氣，對比的是廉價混合香與香菜（芫荽）那種強烈刺鼻的氣味。" },
                { q: "句中「合香芫荽之薰蒸」的「芫荽」是指什麼植物？", opts: ["A. 蘭花", "B. 茉莉", "C. 香菜", "D. 艾草"], ans: "C", exp: "芫荽即為今日所稱的香菜，氣味濃烈，在此代表民間世俗的氣味。" },
                { q: "「搖鼓欱笙」中的「欱」音義為何？", opts: ["A. ㄏㄜ，吹奏、吸飲", "B. ㄑㄧㄣ，親吻", "C. ㄏㄢˋ，遺憾", "D. ㄍㄜ，唱歌"], ans: "A", exp: "欱，音ㄏㄜ。原意為吸飲，此處引申為吹奏樂器（笙）。" },
                { q: "「鼎彞光怪」通常用來指稱什麼物品？", opts: ["A. 奇怪的鼎", "B. 名貴的青銅古董禮器", "C. 發光的妖怪", "D. 寺廟的香爐"], ans: "B", exp: "鼎彞是古代宗廟祭祀用的青銅禮器，代表文人雅士把玩的昂貴古董。" },
                { q: "承上題，與「鼎彞光怪」形成強烈對比的世俗商品是？", opts: ["A. 村莊野婦", "B. 湖景佛圖", "C. 泥人竹馬", "D. 絲竹管絃"], ans: "C", exp: "名貴的古董銅器（鼎彞光怪），抵不過民間廉價且大受歡迎的兒童玩具（泥人竹馬）。" },
                { q: "「如逃如逐，如奔如追，撩撲不開，牽挽不住」這段話描寫了怎樣的場景？", opts: ["A. 官兵抓強盜", "B. 小孩玩捉迷藏", "C. 香客與遊人擁擠不堪、隨波逐流的瘋狂狀態", "D. 西湖水流湍急"], ans: "C", exp: "生動描繪出百萬人潮湧動時，個人的渺小與身不由己的擁擠狀態。" },
                { q: "「凡四閱月方罷」的「閱」字，解釋為何？", opts: ["A. 閱讀", "B. 經歷、經過", "C. 檢閱軍隊", "D. 喜悅"], ans: "B", exp: "閱，經過。四閱月即經歷了整整四個月。" },
                { q: "「恐大江以東，斷無此二地矣」，「大江以東」是指？", opts: ["A. 長江以東的江南地區", "B. 黃河以東", "C. 珠江以東", "D. 黑龍江以東"], ans: "A", exp: "大江通常指長江，江東泛指江南繁華富庶的地區。" },
                { q: "本文在結構安排上，採用了怎樣的層次遞進？", opts: ["A. 先寫香市盛況，再寫西湖雅景，最後寫人物", "B. 先交代時間地點由來，次寫西湖春景，再以排比對比雅俗，最後以人潮擁擠作結", "C. 全篇只寫買賣過程", "D. 先寫自己，再寫他人"], ans: "B", exp: "文章條理清晰：破題交代由來 -> 引名言寫雅景 -> 雅俗對比寫香市特點 -> 極寫人潮作結。" },
                { q: "下列關於作者張岱的敘述，何者正確？", opts: ["A. 唐代大詩人", "B. 明末清初著名的散文家，晚年經歷國破家亡，著有《陶庵夢憶》", "C. 宋代詞人", "D. 清代小說家，著有《紅樓夢》"], ans: "B", exp: "張岱出身晚明世家，鼎革後隱居著書，《陶庵夢憶》是他對故國繁華最重要的追憶之作。" },

                            </div>
                            <div class="pt-2 border-t border-red-200 mt-2 text-amber-900">
                                <strong><i class="fas fa-lightbulb text-yellow-500 mr-1"></i>解析：</strong>${q.exp}
                            </div>
                        `;

                        feedbackClass += " bg-red-50 border-red-200 text-red-900";
                    }
                }

                return `
                <div class="${cardClass} rounded-xl p-6 mb-8 shadow-sm transition-all duration-300" id="quiz-card-${i}">

                            const isDisabled = isAnswered ? 'disabled' : '';

                    </div>

                    <div class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-orange-200 p-4 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] flex justify-center items-center z-40">
                         <button onclick="submitQuiz()" class="px-10 py-3 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-700 hover:to-orange-700 text-white font-bold rounded-full shadow-lg transition transform hover:scale-105 flex items-center text-lg">
                            <i class="fas fa-paper-plane mr-2"></i> 交卷並查看成績

            `;
        }

        // [Tab Story] 抉擇之路 (RPG)

                choices: [
                    { text: "痛心疾首，大罵世風日下", next: "complain" },
                    { text: "豁達欣賞，將這極致的「俗」與西湖的「雅」並列寫入文章", next: "success" }
                ]
            },
            complain: {
                id: 'complain',
                text: "【Alternative Ending: 道學先生】你拂袖而去，對民間的狂熱嗤之以鼻。你失去了作為一個散文家客觀包容的視野，寫出來的文章流於說教，無人問津。",
                choices: [{ text: "重新體會世俗之美", next: "enter_market" }],

        function renderStory(container) {

            container.innerHTML = `<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-orange-100">${imageContent}<div class="p-8 sm:p-10"><div class="flex items-center mb-6 text-amber-800 text-sm font-bold uppercase tracking-widest border-b border-orange-100 pb-2"><i class="fas fa-compass mr-2"></i> 抉擇時刻</div><p class="text-xl sm:text-2xl leading-relaxed text-amber-900 mb-10 font-serif">${node.text}</p>${node.isEnding ? (node.win ? `<div class="text-center mb-8 text-green-700 font-bold text-2xl p-6 bg-green-50 rounded-xl border border-green-200 shadow-sm"><i class="fas fa-check-circle mr-3"></i>絕妙好辭</div>` : `<div class="text-center mb-8 text-orange-700 font-bold text-2xl p-6 bg-orange-50 rounded-xl border border-orange-200 shadow-sm"><i class="fas fa-redo mr-3"></i>重新挑戰</div>`) : ''}<div class="grid gap-4">${node.choices.map(c => `<button onclick="nextStoryNode('${c.next}')" class="story-choice w-full py-5 px-8 bg-white hover:bg-orange-50 border-2 border-orange-200 hover:border-amber-500 rounded-xl text-amber-900 font-bold text-xl transition duration-200 flex items-center justify-between group shadow-sm hover:shadow-md text-left"><span>${c.text}</span><i class="fas fa-chevron-right text-amber-300 group-hover:text-amber-600 transition transform group-hover:translate-x-1"></i></button>`).join('')}</div></div></div>`;

        function nextStoryNode(nodeId) {
            window.currentStoryNode = nodeId;
            renderStory(document.getElementById('content-display'));

        function checkAnswer(idx, val, ans) {
            if (userAnswers[idx] !== undefined) return; 

            userAnswers[idx] = val; 
            
            const radios = document.getElementsByName(`q-${idx}`);
            for (let radio of radios) {
                radio.disabled = true;
                radio.parentElement.classList.add('disabled-label');
            }

            const feedbackEl = document.getElementById(`feedback-${idx}`);
            const card = document.getElementById(`quiz-card-${idx}`);
            const qData = contentData.quiz[idx];
            if (!feedbackEl || !card) return;
            
            feedbackEl.className = 'mt-4 p-4 rounded-lg text-base animate-fade-in border';
            card.classList.remove('bg-white');

            if (val === ans) {
                feedbackEl.innerHTML = `<strong class="block mb-1 text-lg"><i class="fas fa-check-circle mr-2"></i>答對了！</strong>${qData.exp}`;
                feedbackEl.classList.add('bg-green-50', 'border-green-200', 'text-green-900');
                card.classList.add('bg-green-50/30', 'border-green-500');
            } else {
                const correctOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === ans);
                const userOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === val);
                
                feedbackEl.innerHTML = `
                    <div class="mb-2">
                        <span class="block font-bold text-red-700 text-lg"><i class="fas fa-times-circle mr-2"></i>答錯了</span>
                        <span class="block text-amber-800 mt-1">您的答案：${userOption}</span>
                        <span class="block text-green-700 font-bold mt-1">正確答案：${correctOption}</span>
                    </div>
                    <div class="pt-2 border-t border-red-200 mt-2 text-amber-900">
                        <strong><i class="fas fa-lightbulb text-yellow-500 mr-1"></i>解析：</strong>${qData.exp}

                `;
                feedbackEl.classList.add('bg-red-50', 'border-red-200', 'text-amber-900');
                card.classList.add('bg-red-50/30', 'border-red-500');
            }
            feedbackEl.classList.remove('hidden');
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-amber-600 font-bold text-5xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                if(score >= 80) {
                    confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
                }
            } catch(e) {}
        }

        function closeScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('hidden');
        }
        
        function showNote(key, segIdx, el, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const popup = document.getElementById('note-template');
            const content = document.getElementById('note-content');
            let noteData = null;
            
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) { 
                noteData = contentData.segments[segIdx].notes[key]; 
            } else if (allKeywords[key]) { 
                noteData = allKeywords[key]; 
            }
            
            if(!noteData) return;
            
            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-amber-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-amber-900 font-serif">${key}</h4>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-amber-700 mb-2 font-mono bg-orange-50 px-2 py-1 rounded inline-block">${noteData.zhuyin}</p>
                <p class="text-amber-800 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }

        function processTextWithNotes(text) {
            let processedText = marked.parse(text);
            const sortedKeys = Object.keys(allKeywords).sort((a, b) => b.length - a.length);
            
            sortedKeys.forEach(key => {
                const regex = new RegExp(`(?<!<[^>]*)${key}`, "g");
                processedText = processedText.replace(regex, `<span class="interactive-word bg-orange-50 px-1 rounded" onclick="showNote('${key}', undefined, this, event)">${key}</span>`);
            });
            return processedText;
        }

        // 語音播放優化：優先女聲，語速0.9，音調1.05，標點停頓
        async function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            
            let voices = window.speechSynthesis.getVoices();
            if (voices.length === 0) {
                await new Promise(resolve => {
                    const id = setInterval(() => {
                        voices = window.speechSynthesis.getVoices();
                        if (voices.length > 0) {
                            clearInterval(id);
                            resolve();
                        }
                    }, 100);
                });
            }

            // 優先選擇高品質女聲
            let targetVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW' || v.lang === 'zh-CN') && 
                (v.name.includes('Google 國語') || v.name.includes('Mei-Jia') || v.name.includes('Yating') || v.name.includes('Lili') || v.name.includes('Ting-Ting') || v.name.includes('Xiaoxiao')));
            
            if (!targetVoice) { 
                targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); 
            }
            if (!targetVoice) {
                targetVoice = voices.find(v => v.lang.startsWith('zh'));
            }

            // 增強斷句處理，遇到標點符號分割
            const chunks = text.split(/([，、。？！；：])/).reduce((acc, curr, i) => {
                if (i % 2 === 0) { 
                    if (curr.trim()) acc.push({ text: curr });
                } else { 
                    if (acc.length > 0) {
                        acc[acc.length - 1].text += curr;
                    }
                }
                return acc;
            }, []);

            if (chunks.length === 0) return;

            // 遞迴播放以確保每段設定生效
            const playNext = (index) => {
                if (index >= chunks.length) return;
                const utterance = new SpeechSynthesisUtterance(chunks[index].text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.9;  // 微調語速
                utterance.pitch = 1.05; // 稍高音調，更溫暖
                if (targetVoice) utterance.voice = targetVoice;
                
                utterance.onend = () => { playNext(index + 1); };
                window.speechSynthesis.speak(utterance);
            };

            playNext(0);
        }

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }
