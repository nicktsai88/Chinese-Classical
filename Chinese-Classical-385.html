                        </div>
                    </section>
                    <section>
                        <h2 class="text-2xl font-bold text-green-900 mb-6 font-serif flex items-center">
                            <i class="fas fa-highlighter mr-3 text-green-500"></i>修辭與寫作技巧
                        </h2>
                        <div class="space-y-4">
                            ${rhetoricHtml}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderChat(container) {
            const p = personas[currentPersona];
            container.innerHTML = `
                <div class="flex flex-col h-[600px] bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
                    <div class="bg-green-50 p-4 border-b border-green-100 flex items-center justify-between">
                        <div class="flex items-center">
                            <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center mr-3 border-2 border-green-200 shadow-sm overflow-hidden">
                                <i class="${p.icon} text-2xl text-${p.color}-600"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-900 text-lg">${p.name}</h3>
                                <p class="text-xs text-green-600 font-medium">AI 角色扮演中</p>
                            </div>
                        </div>
                        <select onchange="switchPersona(this.value)" class="text-sm border-green-200 rounded-lg shadow-sm focus:ring-2 focus:ring-green-500 focus:border-green-500 p-2 bg-white text-gray-700 outline-none">
                            <option value="scholar" ${currentPersona === 'scholar' ? 'selected' : ''}>含羞草精靈</option>
                            <option value="botanist" ${currentPersona === 'botanist' ? 'selected' : ''}>植物學家</option>
                            <option value="creator" ${currentPersona === 'creator' ? 'selected' : ''}>造物主</option>
                        </select>
                    </div>
                    
                    <div id="chat-messages" class="flex-grow overflow-y-auto p-6 bg-gray-50 space-y-6 custom-scrollbar">
                        <div class="chat-bubble chat-ai shadow-sm">
                            ${processTextWithNotes(p.intro)}

                    </div>

                    <div class="p-4 border-t border-gray-200 bg-white">
                        <form onsubmit="handleChatSubmit(event)" class="relative">
                            <input type="text" id="chat-input" class="w-full pl-5 pr-14 py-4 rounded-full border border-gray-300 focus:border-green-500 focus:ring-4 focus:ring-green-100 focus:outline-none transition text-gray-700 placeholder-gray-400 shadow-inner" placeholder="向 ${p.name} 提問...">
                            <button type="submit" class="absolute right-2 top-1/2 transform -translate-y-1/2 w-10 h-10 bg-green-600 text-white rounded-full hover:bg-green-700 flex items-center justify-center transition shadow-md hover:scale-105">
                                <i class="fas fa-paper-plane text-sm"></i>
                            </button>
                        </form>
                    </div>
                </div>
            `;
            
            if (chatHistory.length > 0) {
                // Keep history logic simpler for now
            }
        }

        function switchPersona(newPersona) {
            currentPersona = newPersona;
            chatHistory = []; 
            renderChat(document.getElementById('content-display'));
        }

        function renderQuiz(container) {
            let quizHtml = contentData.quiz.map((q, i) => {
                const val = ["A","B","C","D"];
                const isAnswered = userAnswers[i] !== undefined;
                const userAnswer = userAnswers[i];
                let feedback = '';
                let cardClass = "bg-white border border-gray-200 hover:border-green-300";
                let feedbackClass = "hidden mt-4 p-4 rounded-lg text-base bg-gray-50 border"; 
                
                if (isAnswered) {
                    feedbackClass = "mt-4 p-4 rounded-lg text-base animate-fade-in border"; 
                    if (userAnswer === q.ans) {
                        feedback = `<strong class="block mb-1 text-lg"><i class="fas fa-check-circle mr-2"></i>答對了！</strong>${q.exp}`;
                        cardClass = "bg-green-50/30 border border-green-500 shadow-sm";
                        feedbackClass += " bg-green-50 border-green-200 text-green-900";
                    } else {
                        const userOption = q.opts.find((opt, idx) => ["A","B","C","D"][idx] === userAnswer);
                        const correctOption = q.opts.find((opt, idx) => ["A","B","C","D"][idx] === q.ans);
                        feedback = `
                            <div class="mb-2">
                                <span class="block font-bold text-red-700 text-lg"><i class="fas fa-times-circle mr-2"></i>答錯了</span>
                                <span class="block text-gray-600 mt-1">您的答案：${userOption || userAnswer}</span>
                                <span class="block text-green-700 font-bold mt-1">正確答案：${correctOption}</span>
                            </div>
                            <div class="pt-2 border-t border-red-200 mt-2 text-gray-700">
                                <strong><i class="fas fa-lightbulb text-yellow-500 mr-1"></i>解析：</strong>${q.exp}
                            </div>
                        `;
                        cardClass = "bg-red-50/30 border border-red-500 shadow-sm";
                        feedbackClass += " bg-red-50 border-red-200 text-gray-800";
                    }
                }

                return `
                <div class="${cardClass} rounded-xl p-6 mb-8 shadow-sm transition-all duration-300" id="quiz-card-${i}">
                    <div class="flex items-start mb-4">
                        <span class="flex-shrink-0 w-8 h-8 bg-green-600 text-white rounded-full flex items-center justify-center font-bold mr-3 mt-1">${i+1}</span>
                        <p class="font-bold text-xl text-gray-800 leading-relaxed">${q.q}</p>
                    </div>
                    <div class="grid grid-cols-1 gap-3 pl-11">
                        ${q.opts.map((opt, optIdx) => {
                            const val = ["A","B","C","D"][optIdx];
                            const isChecked = userAnswer === val ? 'checked' : '';
                            const isDisabled = isAnswered ? 'disabled' : '';
                            const labelClass = isAnswered 
                                ? (val === q.ans ? 'bg-green-100 border-green-300 font-bold text-green-900' : (isChecked ? 'bg-red-100 border-red-300' : 'opacity-50'))
                                : 'hover:bg-green-50 hover:border-green-300 cursor-pointer bg-white';

                            return `
                            <label class="flex items-center p-4 rounded-lg border border-gray-200 transition group ${labelClass}">
                                <input type="radio" name="q-${i}" value="${val}" class="mr-3 text-green-600 focus:ring-green-500 w-5 h-5" onchange="checkAnswer(${i}, '${val}', '${q.ans}')" ${isChecked} ${isDisabled}>
                                <span class="text-lg">${opt}</span>
                            </label>
                            `;
                        }).join('')}
                    </div>
                    <div id="feedback-${i}" class="${feedbackClass}">${feedback}</div>
                </div>
            `}).join('');
            
            container.innerHTML = `
                <div class="max-w-3xl mx-auto pb-24">
                    <div class="text-center mb-10">
                        <span class="bg-teal-100 text-teal-800 px-3 py-1 rounded-full text-sm font-bold uppercase mb-2 inline-block">High Difficulty</span>
                        <h2 class="text-3xl font-bold text-gray-800 font-serif">隨堂測驗 (高難度)</h2>
                        <p class="text-gray-500 mt-2">共 20 題，請細心作答</p>
                    </div>
                    ${quizHtml}
                    
                    <!-- Submit Button Area -->
                    <div class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 p-4 shadow-[0_-5px_20px_rgba(0,0,0,0.1)] flex justify-center items-center z-40">
                         <button onclick="submitQuiz()" class="px-10 py-3 bg-gradient-to-r from-green-600 to-teal-600 hover:from-green-700 hover:to-teal-700 text-white font-bold rounded-full shadow-lg transition transform hover:scale-105 flex items-center text-lg">
                            <i class="fas fa-paper-plane mr-2"></i> 交卷並查看成績
                        </button>
                    </div>
                </div>
            `;
        }

        // [Tab Story] 抉擇之路 (RPG)
        const storyNodes = {
            start: {
                id: 'start',
                text: "你是路邊的一株含羞草，修煉百年，已具靈識。你平日里自詡為「真儒」，潔身自愛。今日，一個滿臉橫肉的無賴路過，伸手想要戲弄你...",
                imgPrompt: "Realistic style, oriental fantasy. A POV shot from a small plant's perspective looking up at a rude, giant human hand reaching down. The plant glows faintly green, symbolizing its spirit.",
                imageData: null,
                choices: [
                    { text: "立刻閉合葉片，展現氣節", next: "close" },
                    { text: "不為所動，看他能怎樣", next: "stay_open" }
                ]
            },
            close: {
                id: 'close',
                text: "你迅速收攏葉片，垂下枝條，如同君子拂袖而去，不屑與小人為伍。無賴見狀，覺得無趣，啐了一口便離開了。",
                imgPrompt: "Realistic style. A close up of a Mimosa plant with leaves folded tightly. The background shows the blurry back of a man walking away. The atmosphere is dignified.",
                imageData: null,
                choices: [
                    { text: "感嘆世風日下 (進入詩作意境)", next: "poem_path" }
                ]
            },
            stay_open: {
                id: 'stay_open',
                text: "你強忍著本能沒有閉合。無賴見你毫無反應，更加肆無忌憚地拉扯你的枝葉，甚至想把你連根拔起！你後悔莫及，失去了尊嚴也險些喪命。",
                imgPrompt: "Realistic style. A damaged plant with torn leaves held roughly by a dirty hand. The scene is chaotic and sad.",
                imageData: null,
                choices: [
                    { text: "施展法術逃脫 (Bad Ending)", next: "bad_end" }
                ]
            },
            poem_path: {
                id: 'poem_path',
                text: "你看著無賴的背影，心中湧起一股悲憤。野草尚且知羞，為何人卻無恥？這時，一位詩人路過，目睹了這一切，吟出了那首千古絕句...",
                imgPrompt: "Realistic style. An ancient Chinese poet in robes standing by the road, looking at the Mimosa plant with admiration and writing on a scroll. The sun is setting.",
                imageData: null,
                choices: [
                    { text: "聆聽詩句，修成正果 (True Ending)", next: "true_end" }
                ]
            },
            bad_end: {
                id: 'bad_end',
                text: "【Bad Ending: 氣節盡失】你雖然逃過一劫，但因為沒有堅持「不容褻玩」的原則，你的道行大損，變回了一株普通的雜草，再無靈性。",
                imgPrompt: "Realistic style. A withered, ordinary weed by a dusty road. No glow, no spirit. Gray and lifeless.",
                imageData: null,
                choices: [{ text: "重啟修煉", next: "start" }],
                isEnding: true
            },
            true_end: {
                id: 'true_end',
                text: "【True Ending: 草木君子】詩人的詩句流傳千古，你也因此成為了「知恥」的象徵。世人皆知含羞草似真儒，這份氣節讓你位列仙班，成為守護道德的草木之神。",
                imgPrompt: "Realistic style, oriental fantasy. A glowing, ethereal spirit of a scholar emerging from the Mimosa plant, surrounded by soft light and floating scrolls.",
                imageData: null,
                choices: [{ text: "重啟修煉", next: "start" }],
                isEnding: true,
                win: true
            }
        };

        function renderStory(container) {
            if(!window.currentStoryNode) window.currentStoryNode = 'start';
            const node = storyNodes[window.currentStoryNode];
            const localPath = `Chinese-Classical-385-images/rpg_${window.currentStoryNode}.jpg`;
            
            let imageContent = `
                <div class="w-full overflow-hidden rounded-t-xl bg-gray-100">
                    <img src="${localPath}" class="w-full h-auto fade-in-image" alt="場景圖" onerror="this.src='https://placehold.co/600x400?text=Image+Not+Found';">
                </div>
            `;

            container.innerHTML = `<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-green-100">${imageContent}<div class="p-8 sm:p-10"><div class="flex items-center mb-6 text-green-800 text-sm font-bold uppercase tracking-widest border-b border-green-100 pb-2"><i class="fas fa-compass mr-2"></i> 抉擇時刻</div><p class="text-xl sm:text-2xl leading-relaxed text-gray-800 mb-10 font-serif">${node.text}</p>${node.isEnding ? (node.win ? `<div class="text-center mb-8 text-green-700 font-bold text-2xl p-6 bg-green-50 rounded-xl border border-green-200 shadow-sm"><i class="fas fa-leaf mr-3"></i>氣節長存</div>` : `<div class="text-center mb-8 text-red-700 font-bold text-2xl p-6 bg-red-50 rounded-xl border border-red-200 shadow-sm"><i class="fas fa-skull-crossbones mr-3"></i>修煉失敗</div>`) : ''}<div class="grid gap-4">${node.choices.map(c => `<button onclick="nextStoryNode('${c.next}')" class="story-choice w-full py-5 px-8 bg-white hover:bg-green-50 border-2 border-green-200 hover:border-green-500 rounded-xl text-green-900 font-bold text-xl transition duration-200 flex items-center justify-between group shadow-sm hover:shadow-md text-left"><span>${c.text}</span><i class="fas fa-chevron-right text-green-300 group-hover:text-green-600 transition transform group-hover:translate-x-1"></i></button>`).join('')}</div></div></div>`;
            if(node.win) { try { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); } catch (e) { console.log("Confetti not loaded"); } }
        }

        function nextStoryNode(nodeId) {
            window.currentStoryNode = nodeId;
            renderStory(document.getElementById('content-display'));
        }
        
        function checkAnswer(idx, val, ans) {
            if (userAnswers[idx] !== undefined) return; 

            userAnswers[idx] = val; 
            
            const radios = document.getElementsByName(`q-${idx}`);
            for (let radio of radios) {
                radio.disabled = true;
                radio.parentElement.classList.add('disabled-label');
            }

            const feedbackEl = document.getElementById(`feedback-${idx}`);
            const card = document.getElementById(`quiz-card-${idx}`);
            const qData = contentData.quiz[idx];
            if (!feedbackEl || !card) return;
            
            feedbackEl.className = 'mt-4 p-4 rounded-lg text-base animate-fade-in border';
            card.classList.remove('bg-white');

            if (val === ans) {
                feedbackEl.innerHTML = `<strong class="block mb-1 text-lg"><i class="fas fa-check-circle mr-2"></i>答對了！</strong>${qData.exp}`;
                feedbackEl.classList.add('bg-green-50', 'border-green-200', 'text-green-900');
                card.classList.add('bg-green-50/30', 'border-green-500');
            } else {
                const correctOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === ans);
                const userOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === val);
                
                feedbackEl.innerHTML = `
                    <div class="mb-2">
                        <span class="block font-bold text-red-700 text-lg"><i class="fas fa-times-circle mr-2"></i>答錯了</span>
                        <span class="block text-gray-600 mt-1">您的答案：${userOption}</span>
                        <span class="block text-green-700 font-bold mt-1">正確答案：${correctOption}</span>
                    </div>
                    <div class="pt-2 border-t border-red-200 mt-2 text-gray-700">
                        <strong><i class="fas fa-lightbulb text-yellow-500 mr-1"></i>解析：</strong>${qData.exp}
                    </div>
                `;
                feedbackEl.classList.add('bg-red-50', 'border-red-200', 'text-gray-800');
                card.classList.add('bg-red-50/30', 'border-red-500');
            }
            feedbackEl.classList.remove('hidden');
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-green-600 font-bold text-5xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                if(score >= 80) {
                    confetti({
                        particleCount: 200,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } catch(e) {}
        }

        function closeScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('hidden');
        }
        
        function showNote(key, segIdx, el, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const popup = document.getElementById('note-template');
            const content = document.getElementById('note-content');
            let noteData = null;
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) { noteData = contentData.segments[segIdx].notes[key]; } else if (allKeywords[key]) { noteData = allKeywords[key]; }
            if(!noteData) return;
            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-green-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-green-900 font-serif">${key}</h4>
                    <span class="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-bold">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-gray-500 mb-2 font-mono bg-gray-50 px-2 py-1 rounded inline-block">${noteData.zhuyin}</p>
                <p class="text-gray-700 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }

        function processTextWithNotes(text) {
            let processedText = marked.parse(text);
            const sortedKeys = Object.keys(allKeywords).sort((a, b) => b.length - a.length);
            
            sortedKeys.forEach(key => {
                const regex = new RegExp(`(?<!<[^>]*)${key}`, "g");
                processedText = processedText.replace(regex, `<span class="interactive-word bg-green-50 px-1 rounded" onclick="showNote('${key}', undefined, this, event)">${key}</span>`);
            });
            return processedText;
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; 
            utterance.rate = 0.85; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            let targetVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW') && (v.name.includes('Google') || v.name.includes('Hanhan') || v.name.includes('Mei-Jia') || v.name.includes('Yating')));
            if (!targetVoice) { targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); }
            if (!targetVoice) { targetVoice = voices.find(v => v.lang.startsWith('zh')); }
            if (targetVoice) { utterance.voice = targetVoice; }
            utterance.onerror = (e) => { console.error("Speech synthesis error:", e); showError("語音播放發生錯誤，可能是瀏覽器限制或網路問題。"); };
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

        // Chat logic
        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="chat-bubble chat-user shadow-sm animate-fade-in">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="chat-bubble chat-ai shadow-sm"><div class="typing-dot"><i class="fas fa-ellipsis-h animate-pulse"></i></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(async () => {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                
                let responseText = "";
                const p = personas[currentPersona];
                
                // Mock responses since API is removed
                if (currentPersona === 'scholar') {
                    responseText = "吾乃草木之身，尚知禮義。汝為萬物之靈，豈可不知羞恥？望汝自重。";
                } else if (currentPersona === 'botanist') {
                    responseText = "這其實是很有趣的現象！含羞草的葉枕細胞受到刺激後，水分會迅速流失，導致葉片閉合。這是一種防禦機制喔。";
                } else {
                    responseText = "呵呵，世間萬物皆有靈。人若無恥，確實連草都不如啊。但我可沒把人造壞，是人心自己變壞了。";
                }

                chatBox.innerHTML += `<div class="chat-bubble chat-ai shadow-sm animate-fade-in">${marked.parse(responseText)}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

    </script>
