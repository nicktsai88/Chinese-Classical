            background: #ffe4e6; 
        }
        ::-webkit-scrollbar-thumb {
            background: #9f1239; /* rose-800 */
            border-radius: 4px;
        }

        /* 標籤樣式 */
        .tab-btn {
            position: relative;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #be123c; /* rose-700 */
            transition: width 0.3s ease;
        }
        .tab-btn.active {
            color: #881337; /* rose-900 */
            background-color: #ffe4e6; /* rose-100 */
        }
        .tab-btn.active::after {
            width: 100%;
        }

        /* 互動文字樣式 */
        .interactive-word {
            cursor: pointer;
            border-bottom: 2px dotted #e11d48;
            transition: all 0.2s;
            padding-bottom: 1px;
            position: relative;
            z-index: 20;
            color: #9f1239;
            font-weight: 600;
        }
        .interactive-word:hover {
            background-color: #fecdd3;
            color: #881337;
            border-bottom-style: solid;
        }

        /* 彈出註釋 */
        .note-popup {
            animation: fadeIn 0.2s ease-out;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }

        /* 懸停翻譯效果 */
        .hover-trans-container:hover .hover-translation {
            display: block;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 聊天氣泡 */
        .chat-bubble {
            max-width: 85%;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            position: relative;
            line-height: 1.6;
        }
        .chat-user {
            background-color: #fecdd3; /* Rose-200 */
            color: #881337;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .chat-ai {
            background-color: #fff;
            border: 1px solid #e2e8f0;
            color: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        
        /* 故事模式樣式 */
        .story-choice:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .fade-in-image {
            animation: fadeInImg 0.8s ease-out forwards;
        }
        @keyframes fadeInImg {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 地圖與關係圖樣式 */
        .map-node {
            cursor: pointer;
            transition: r 0.3s ease, fill 0.3s ease;
        }
        .map-node:hover {
            fill: #be123c; 
            r: 12;
            stroke: #ffe4e6;
            stroke-width: 3;
        }
        .tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            color: #4b5563;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            max-width: 260px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #fda4af;
        }
        
        /* 禁用狀態的樣式 */
        input[type="radio"]:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .disabled-label {
            cursor: not-allowed !important;
            opacity: 0.7;
        }
    </style>

                feedbackEl.innerHTML = `
                    <div class="mb-2">
                        <span class="block font-bold text-red-700 text-lg"><i class="fas fa-times-circle mr-2"></i>答錯了</span>
                        <span class="block text-gray-600 mt-1">您的答案：${userOption}</span>
                        <span class="block text-green-700 font-bold mt-1">正確答案：${correctOption}</span>
                    </div>
                    <div class="pt-2 border-t border-red-200 mt-2 text-gray-700">
                        <strong><i class="fas fa-lightbulb text-yellow-500 mr-1"></i>解析：</strong>${qData.exp}
                    </div>
                `;
                feedbackEl.classList.add('bg-red-50', 'border-red-200', 'text-gray-800');
                card.classList.add('bg-red-50/30', 'border-red-500');
            }
            feedbackEl.classList.remove('hidden');
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-rose-600 font-bold text-5xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                if(score >= 80) {
                    confetti({
                        particleCount: 200,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } catch(e) {}
        }

        function closeScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('hidden');
        }
        
        function showNote(key, segIdx, el, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const popup = document.getElementById('note-template');
            const content = document.getElementById('note-content');
            let noteData = null;
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) { noteData = contentData.segments[segIdx].notes[key]; } else if (allKeywords[key]) { noteData = allKeywords[key]; }
            if(!noteData) return;
            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-rose-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-rose-900 font-serif">${key}</h4>
                    <span class="text-xs bg-rose-100 text-rose-800 px-2 py-1 rounded-full font-bold">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-gray-500 mb-2 font-mono bg-gray-50 px-2 py-1 rounded inline-block">${noteData.zhuyin}</p>
                <p class="text-gray-700 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }

        function processTextWithNotes(text) {
            let processedText = marked.parse(text);
            const sortedKeys = Object.keys(allKeywords).sort((a, b) => b.length - a.length);
            
            sortedKeys.forEach(key => {
                const regex = new RegExp(`(?<!<[^>]*)${key}`, "g");
                processedText = processedText.replace(regex, `<span class="interactive-word bg-rose-50 px-1 rounded" onclick="showNote('${key}', undefined, this, event)">${key}</span>`);
            });
            return processedText;
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; 
            utterance.rate = 0.85; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            let targetVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW') && (v.name.includes('Google') || v.name.includes('Hanhan') || v.name.includes('Mei-Jia') || v.name.includes('Yating')));
            if (!targetVoice) { targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); }
            if (!targetVoice) { targetVoice = voices.find(v => v.lang.startsWith('zh')); }
            if (targetVoice) { utterance.voice = targetVoice; }
            utterance.onerror = (e) => { console.error("Speech synthesis error:", e); showError("語音播放發生錯誤，可能是瀏覽器限制或網路問題。"); };
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

        // Chat logic
        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="chat-bubble chat-user shadow-sm animate-fade-in">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="chat-bubble chat-ai shadow-sm"><div class="typing-dot"><i class="fas fa-ellipsis-h animate-pulse"></i></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(async () => {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                
                let responseText = "";
                const p = personas[currentPersona];
                
                // Mock responses since API is removed
                if (currentPersona === 'wangpan') {

                } else if (currentPersona === 'eunuch') {
                    responseText = "哼！雜家這是奉旨出巡！你們這些草民懂什麼？這些儀仗是皇家的體面。少廢話，快把好酒好菜端上來，不然雜家叫你們好看！";
                } else {
                    responseText = "官爺饒命啊！家裡僅剩的一點糧食都被你們拿走了，這日子真的沒法過了...求求你們高抬貴手吧...";
                }
                
                // Note: API integration removed as per request
                
                chatBox.innerHTML += `<div class="chat-bubble chat-ai shadow-sm animate-fade-in">${marked.parse(responseText)}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

        }

    </script>
