            { id: 2, category: "情節分析", question: "張相遇盜時，其他居民的反應為何？", options: ["與盜賊搏鬥", "準備酒食款待", "東逃西匿，躲藏起來", "報官抓人"], answer: 2, explanation: "文中云：「居民恐怕拿住，東逃西匿，連店主多去躲藏。」" },

            { id: 4, category: "人物心態", question: "群盜見張相「秀才乃肯自屈」，為何感到高興（大喜）？", options: ["因為可以搶劫秀才", "因為秀才願意降低身分與他們結交", "因為秀才帶了酒肉來", "因為秀才認識官府的人"], answer: 1, explanation: "強盜自認身分低微（貧疏），見讀書人（秀才）肯屈尊相交，故感到大喜。" },

            { id: 7, category: "細節觀察", question: "張相吃豬蹄時的動作「略擘一擘開」，「擘」的意思是？", options: ["用刀切開", "用牙齒咬", "用手分開、撕開", "用筷子夾"], answer: 2, explanation: "擘（ㄅㄛˋ）：用手分開（擘開）。" },
            { id: 8, category: "成語運用", question: "形容張相吃東西「狼吞虎嚥」，與下列哪個成語意思相反？", options: ["風捲殘雲", "細嚼慢嚥", "大快朵頤", "鯨吞蠶食"], answer: 1, explanation: "狼吞虎嚥形容吃東西又急又猛。細嚼慢嚥形容慢慢進食。" },

            { id: 21, category: "文化常識", question: "文中張相自稱「小生」，這是古代哪一種人的自稱？", options: ["老人的謙稱", "讀書人的謙稱", "商人的自稱", "官員的自稱"], answer: 1, explanation: "小生：傳統戲曲或古代讀書人（年輕男子）的自稱。" },
            { id: 22, category: "句義理解", question: "「直教劇盜也憐才」的「憐」，解釋為？", options: ["可憐", "憐憫", "愛惜、欣賞", "鄰居"], answer: 2, explanation: "憐才：愛惜人才。指連大強盜也懂得欣賞人才。" },
            { id: 23, category: "文意深究", question: "張相說：「欲就大夫求一醉飽」，稱強盜為「大夫」，用意是？", options: ["諷刺強盜假裝斯文", "害怕被殺，故用尊稱討好", "展現豪爽，視強盜為英雄豪傑而不以賊視之", "認錯人了"], answer: 2, explanation: "張相個性「倜儻有大度」，稱盜為大夫、將軍等，是視其為草莽英雄，展現不拘世俗的豪氣。" },
            { id: 24, category: "字形辨析", question: "下列選項中，字形完全正確的是？", options: ["巾漬（頭巾）", "魁梧（身材高大）", "醒醐灌頂", "狼吞虎煙"], answer: 1, explanation: "(A) 巾幘；(C) 醍醐；(D) 狼吞虎嚥。" },
            { id: 25, category: "綜合賞析", question: "關於這篇短文的寫作特色，下列敘述何者錯誤？", options: ["運用對話凸顯人物性格", "透過強盜的視角側面烘托主角的不凡", "結局悲慘，帶有警世意味", "語言帶有早期白話小說的風格（如：這、那、吃得）"], answer: 2, explanation: "結局是張相得到資助且後來做了宰相，並非悲慘結局。" }
        ];

        // --- State Management ---
        let currentState = {
            username: '',
            answers: {}, // { questionId: selectedOptionIndex }
            mistakes: [], // Array of question IDs
            favorites: [], // Array of question IDs
            filterMode: 'all' // 'all', 'mistakes', 'favorites'
        };

        // --- DOM Elements ---
        const views = {
            login: document.getElementById('view-login'),
            dashboard: document.getElementById('view-dashboard'),
            quiz: document.getElementById('view-quiz')
        };
        
        const ui = {
            usernameInput: document.getElementById('username'),
            userDisplay: document.getElementById('user-display'),
            usernameSpan: document.getElementById('username-span'),
            quickLoginArea: document.getElementById('quick-login-area'),
            recentUsersList: document.getElementById('recent-users-list'),
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            
            // Dashboard Elements
            dashMistakeCount: document.getElementById('dash-mistake-count'),
            dashFavoriteCount: document.getElementById('dash-favorite-count'),

            // Quiz Elements
            quizContainer: document.getElementById('quiz-list-container'),
            statCorrect: document.getElementById('stat-correct'),
            statWrong: document.getElementById('stat-wrong'),
            emptyStateMsg: document.getElementById('empty-state-msg'),
            modeIndicator: document.getElementById('mode-indicator')
        };

        // --- Initialization ---
        function init() {
            if (isFirebaseReady) {
                // Listen to Global Users
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                onSnapshot(globalRef, (docSnap) => {
                    updateConnectionStatus('success', '已連線');
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        renderRecentUsers(data.users || []);
                    } else {
                        renderRecentUsers([]);
                    }
                }, (error) => {
                    console.error("Global listen error", error);
                    updateConnectionStatus('error', '同步失敗');
                });
            } else {
                renderRecentUsers([]); 
            }
        }

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot';
            if (type === 'loading') ui.statusDot.classList.add('status-loading');
            else if (type === 'success') ui.statusDot.classList.add('status-success');
            else if (type === 'error') ui.statusDot.classList.add('status-error');
        }

        function renderRecentUsers(users) {
            if (users && users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = '';
                users.forEach(user => {
                    const btn = document.createElement('button');
                    btn.className = 'px-3 py-1 bg-gray-50 hover:bg-orange-50 text-gray-600 hover:text-orange-600 rounded-full text-xs border border-gray-200 transition';
                    btn.textContent = user;
                    btn.onclick = () => quickLogin(user);
                    ui.recentUsersList.appendChild(btn);
                });
            } else {
                 ui.quickLoginArea.classList.add('hidden');
            }
        }

        // --- Login Logic ---
        window.quickLogin = function(name) {
            ui.usernameInput.value = name;
            window.attemptLogin();
        }

        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) {
                alert('請輸入姓名');
                return;
            }
            
            currentState.username = name;
            
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                setDoc(globalRef, { users: arrayUnion(name) }, { merge: true }).catch(console.error);
                startUserListener(name);
            } else {
                renderDashboard(); // Offline fallback
            }

            ui.userDisplay.classList.remove('hidden');
            ui.userDisplay.classList.add('flex');
            ui.usernameSpan.textContent = name;
            
            // Go to Dashboard instead of Quiz directly
            switchView('dashboard');
        }

        function startUserListener(username) {
            if (currentUserUnsubscribe) currentUserUnsubscribe();

            const userRef = doc(db, COLLECTION_NAME, username);
            
            currentUserUnsubscribe = onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    if (data.progress && data.progress.answers) {
                        currentState.answers = data.progress.answers;
                    }
                    if (data.mistakes) currentState.mistakes = data.mistakes;
                    if (data.favorites) currentState.favorites = data.favorites;

                    // Update dashboard counts in real-time
                    renderDashboard();
                    
                    // If user is currently in quiz mode, re-render quiz too
                    if (!views.quiz.classList.contains('hidden')) {
                        renderWaterfallQuiz();
                        updateStats();
                    }
                } else {
                    renderDashboard();
                }
            });
        }

        function switchView(viewName) {
            views.login.classList.add('hidden');
            views.dashboard.classList.add('hidden');
            views.quiz.classList.add('hidden');
            
            views[viewName].classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // --- Dashboard Logic ---
        function renderDashboard() {
            ui.dashMistakeCount.textContent = currentState.mistakes.length;
            ui.dashFavoriteCount.textContent = currentState.favorites.length;
        }

        window.enterMode = function(mode) {
            currentState.filterMode = mode;
            
            // Update Indicator Text
            const map = {
                'all': '全部題目',
                'mistakes': '錯題本',
                'favorites': '我的最愛'
            };
            ui.modeIndicator.textContent = map[mode];
            
            // Style Indicator
            if (mode === 'mistakes') {
                ui.modeIndicator.className = 'text-sm font-bold text-red-700 bg-red-50 px-3 py-1 rounded-full border border-red-100';
            } else if (mode === 'favorites') {
                ui.modeIndicator.className = 'text-sm font-bold text-amber-700 bg-amber-50 px-3 py-1 rounded-full border border-amber-100';
            } else {
                ui.modeIndicator.className = 'text-sm font-bold text-gray-700 bg-gray-100 px-3 py-1 rounded-full';
            }

            renderWaterfallQuiz();
            updateStats();
            switchView('quiz');
        }

        // --- Waterfall Quiz Logic ---
        function renderWaterfallQuiz() {
            const container = ui.quizContainer;
            container.innerHTML = ''; 

            const { filterMode, mistakes, favorites } = currentState;
            let questionsToRender = questionsData;
            let fontSizeTitle = 'text-xl md:text-2xl'; // Default size
            let fontSizeExplain = 'text-lg'; // Default size

            if (filterMode === 'mistakes') {
                questionsToRender = questionsData.filter(q => mistakes.includes(q.id));
                fontSizeTitle = 'text-2xl md:text-3xl'; // Larger for review
                fontSizeExplain = 'text-xl'; 
            } else if (filterMode === 'favorites') {
                questionsToRender = questionsData.filter(q => favorites.includes(q.id));
                fontSizeTitle = 'text-2xl md:text-3xl';
                fontSizeExplain = 'text-xl';
            }

            // Empty State
            if (questionsToRender.length === 0) {
                ui.emptyStateMsg.classList.remove('hidden');
                return;
            } else {
                ui.emptyStateMsg.classList.add('hidden');
            }

            questionsToRender.forEach((q, index) => {
                const answeredIdx = currentState.answers[q.id];
                const isAnswered = answeredIdx !== undefined;
                const isCorrect = isAnswered && answeredIdx === q.answer;
                const isFavorite = currentState.favorites.includes(q.id);

                // Card Styling
                let borderClass = 'border border-gray-100';
                let bgClass = 'bg-white';
                if (isAnswered) {
                    if (isCorrect) {
                        borderClass = 'border-l-4 border-l-green-500 border-gray-100';
                        bgClass = 'bg-green-50/20';
                    } else {
                        borderClass = 'border-l-4 border-l-red-500 border-gray-100';
                        bgClass = 'bg-red-50/20';
                    }
                }

                const card = document.createElement('div');
                card.id = `card-${q.id}`;
                card.className = `relative rounded-xl shadow-sm p-6 transition-all duration-300 ${borderClass} ${bgClass}`;
                
                // Star Button Logic
                const starClass = isFavorite ? 'text-amber-400' : 'text-gray-200 hover:text-amber-300';
                
                // Header (Question)
                const headerHtml = `
                    <button onclick="window.toggleFavorite(${q.id})" class="absolute top-4 right-4 p-2 focus:outline-none transition transform hover:scale-110 z-10" title="${isFavorite ? '取消收藏' : '加入最愛'}">
                        <i id="star-${q.id}" class="fas fa-star text-2xl ${starClass}"></i>
                    </button>
                    <div class="flex justify-between items-start mb-5 pr-8">
                        <div class="flex items-start gap-3 w-full">
                            <span class="flex-shrink-0 bg-orange-100 text-orange-700 font-bold rounded-md px-2.5 py-1 text-sm mt-1">#${filterMode === 'all' ? q.id : index + 1}</span>
                            <h3 class="${fontSizeTitle} font-bold text-gray-800 leading-relaxed serif">${q.question}</h3>
                        </div>
                    </div>
                `;

                // Options
                let optionsHtml = '<div class="grid gap-3">';
                q.options.forEach((opt, optIdx) => {
                    const letters = ['A','B','C','D'];
                    let btnClass = 'bg-white border border-gray-200 hover:border-orange-300 hover:bg-orange-50 text-gray-600';
                    let circleClass = 'bg-gray-100 text-gray-500';
                    let iconHtml = '';

                    if (isAnswered) {
                        btnClass = 'cursor-default'; 
                        
                        if (optIdx === q.answer) {
                            btnClass = 'bg-green-50 border-green-200 text-green-800';
                            circleClass = 'bg-green-500 text-white';
                            iconHtml = '<i class="fas fa-check text-green-600 ml-auto"></i>';
                        } else if (optIdx === answeredIdx && !isCorrect) {
                            btnClass = 'bg-red-50 border-red-200 text-red-800';
                            circleClass = 'bg-red-500 text-white';
                            iconHtml = '<i class="fas fa-times text-red-600 ml-auto"></i>';
                        } else {
                            btnClass = 'bg-white border-gray-100 text-gray-300 opacity-60';
                        }
                    }

                    optionsHtml += `
                        <button onclick="window.handleAnswer(${q.id}, ${optIdx})" 
                                ${isAnswered ? 'disabled' : ''}
                                class="option-btn w-full text-left p-4 rounded-lg flex items-center group transition-all duration-200 ${btnClass}">
                            <span class="w-8 h-8 flex items-center justify-center rounded-full font-bold mr-4 text-sm flex-shrink-0 transition-colors ${circleClass}">${letters[optIdx]}</span>
                            <span class="font-medium text-lg leading-relaxed">${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation
                let explanationHtml = '';
                const shouldShowExplanation = isAnswered || (filterMode !== 'all');

                if (shouldShowExplanation) {
                    explanationHtml = `
                        <div class="mt-6 bg-orange-50/50 p-5 rounded-xl border border-orange-100 animate-fade-in-up">
                            <div class="flex items-start gap-3">
                                <i class="fas fa-lightbulb text-orange-500 text-xl mt-1"></i>
                                <div>
                                    <span class="font-bold text-orange-800 block mb-1">解析：</span>
                                    <p class="text-gray-700 ${fontSizeExplain} leading-relaxed text-justify">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });
        }

        // --- Interaction Logic ---

        window.toggleFavorite = function(qId) {
            const idx = currentState.favorites.indexOf(qId);
            const isFav = idx !== -1;
            const starIcon = document.getElementById(`star-${qId}`);

            if (isFav) {
                // Remove
                currentState.favorites.splice(idx, 1);
                if(starIcon) starIcon.className = 'fas fa-star text-2xl text-gray-200 hover:text-amber-300';
                
                if (isFirebaseReady && currentState.username) {
                    const userRef = doc(db, COLLECTION_NAME, currentState.username);
                    updateDoc(userRef, { favorites: arrayRemove(qId) }).catch(console.error);
                }
            } else {
                // Add
                currentState.favorites.push(qId);
                if(starIcon) starIcon.className = 'fas fa-star text-2xl text-amber-400 star-animate';
                
                if (isFirebaseReady && currentState.username) {
                    const userRef = doc(db, COLLECTION_NAME, currentState.username);
                    updateDoc(userRef, { favorites: arrayUnion(qId) }).catch(console.error);
                }
            }
            
            // Refresh counts on Dashboard
            renderDashboard();

            // If in favorites mode, remove the card visually
            if (currentState.filterMode === 'favorites') {
                setTimeout(() => renderWaterfallQuiz(), 200);
            }
        }

        window.handleAnswer = function(qId, selectedIdx) {
            const q = questionsData.find(x => x.id === qId);
            if(!q) return;

            currentState.answers[q.id] = selectedIdx;
            
            const isCorrect = selectedIdx === q.answer;
            if (!isCorrect) {
                if (!currentState.mistakes.includes(q.id)) {
                    currentState.mistakes.push(q.id);
                    if (isFirebaseReady && currentState.username) {
                        const userRef = doc(db, COLLECTION_NAME, currentState.username);
                        updateDoc(userRef, { mistakes: arrayUnion(q.id) }).catch(console.error);
                    }
                }
            }

            if (isFirebaseReady && currentState.username) {
                const userRef = doc(db, COLLECTION_NAME, currentState.username);
                setDoc(userRef, { 
                    progress: {
                        answers: currentState.answers,
                        timestamp: new Date().getTime()
                    }
                }, { merge: true }).catch(console.error);
            }

            renderWaterfallQuiz();
            updateStats();
            renderDashboard(); // Update dashboard counts
        }

        window.resetCurrentAnswers = function() {
            if(confirm("確定要重置「當前作答狀態」嗎？")) {
                currentState.answers = {};
                if (isFirebaseReady && currentState.username) {
                    const userRef = doc(db, COLLECTION_NAME, currentState.username);
                    updateDoc(userRef, { "progress.answers": {} }).catch(console.error);
                }
                renderWaterfallQuiz();
                updateStats();
            }
        }

        function updateStats() {
            let correct = 0;
            let wrong = 0;
            Object.keys(currentState.answers).forEach(qId => {
                const q = questionsData.find(x => x.id == qId);
                if (q) {
                    if (currentState.answers[qId] === q.answer) correct++;
                    else wrong++;
                }
            });
            ui.statCorrect.textContent = correct;
            ui.statWrong.textContent = wrong;
        }

        window.logout = function() {
            if (confirm("確定要登出嗎？")) {
                if (currentUserUnsubscribe) currentUserUnsubscribe();
                currentState.username = '';
                currentState.answers = {};
                currentState.mistakes = [];
                currentState.favorites = [];
                currentState.filterMode = 'all';
                ui.usernameInput.value = '';
                
                switchView('login');
            }
        }
        
        window.goHome = function() {
            if (currentState.username) {
               switchView('dashboard');
            } else {
                switchView('login');
            }
        }

        init();
    </script>
</body>
</html>
