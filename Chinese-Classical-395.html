        /* 標籤樣式 */
        .tab-btn {
            position: relative;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #d97706; /* amber-600 */
            transition: width 0.3s ease;
        }
        .tab-btn.active {
            color: #92400e; /* amber-800 */
            background-color: #fef3c7; /* amber-100 */
        }
        .tab-btn.active::after {
            width: 100%;
        }

        /* 互動文字樣式 */
        .interactive-word {
            cursor: pointer;
            border-bottom: 2px dotted #f59e0b; /* amber-500 */
            transition: all 0.2s;
            padding-bottom: 1px;
            position: relative;
            z-index: 20;
            color: #b45309; /* amber-700 */
            font-weight: 600;
        }
        .interactive-word:hover {
            background-color: #ffedd5; /* orange-100 */
            color: #9a3412; /* orange-900 */
            border-bottom-style: solid;
        }

        /* 彈出註釋 */
        .note-popup {
            animation: fadeIn 0.2s ease-out;
            box-shadow: 0 10px 25px -5px rgba(251, 191, 36, 0.2), 0 8px 10px -6px rgba(251, 191, 36, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }

        /* 懸停翻譯效果 */
        .hover-trans-container:hover .hover-translation {
            display: block;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 聊天氣泡 */
        .chat-bubble {
            max-width: 85%;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            position: relative;
            line-height: 1.6;
        }
        .chat-user {
            background-color: #ffedd5; /* Orange-100 */
            color: #9a3412;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .chat-ai {
            background-color: #fff;
            border: 1px solid #fed7aa;
            color: #78350f;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        
        /* 故事模式樣式 */
        .story-choice:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(217, 119, 6, 0.1), 0 2px 4px -1px rgba(217, 119, 6, 0.06);
        }
        .fade-in-image {
            animation: fadeInImg 0.8s ease-out forwards;
        }
        @keyframes fadeInImg {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 地圖與關係圖樣式 */
        .map-node {
            cursor: pointer;
            transition: r 0.3s ease, fill 0.3s ease;
        }
        .map-node:hover {
            fill: #d97706; 
            r: 12;
            stroke: #fffbeb;
            stroke-width: 3;
        }
        .tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            color: #78350f;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;

            z-index: 100;
            max-width: 260px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #fcd34d;
        }
        
        /* 禁用狀態的樣式 */

            cursor: not-allowed;
            opacity: 0.6;
        }
        .disabled-label {
            cursor: not-allowed !important;
            opacity: 0.7;
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-amber-600 font-bold text-5xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                if(score >= 80) {
                    confetti({
                        particleCount: 200,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } catch(e) {}
        }

            if(!noteData) return;
            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-amber-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-amber-900 font-serif">${key}</h4>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-gray-500 mb-2 font-mono bg-orange-50 px-2 py-1 rounded inline-block">${noteData.zhuyin}</p>
                <p class="text-amber-800 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }

        function processTextWithNotes(text) {
            let processedText = marked.parse(text);
            const sortedKeys = Object.keys(allKeywords).sort((a, b) => b.length - a.length);
            
            sortedKeys.forEach(key => {
                const regex = new RegExp(`(?<!<[^>]*)${key}`, "g");
                processedText = processedText.replace(regex, `<span class="interactive-word bg-amber-50 px-1 rounded" onclick="showNote('${key}', undefined, this, event)">${key}</span>`);
            });
            return processedText;
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; 
            utterance.rate = 0.85; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            let targetVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW') && (v.name.includes('Google') || v.name.includes('Hanhan') || v.name.includes('Mei-Jia') || v.name.includes('Yating')));
            if (!targetVoice) { targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); }
            if (!targetVoice) { targetVoice = voices.find(v => v.lang.startsWith('zh')); }
            if (targetVoice) { utterance.voice = targetVoice; }
            utterance.onerror = (e) => { console.error("Speech synthesis error:", e); showError("語音播放發生錯誤，可能是瀏覽器限制或網路問題。"); };
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

        // Chat logic
        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="chat-bubble chat-user shadow-sm animate-fade-in">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="chat-bubble chat-ai shadow-sm"><div class="typing-dot"><i class="fas fa-ellipsis-h animate-pulse"></i></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(async () => {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                
                let responseText = "";
                const p = personas[currentPersona];
                
                // Mock responses since API is removed
                if (currentPersona === 'zengguofan') {
                    responseText = "賢弟，火災既已發生，多慮無益。唯有平心靜氣，方能妥善善後。若因此而疑神疑鬼，反倒給了外人可乘之機。切記，切記。";
                } else if (currentPersona === 'zengguoquan') {
                    responseText = "兄長教訓的是，但我這心裡還是七上八下的。這火燒得蹊蹺，我不信完全是意外！不過既然兄長這麼說，我暫且忍耐便是。";
                } else {
                    responseText = "孩子啊，錢財是身外之物，去了還會再來。人平安就是最大的福分。把這當作是消災解厄，心裡就舒坦了。";
                }

                chatBox.innerHTML += `<div class="chat-bubble chat-ai shadow-sm animate-fade-in">${marked.parse(responseText)}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

    </script>
