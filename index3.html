<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古文閱讀題庫總部</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Import Map for Firebase -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
        }
      }
    </script>

    <style>
        :root {
            --bg: #fffaf5;
            --text-main: #4e342e;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(#fbe9e7 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: var(--text-main);
        }

        h1, h2, .font-serif { font-family: 'Noto Serif TC', serif; }

        /* 卡片網格佈局 - 回歸原本較寬鬆的卡片排列 */
        .app-grid {
            display: grid;
            /* 讓卡片寬度保持在 260px 以上，自動填滿 */
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 40px;
        }

        /* 卡片基礎樣式 - 模仿原本的設計 */
        .app-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s, filter 0.3s;
            border-top: 6px solid #ccc; /* 預設顏色，會被 JS 覆蓋 */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative; /* 為了讓 Checkbox 絕對定位 */
            border: 1px solid rgba(0,0,0,0.05);
            min-height: 180px; /* 確保卡片高度一致 */
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }

        /* 圖示區塊 */
        .card-icon-wrapper {
            font-size: 2.5em;
            margin-bottom: 10px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5; /* 預設背景 */
        }

        /* 標題 */
        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2em;
            font-weight: 900;
            margin-bottom: 8px;
            line-height: 1.4;
            color: #444;
            flex-grow: 1; /* 讓標題佔據中間空間 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 代碼標籤 */
        .card-desc {
            font-size: 0.85em;
            color: #888;
            background: #f9f9f9;
            padding: 4px 10px;
            border-radius: 20px;
            font-family: monospace;
            margin-top: auto; /* 推到底部 */
        }

        /* 手動 Checkbox - 定位在右上角 */
        .card-checkbox {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10; /* 確保在連結之上 */
        }
        
        .card-checkbox:hover {
            border-color: #ff7043;
            transform: scale(1.1);
        }

        .card-checkbox.checked {
            background: #ff7043;
            border-color: #ff7043;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        /* 練習題特別標示 */
        .is-exercise-card {
            background-color: #fffbf5; /* 微微的暖黃底色 */
        }

        /* 主題樣式 (Inject via Style Prop usually, but keeping classes for structure) */
        .theme-blue { --theme-color: #3949ab; --theme-light: #e8eaf6; }
        .theme-teal { --theme-color: #00897b; --theme-light: #e0f2f1; }
        .theme-orange { --theme-color: #f57c00; --theme-light: #fff3e0; }
        .theme-purple { --theme-color: #7b1fa2; --theme-light: #f3e5f5; }
        .theme-brown { --theme-color: #795548; --theme-light: #efebe9; }

        /* 按鈕與燈號樣式 */
        .home-btn {
            background: linear-gradient(135deg, #ff7043 0%, #ff8a65 100%);
            box-shadow: 0 4px 10px rgba(255, 112, 67, 0.3);
            transition: all 0.3s ease;
        }
        .home-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255, 112, 67, 0.4); }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-loading { background-color: #fdd835; box-shadow: 0 0 5px #fdd835; }
        .status-success { background-color: #4caf50; box-shadow: 0 0 5px #4caf50; }
        .status-error { background-color: #ef5350; box-shadow: 0 0 5px #ef5350; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }

        .section-divider {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            margin: 40px 0 20px 0;
            color: #5d4037;
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5em;
            font-weight: bold;
        }
        .section-divider::before, .section-divider::after {
            content: "";
            flex: 1;
            border-bottom: 2px solid #e0e0e0;
        }
        .section-divider::before { margin-right: 15px; }
        .section-divider::after { margin-left: 15px; }

    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, doc, setDoc, updateDoc, getDoc, onSnapshot, arrayUnion } from "firebase/firestore";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "firebase/auth";

        // ==========================================
        // 1. Firebase 設定
        // ==========================================
        
        // ★★★ 請在此處填入您的 Firebase Config ★★★
        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: ""
        };

        const COLLECTION_NAME = 'Chinese-Classical';
        const DOC_GLOBAL = 'global';

        let app, db, auth;
        let isFirebaseReady = false;

        try {
            if (firebaseConfig.apiKey) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                
                const initAuth = async () => {
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                        isFirebaseReady = true;
                        console.log("Firebase initialized.");
                    } catch (e) {
                        console.error("Auth failed:", e);
                    }
                };
                initAuth();
            } else {
                console.warn("Offline mode.");
            }
        } catch (e) {
            console.error("Firebase init failed:", e);
        }

        // ==========================================
        // 2. 資料結構 (Raw Data)
        // ==========================================
        const generateRawData = () => {
            // 為每個章節指定顏色代碼與圖示
            const sections = [

                { name: "吳敏男 - 第一輯下冊", themeClass: "theme-teal", color: "#00897b", lightColor: "#e0f2f1", icon: "🎋", range: [81, 168],
                  titles: ["逾淮為枳", "晏子使楚", "曷為不祥", "曾子殺人", "狐假虎威", "鷸蚌相爭", "畫蛇添足", "物類平等", "日近日遠", "螳螂捕蟬", "叔敖埋蛇", "荀巨伯仗義退賊", "王藍田忿食雞子", "鍾毓、鍾會", "王戎不摘路邊李", "王祥事後母", "王恭無長物", "桓公心地仁厚", "辨盜鐘", "認履", "單衣順母", "扇枕溫衾", "懷橘遺親", "金絲猿", "觀刈麥", "青出於藍", "春望", "出塞", "從軍行", "夜雨寄北", "花影", "蔡根譚", "舟", "美景勝概", "南柯夢幻", "婁敬不易旃衣", "柳敬亭說書", "知足自得", "却要", "天論", "猶疑不決", "鵲踏枝", "貴德", "偽病"] },
                { name: "吳敏男 - 第二輯", themeClass: "theme-orange", color: "#f57c00", lightColor: "#fff3e0", icon: "📙", range: [169, 292],
                  titles: ["不食嗟來食", "子夏喪明", "三人成虎", "和氏璧", "齊桓公好服紫", "郢書燕說", "衛女多私被休", "此一地，彼一地", "行罰救火", "燕雀偷安", "齊之好勇者", "大公無私祁黃羊", "明大義之腹䵍", "鄒忌諫齊王", "唐睢說信陵君", "趙王買馬", "歧路亡羊", "晉文公欲伐衛", "止盜在明教化", "齊人攫金", "魏公子與乳母", "王者貴天", "齊王嫁女", "皋魚之死", "御者妻", "孟嘗君將入秦", "鴻門宴", "孔子世家贊", "一鳴驚人", "負荊請罪", "陳涉太息壟上", "管鮑之交", "李將軍列傳", "梟逢鳩", "景公將殺圉人", "毋忘在莒", "緹縈救父", "斷機教子", "曲突徙薪", "疏廣答勸買田宅者", "三世不遇", "吝嗇的老人", "江上丈人", "桃花源記", "班超傳", "樂羊子之妻", "漢武帝赦乳母", "管寧與華歆", "舉目不見長安", "新亭對泣", "小時了了", "貧者士之常", "床頭捉刀人", "人不如木", "賈人渡河", "煮豆燃萁", "旅夜書懷", "月夜憶舍弟", "燕詩示劉叟", "江南春", "虞美人", "元日"] },
                { name: "文言文推與敲", themeClass: "theme-purple", color: "#7b1fa2", lightColor: "#f3e5f5", icon: "🖌️", range: [293, 448],
                  titles: ["覆水難收", "鳥", "白娘子永鎮雷峰塔", "懷橘遺親", "子罕辭寶", "晏子使楚", "肉脯可充饑", "恍惚", "山雞獻楚", "選-待人處事", "各司其職", "趙人鼠患", "晦翁語錄", "三豕涉河", "寄舍弟墨書", "孔雀愛尾", "烏賊求全", "地理", "六一居士傳", "牡丹與貓眼", "幽夢影:生活逸趣", "尹綽與赦厥", "扁鵲投石", "治國猶栽樹", "痴人說夢", "黠鼠賦", "貓號", "王積薪聞棋", "罵鴨", "不氣歌", "齊人攫金", "某甲", "菜根譚:待人處事", "戲題芭蕉", "斫樹取果", "農夫耕田", "推敲", "贈別", "穿胸國", "只為一堵牆", "旅夜書懷", "塞翁失馬", "金絲猿", "東方朔救乳母", "悲摯獸", "皋魚之泣", "含羞草", "張相遇盜", "葉公好龍", "戴高帽", "朝天子", "致浣弟書", "里仁為美", "訓儉示康", "蠹魚", "班超傳", "鴝鵒與禪", "三峽", "登泰山記", "後園作回文詩", "西湖香市", "晚遊六橋待月記", "齊桓公好服紫", "小重山", "吳興老狸", "口技", "殺青", "濟盜成良", "望洋興嘆", "戒子孫", "書感", "疏廣答勸買田宅者", "涉江采芙蓉", "澆灌竹木", "不食嗟來食", "慕賢", "紀水沙連", "台灣三字經序"] },
                { name: "古文素養攻略", themeClass: "theme-brown", color: "#795548", lightColor: "#efebe9", icon: "🍵", range: [449, 554],
                  titles: ["牛山嘆", "王母使者", "郭文救虎", "羅友", "海大魚", "劉勝項敗", "7-1遊戲汙瀆中", "7-2曳尾塗中", "秦士錄", "景林寺", "小石潭記", "飲酒詩", "12-1楊柳枝詞", "12-2詠柳", "13-1客舍悲秋", "13-2春日寄懷", "明月何皎皎", "哺雛詩", "滿江紅", "永遇樂/南鄉子", "大德歌", "吊古戰場文", "祭十二郎文", "火候須知", "飯", "五金", "官鍼", "書畫", "朽木為琴", "行軍", "謀攻", "將器", "珍寶", "知人", "任事", "范增非人傑", "深慮論", "咸宜", "北狄", "子從父孝乎?", "非薄鮑叔", "仲尼不知善賞", "親士", "隆中對", "誡兄子嚴敦書", "答盧諶書", "與孫季述書", "獄中上梁王書", "上書諫獵", "論積貯疏", "駁復讎議", "野廟碑", "祭鱷魚文"] }
            ];

            const result = [];
            
            sections.forEach(sec => {
                const sectionItems = [];
                let currentId = sec.range[0];
                
                sec.titles.forEach((title, index) => {
                    // 1. 本文
                    if (currentId <= sec.range[1]) {
                        sectionItems.push({
                            id: currentId,
                            code: `CC-${currentId}`,
                            title: `${index + 1}. ${title} (本文)`,
                            href: `Chinese-Classical-${currentId}.html`,
                            isExercise: false
                        });
                        currentId++;
                    }
                    
                    // 2. 練習題
                    if (currentId <= sec.range[1]) {
                        sectionItems.push({
                            id: currentId,
                            code: `CC-${currentId}`,
                            title: `${index + 1}. ${title} (練習題)`,
                            href: `Chinese-Classical-${currentId}.html`,
                            isExercise: true
                        });
                        currentId++;
                    }
                });

                result.push({
                    title: sec.name,
                    themeClass: sec.themeClass,
                    color: sec.color,
                    lightColor: sec.lightColor,
                    icon: sec.icon,
                    items: sectionItems
                });
            });

            return result;
        };

        const RAW_DATA = generateRawData();
        const TOTAL_ITEMS = 554; 

        // ==========================================
        // 3. React Components
        // ==========================================

        const { useState, useEffect, useMemo } = React;

        // Status Light Component
        const StatusLight = ({ status }) => {
            let dotClass = 'status-loading';
            let text = '連線中...';

            if (status === 'success') {
                dotClass = 'status-success';
                text = '已同步';
            } else if (status === 'error') {
                dotClass = 'status-error';
                text = '同步失敗';
            } else if (status === 'loading') {
                dotClass = 'status-loading';
                text = '讀取資料中...';
            } else {
                dotClass = ''; 
                text = '離線模式';
            }

            return (
                <div className="flex items-center text-xs text-gray-500 bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">
                    <span className={`status-dot ${dotClass}`}></span>
                    {text}
                </div>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useState(null); 
            const [allUsers, setAllUsers] = useState([]);
            const [localProgress, setLocalProgress] = useState({}); 
            const [loginName, setLoginName] = useState("");
            const [showLogin, setShowLogin] = useState(false);
            const [syncStatus, setSyncStatus] = useState("loading"); 

            const completedCount = useMemo(() => {
                return Object.values(localProgress).filter(v => v === true).length;
            }, [localProgress]);

            // Sync Logic
            useEffect(() => {
                if (!isFirebaseReady || !db) {
                    setSyncStatus("offline");
                    const saved = localStorage.getItem('cc_local_progress');
                    if (saved) setLocalProgress(JSON.parse(saved));
                    return;
                }

                const unsub = onSnapshot(doc(db, COLLECTION_NAME, DOC_GLOBAL), (docSnap) => {
                    if (docSnap.exists()) {
                        setAllUsers(docSnap.data().users || []);
                        if (syncStatus === 'loading') setSyncStatus('success');
                    } else {
                        setDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL), { users: [] }, { merge: true });
                        setAllUsers([]);
                        setSyncStatus('success');
                    }
                }, (error) => {
                    console.error("Fetch users error:", error);
                    setSyncStatus('error');
                });

                return () => unsub();
            }, []);

            useEffect(() => {
                if (!currentUser || !isFirebaseReady || !db) return;

                setSyncStatus('loading');
                const unsubUser = onSnapshot(doc(db, COLLECTION_NAME, currentUser), (docSnap) => {
                    if (docSnap.exists()) {
                        setLocalProgress(docSnap.data().progress || {});
                        setSyncStatus('success');
                    } else {
                        setLocalProgress({});
                        setSyncStatus('success');
                    }
                }, (err) => {
                    console.error("Sync progress error:", err);
                    setSyncStatus('error');
                });

                return () => unsubUser();
            }, [currentUser]);

            const handleLogin = async (name) => {
                if (!name.trim()) return;
                const uname = name.trim();
                
                if (isFirebaseReady && db) {
                    if (!allUsers.includes(uname)) {
                        try {
                            await updateDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL), {
                                users: arrayUnion(uname)
                            });
                        } catch (e) {
                            await setDoc(doc(db, COLLECTION_NAME, DOC_GLOBAL), {
                                users: arrayUnion(uname)
                            }, { merge: true });
                        }
                    }
                }
                
                setCurrentUser(uname);
                setShowLogin(false);
                setLoginName("");
            };

            const toggleProgress = async (code) => {
                const newVal = !localProgress[code];
                const newProgress = { ...localProgress, [code]: newVal };
                
                setLocalProgress(newProgress);

                if (currentUser && isFirebaseReady && db) {
                    try {
                        setSyncStatus('loading');
                        await setDoc(doc(db, COLLECTION_NAME, currentUser), {
                            progress: newProgress,
                            lastUpdated: new Date()
                        }, { merge: true });
                        setSyncStatus('success');
                    } catch (e) {
                        console.error("Save failed:", e);
                        setSyncStatus('error');
                    }
                } else {
                    localStorage.setItem('cc_local_progress', JSON.stringify(newProgress));
                }
            };

            return (
                <div className="max-w-[1200px] mx-auto relative">
                    
                    {/* Header */}
                    <div className="header">
                        <h1>📜 古文閱讀題庫總部</h1>
                        <div className="flex flex-col items-center gap-2">
                            <p className="mb-0">經典文言文・閱讀素養全集</p>
                            
                            <div className="flex items-center gap-4 mt-2">
                                <div className="text-lg font-bold text-[#5d4037] bg-white px-4 py-1 rounded-full shadow-sm border border-orange-100">
                                    目前進度：{completedCount} / {TOTAL_ITEMS}
                                </div>
                                <StatusLight status={syncStatus} />
                            </div>

                            <div className="mt-4 flex items-center gap-3">
                                {currentUser ? (
                                    <div className="flex items-center gap-2 animate-fade-in">
                                        <span className="text-sm text-gray-600">挑戰者：</span>
                                        <span className="font-bold text-orange-700 bg-orange-100 px-3 py-1 rounded-full">{currentUser}</span>
                                        <button 
                                            onClick={() => { setCurrentUser(null); setLocalProgress({}); }}
                                            className="text-xs text-gray-400 hover:text-gray-600 underline ml-2"
                                        >
                                            登出
                                        </button>
                                    </div>
                                ) : (
                                    <button 
                                        onClick={() => setShowLogin(true)}
                                        className="text-sm bg-white border border-orange-200 text-orange-600 px-4 py-1.5 rounded-full hover:bg-orange-50 transition shadow-sm font-bold"
                                    >
                                        👤 登入紀錄進度
                                    </button>
                                )}
                            </div>
                        </div>
                        
                        <div className="mt-6">
                            <a href="https://nicktsai88.github.io/List/" className="home-btn">
                                🎁 返回快樂學習百寶箱
                            </a>
                        </div>
                    </div>

                    {/* Login Modal */}
                    {showLogin && (
                        <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-50 backdrop-blur-sm" onClick={() => setShowLogin(false)}>
                            <div className="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm mx-4 animate-fade-in" onClick={e => e.stopPropagation()}>
                                <h3 className="text-xl font-bold text-center mb-4 text-[#4e342e] font-serif">選擇或建立使用者</h3>
                                <div className="max-h-40 overflow-y-auto mb-4 space-y-2 border-b pb-4">
                                    {allUsers.length > 0 ? (
                                        allUsers.map(u => (
                                            <button 
                                                key={u} 
                                                onClick={() => handleLogin(u)}
                                                className="w-full text-left px-4 py-2 hover:bg-orange-50 rounded-lg text-gray-700 font-medium transition flex justify-between items-center"
                                            >
                                                <span>{u}</span>
                                                <span className="text-gray-300 text-xs">➔</span>
                                            </button>
                                        ))
                                    ) : (
                                        <p className="text-center text-gray-400 text-sm py-2">尚無挑戰者紀錄，歡迎加入！</p>
                                    )}
                                </div>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        value={loginName}
                                        onChange={(e) => setLoginName(e.target.value)}
                                        placeholder="輸入新名字..." 
                                        className="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-300"
                                        onKeyDown={(e) => e.key === 'Enter' && handleLogin(loginName)}
                                    />
                                    <button 
                                        onClick={() => handleLogin(loginName)}
                                        className="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-600 transition"
                                    >
                                        加入
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Content Grid - Card Style */}
                    <div className="pb-20">
                        {RAW_DATA.map((section, idx) => (
                            <div key={idx} className="mb-12">
                                <div className="section-divider">{section.title}</div>
                                <div className="app-grid">
                                    {section.items.map((item) => {
                                        const isDone = !!localProgress[item.code];
                                        return (
                                            <a 
                                                key={item.code}
                                                href={item.href}
                                                target="_blank"
                                                className={`app-card ${item.isExercise ? 'is-exercise-card' : ''} group`}
                                                style={{
                                                    borderTopColor: section.color,
                                                    opacity: isDone ? 0.75 : 1,
                                                    filter: isDone ? 'grayscale(30%)' : 'none'
                                                }}
                                            >
                                                {/* 手動 Checkbox - 獨立於連結 */}
                                                <div 
                                                    className={`card-checkbox ${isDone ? 'checked' : ''}`} 
                                                    onClick={(e) => {
                                                        e.preventDefault();
                                                        e.stopPropagation();
                                                        toggleProgress(item.code);
                                                    }}
                                                    title={isDone ? "標記為未完成" : "標記為已完成"}
                                                >
                                                    {isDone && <span>✓</span>}
                                                </div>

                                                {/* 卡片內容 */}
                                                <div 
                                                    className="card-icon-wrapper"
                                                    style={{ 
                                                        color: section.color, 
                                                        backgroundColor: section.lightColor 
                                                    }}
                                                >
                                                    {section.icon}
                                                </div>
                                                
                                                <div className="card-title" style={{ color: section.color }}>
                                                    {item.title}
                                                </div>
                                                
                                                <div className="card-desc">
                                                    {item.code}
                                                </div>
                                            </a>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
