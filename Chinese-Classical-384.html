            { id: 17, category: "字形辨析", question: "下列選項中，「」內的字形何者完全正確？", options: ["披褐擁「廉」", "收「斂」骸骨", "眼花「繚」亂", "「鐮」刀割草"], answer: 3, explanation: "(A) 鐮；(B) 殮（收殮）；(C) 撩（眼花撩亂）。(D) 正確。" },
            { id: 18, category: "句型判斷", question: "「子非有喪，何哭之悲也？」屬於何種句型？", options: ["敘事句", "有無句", "疑問句", "感嘆句"], answer: 2, explanation: "這是一個疑問句，孔子詢問皋魚為何哭得如此悲傷。" },
            { id: 19, category: "文意推斷", question: "皋魚的三個過失，其共同的根本原因可以歸結為？", options: ["未能妥善管理時間", "未能平衡個人追求與人倫責任", "運氣不好，生不逢時", "缺乏良師益友的引導"], answer: 1, explanation: "三失分別對應：學業/親情、志向/君臣、交友。核心在於過度追求個人目標（學、志）或疏忽細節，導致人倫關係（親、君、友）的缺憾。" },
            { id: 20, category: "字義通同", question: "「十有三人」的「有」，通假字與用法同於下列何者？", options: ["無中生「有」", "吾「十有五」而志於學", "富有四海", "有求必應"], answer: 1, explanation: "「有」通「又」，用於整數與零數之間。與《論語》「吾十有五而志於學」用法相同。" },
            { id: 21, category: "倒裝句式", question: "「何哭之悲也」是倒裝句，還原後的語序應為？", options: ["悲何哭之也", "哭之何悲也", "哭何悲也（哭得多麼悲傷啊）", "何悲之哭也"], answer: 2, explanation: "此句為強調語氣，意即「哭得何等悲傷啊」。" },
            { id: 22, category: "文意理解", question: "皋魚曰：「少而學，遊諸侯」，此處「遊」的意思最接近？", options: ["遊戲玩耍", "游泳健身", "遊歷求官", "悠閒度日"], answer: 2, explanation: "戰國時代士人「遊諸侯」多指遊歷各國，尋求被國君賞識任用的機會。" },
            { id: 23, category: "主旨分析", question: "本篇故事的主旨，與下列哪一句《論語》的精神最相近？", options: ["學而时習之，不亦說乎", "父母在，不遠遊，遊必有方", "三人行，必有我師焉", "巧言令色，鮮矣仁"], answer: 1, explanation: "皋魚之痛在於遊歷在外而忽略奉養，正與「父母在，不遠遊」強調的孝道精神相呼應（或作為反面教材）。" },
            { id: 24, category: "進階思考", question: "「去而不可得見者，親也！」這句話流露出何種情感？", options: ["對親人離去的憤怒", "對生命無常的恐懼", "對無法再盡孝的絕望與痛悔", "對親人背棄自己的怨恨"], answer: 2, explanation: "「去」指去世。表達了親人離世後，永遠無法再相見、再盡孝的深切絕望。" },
            { id: 25, category: "綜合賞析", question: "關於本文的寫作特色，下列敘述何者錯誤？", options: ["以對話推動情節發展", "善用排比句式增強語氣", "運用譬喻修辭說明道理", "結尾孔子嚴厲批評了皋魚的愚蠢"], answer: 3, explanation: "孔子結尾說「弟子誡之，足以識矣」，是將其作為正面（或警惕）的教材，並無嚴厲批評，且開頭稱其為「賢者」。" }
        ];

        // --- State Management ---
        let currentState = {
            username: '',
            answers: {}, // { questionId: selectedOptionIndex }
            mistakes_history: [], // Array of question IDs (persistent)
            favorites: [], // Array of question IDs
            isFinished: false
        };

        // --- DOM Elements ---
        const ui = {
            viewLogin: document.getElementById('view-login'),
            viewDashboard: document.getElementById('view-dashboard'),
            viewQuizList: document.getElementById('view-quiz-list'),
            viewReviewList: document.getElementById('view-review-list'),
            
            usernameInput: document.getElementById('username'),
            userDisplay: document.getElementById('user-display'),
            usernameSpan: document.getElementById('username-span'),
            dashboardUsername: document.getElementById('dashboard-username'),
            
            quickLoginArea: document.getElementById('quick-login-area'),
            recentUsersList: document.getElementById('recent-users-list'),
            
            quizContainer: document.getElementById('quiz-list-container'),
            reviewContainer: document.getElementById('review-container'),
            
            stickyStats: document.getElementById('sticky-stats'),
            statCorrect: document.getElementById('stat-correct'),
            statWrong: document.getElementById('stat-wrong'),
            statProgress: document.getElementById('stat-progress'),
            
            finishBanner: document.getElementById('finish-banner'),
            reviewEmpty: document.getElementById('review-empty'),
            reviewTitle: document.getElementById('review-title'),
            reviewSubtitle: document.getElementById('review-subtitle'),
            reviewActions: document.getElementById('review-actions'),
            
            badgeMistakes: document.getElementById('badge-mistakes'),
            badgeFavorites: document.getElementById('badge-favorites'),

            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            
            btnBackToTop: document.getElementById('btn-back-to-top')
        };

        // --- Initialization ---
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            const __initial_auth_token = typeof window.__initial_auth_token !== 'undefined' ? window.__initial_auth_token : undefined;
            if (__initial_auth_token) {
                 signInWithCustomToken(auth, __initial_auth_token);
            } else {
                 signInAnonymously(auth).catch(console.error);
            }
            isFirebaseReady = true;
        } catch (e) {
            console.error("Firebase init error:", e);
            updateConnectionStatus('error', '雲端同步失敗');
        }

        function init() {
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                onSnapshot(globalRef, (docSnap) => {
                    updateConnectionStatus('success', '已同步');
                    if (docSnap.exists()) {
                        renderRecentUsers(docSnap.data().users || []);
                    } else {
                        renderRecentUsers([]);
                    }
                }, (error) => updateConnectionStatus('error', '連線異常'));
            }
        }

        // --- View Switching ---
        window.switchView = function(viewId) {
            [ui.viewLogin, ui.viewDashboard, ui.viewQuizList, ui.viewReviewList].forEach(el => el.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo(0, 0);

            // Toggle Sticky Stats
            if (viewId === 'view-quiz-list') {
                ui.stickyStats.classList.remove('hidden');
                setTimeout(() => ui.stickyStats.classList.remove('-translate-y-full'), 100);
            } else {
                ui.stickyStats.classList.add('-translate-y-full');
                setTimeout(() => ui.stickyStats.classList.add('hidden'), 300);
            }

            // Update Badges on Dashboard
            if (viewId === 'view-dashboard') {
                updateDashboardBadges();
            }
        }

        // --- Login Logic ---
        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) return alert('請輸入姓名');
            
            currentState.username = name;
            ui.usernameSpan.textContent = name;
            ui.dashboardUsername.textContent = name;
            ui.userDisplay.classList.remove('hidden');
            ui.userDisplay.classList.add('flex');

            if (isFirebaseReady) {
                // Add to global list
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                setDoc(globalRef, { users: arrayUnion(name) }, { merge: true });
                
                // Start user listener
                startUserListener(name);
            }
        };

        function startUserListener(username) {
            if (currentUserUnsubscribe) currentUserUnsubscribe();
            
            const userRef = doc(db, COLLECTION_NAME, username);
            currentUserUnsubscribe = onSnapshot(userRef, (docSnap) => {
                updateConnectionStatus('success', '資料同步中');
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.progress) {
                        currentState.answers = data.progress.answers || {};
                        currentState.isFinished = data.progress.isFinished || false;
                    } else {
                        currentState.answers = {};
                        currentState.isFinished = false;
                    }
                    // Load persistent lists
                    currentState.mistakes_history = data.mistakes_history || [];
                    currentState.favorites = data.favorites || [];
                    
                    updateDashboardBadges();

                    // If user is currently in quiz view, re-render
                    if (!ui.viewQuizList.classList.contains('hidden')) {
                        renderWaterfallQuiz();
                        updateStats();
                    } else if (!ui.viewReviewList.classList.contains('hidden')) {
                        // Refresh review list if data changed externally (simplified)
                    } else {
                         window.switchView('view-dashboard');
                    }
                } else {
                    // New User
                    window.switchView('view-dashboard');
                }
            });
        }

        window.quickLogin = function(name) {
            ui.usernameInput.value = name;
            window.attemptLogin();
        };

        function renderRecentUsers(users) {
            if (users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = users.map(u => 
                    `<button onclick="window.quickLogin('${u}')" class="px-4 py-2 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-full text-sm border border-orange-200 transition font-medium">
                        <i class="fas fa-user-circle mr-1"></i>${u}
                    </button>`
                ).join('');
            }
        }

        window.logout = function() {
            if(confirm('確定要登出嗎？')) {
                if(currentUserUnsubscribe) currentUserUnsubscribe();
                currentState.username = '';
                ui.usernameInput.value = '';
                ui.userDisplay.classList.add('hidden');
                window.switchView('view-login');
            }
        };

        function updateDashboardBadges() {
            const mCount = currentState.mistakes_history.length;
            const fCount = currentState.favorites.length;

            ui.badgeMistakes.textContent = mCount;
            ui.badgeMistakes.classList.toggle('hidden', mCount === 0);

            ui.badgeFavorites.textContent = fCount;
            ui.badgeFavorites.classList.toggle('hidden', fCount === 0);
        }

        // --- Waterfall Quiz Logic ---

        window.startWaterfallQuiz = function() {
            renderWaterfallQuiz();
            updateStats();
            window.switchView('view-quiz-list');
        };

        window.resetQuizProgress = function() {
            if(confirm('確定要重新測驗嗎？這會清空目前的答題進度，但「錯題本」與「收藏」會保留。')) {
                currentState.answers = {};
                currentState.isFinished = false;
                saveProgress(); // Reset Firestore progress
                renderWaterfallQuiz();
                updateStats();
                ui.finishBanner.classList.add('hidden');
                window.scrollTo(0,0);
            }
        };

        function renderWaterfallQuiz() {
            ui.quizContainer.innerHTML = '';
            
            questionsData.forEach((q, index) => {
                const userAns = currentState.answers[q.id];
                const isAnswered = userAns !== undefined;
                const isFav = currentState.favorites.includes(q.id);
                
                // Card styling
                let borderColor = isAnswered ? (userAns === q.answer ? 'border-green-300' : 'border-red-300') : 'border-transparent';
                let shadowClass = isAnswered ? 'shadow-md' : 'shadow-sm';
                let bgClass = 'bg-white';

                const card = document.createElement('div');
                card.id = `card-${q.id}`;
                card.className = `relative rounded-3xl ${shadowClass} border-2 ${borderColor} p-6 md:p-8 transition-all duration-500 ${bgClass}`;

                // Header
                const starIconClass = isFav ? "fas fa-star text-yellow-400" : "far fa-star text-gray-300 hover:text-yellow-400";
                
                const headerHtml = `
                    <div class="flex items-start gap-4 mb-6 relative">
                        <button onclick="window.toggleFavorite(${q.id}, this)" class="absolute top-0 right-0 p-2 text-2xl transition-transform active:scale-90 z-10">
                            <i class="${starIconClass}"></i>
                        </button>
                        <span class="flex-shrink-0 bg-orange-500 text-white font-bold rounded-lg px-3 py-2 text-lg shadow-sm font-mono mt-1">#${index + 1}</span>
                        <div class="pr-10">
                            <span class="inline-block bg-orange-100 text-orange-800 text-sm px-2 py-1 rounded font-bold mb-2">${q.category}</span>
                            <h3 class="text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed tracking-wide serif">${q.question}</h3>
                        </div>
                    </div>
                `;

                // Options
                let optionsHtml = '<div class="grid gap-4">';
                q.options.forEach((opt, optIdx) => {
                    let btnClass = "w-full text-left p-5 rounded-2xl border-2 flex items-center transition-all duration-200 group ";
                    let circleClass = "w-10 h-10 flex items-center justify-center rounded-full font-bold mr-4 text-lg flex-shrink-0 border-2 ";
                    let iconHtml = "";

                    if (isAnswered) {
                        // Locked State
                        if (optIdx === q.answer) {
                            btnClass += "bg-green-50 border-green-500 text-green-900 shadow-sm";
                            circleClass += "bg-green-500 text-white border-green-500";
                            iconHtml = '<i class="fas fa-check text-green-600 text-2xl ml-auto"></i>';
                        } else if (optIdx === userAns) {
                            btnClass += "bg-red-50 border-red-500 text-red-900 shadow-sm";
                            circleClass += "bg-red-500 text-white border-red-500";
                            iconHtml = '<i class="fas fa-times text-red-500 text-2xl ml-auto"></i>';
                        } else {
                            btnClass += "bg-gray-50 border-transparent text-gray-400 opacity-60";
                            circleClass += "bg-gray-200 text-gray-400 border-gray-200";
                        }
                    } else {
                        // Active State
                        btnClass += "bg-white border-gray-200 hover:border-orange-400 hover:bg-orange-50 hover:shadow-md cursor-pointer";
                        circleClass += "bg-gray-100 text-gray-500 group-hover:bg-orange-500 group-hover:text-white border-gray-200 group-hover:border-orange-500 transition-colors";
                    }

                    const clickAttr = isAnswered ? 'disabled' : `onclick="window.handleWaterfallAnswer(${index}, ${optIdx})"`;

                    optionsHtml += `
                        <button ${clickAttr} class="${btnClass}">
                            <span class="${circleClass}">${['A','B','C','D'][optIdx]}</span>
                            <span class="font-medium text-xl leading-8">${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation
                let explanationHtml = '';
                if (isAnswered) {
                    explanationHtml = `
                        <div class="mt-8 bg-amber-50 p-6 md:p-8 rounded-2xl border border-amber-200 animate-fade-in-up">
                            <div class="flex items-start gap-4">
                                <div class="bg-amber-100 p-2 rounded-full text-amber-600 mt-1">
                                    <i class="fas fa-lightbulb text-2xl"></i>
                                </div>
                                <div>
                                    <span class="font-bold text-amber-800 block mb-3 text-xl">解析：</span>
                                    <p class="text-gray-800 text-xl leading-9 text-justify font-medium">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                ui.quizContainer.appendChild(card);
            });

            // Check finish
            if (Object.keys(currentState.answers).length === questionsData.length && questionsData.length > 0) {
                ui.finishBanner.classList.remove('hidden');
            } else {
                ui.finishBanner.classList.add('hidden');
            }
        }

        window.handleWaterfallAnswer = function(qIndex, selectedIdx) {
            const q = questionsData[qIndex];
            if (currentState.answers[q.id] !== undefined) return;

            currentState.answers[q.id] = selectedIdx;
            
            // Logic: If wrong, add to persistent history immediately
            if (selectedIdx !== q.answer) {
                addToMistakesHistory(q.id);
            }
            
            saveProgress();
            renderWaterfallQuiz();
            updateStats();
        };

        // --- Favorites & Mistakes Logic ---

        window.toggleFavorite = function(qId, btnElement) {
            const icon = btnElement.querySelector('i');
            const isFav = currentState.favorites.includes(qId);
            
            // UI Feedback immediately
            icon.classList.add('star-click');
            setTimeout(() => icon.classList.remove('star-click'), 300);

            if (isFav) {
                // Remove
                currentState.favorites = currentState.favorites.filter(id => id !== qId);
                icon.className = "far fa-star text-gray-300 hover:text-yellow-400";
                updateFirestoreArray('favorites', qId, 'remove');
            } else {
                // Add
                currentState.favorites.push(qId);
                icon.className = "fas fa-star text-yellow-400";
                updateFirestoreArray('favorites', qId, 'add');
            }

            // If in Review Mode - Favorites, refresh list smartly (or just hide card)
            if (!ui.viewReviewList.classList.contains('hidden') && ui.reviewTitle.innerText.includes('我的最愛')) {
                 // Optional: remove card from DOM nicely
            }
        };

        function addToMistakesHistory(qId) {
            if (!currentState.mistakes_history.includes(qId)) {
                currentState.mistakes_history.push(qId);
                updateFirestoreArray('mistakes_history', qId, 'add');
            }
        }
        
        window.removeFromMistakes = function(qId) {
             currentState.mistakes_history = currentState.mistakes_history.filter(id => id !== qId);
             updateFirestoreArray('mistakes_history', qId, 'remove');
             // Refresh Review List
             window.startReviewMode('mistakes');
        };

        window.clearMistakes = function() {
            if(confirm('確定要清空所有錯題紀錄嗎？')) {
                const userRef = doc(db, COLLECTION_NAME, currentState.username);
                setDoc(userRef, { mistakes_history: [] }, { merge: true });
                currentState.mistakes_history = [];
                window.startReviewMode('mistakes');
            }
        }

        function updateFirestoreArray(field, value, action) {
            if (!isFirebaseReady || !currentState.username) return;
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const data = {};
            // Using arrayUnion/arrayRemove for atomic updates
            if (action === 'add') {
                data[field] = arrayUnion(value);
            } else {
                data[field] = arrayRemove(value);
            }
            updateDoc(userRef, data).catch(console.error);
        }

        // --- Review Mode Logic ---

        window.startReviewMode = function(type) {
            let targetIds = [];
            let title = "";
            let subtitle = "";
            let actionHtml = "";

            if (type === 'mistakes') {
                targetIds = currentState.mistakes_history;
                title = '<i class="fas fa-book-open text-red-500 mr-2"></i>錯題本';
                subtitle = `共累積 ${targetIds.length} 題需複習`;
                if (targetIds.length > 0) {
                    actionHtml = `<button onclick="window.clearMistakes()" class="text-sm bg-red-100 hover:bg-red-200 text-red-600 px-3 py-1.5 rounded-lg transition font-bold">清空紀錄</button>`;
                }
            } else {
                targetIds = currentState.favorites;
                title = '<i class="fas fa-star text-yellow-400 mr-2"></i>我的最愛';
                subtitle = `共收藏 ${targetIds.length} 題`;
            }

            ui.reviewTitle.innerHTML = title;
            ui.reviewSubtitle.textContent = subtitle;
            ui.reviewActions.innerHTML = actionHtml;
            ui.reviewContainer.innerHTML = '';

            if (targetIds.length === 0) {
                ui.reviewEmpty.classList.remove('hidden');
            } else {
                ui.reviewEmpty.classList.add('hidden');
                
                // Filter questions based on ID list
                const reviewQuestions = questionsData.filter(q => targetIds.includes(q.id));
                
                reviewQuestions.forEach((q, idx) => {
                    const isFav = currentState.favorites.includes(q.id);
                    const starClass = isFav ? "fas fa-star text-yellow-400" : "far fa-star text-gray-300";
                    
                    // Logic for removing from mistakes in review mode
                    let extraActionBtn = '';
                    if (type === 'mistakes') {
                        extraActionBtn = `
                            <button onclick="window.removeFromMistakes(${q.id})" class="mt-4 w-full py-2 bg-green-50 text-green-600 hover:bg-green-100 rounded-lg text-sm font-bold transition">
                                <i class="fas fa-check mr-1"></i> 我已學會，移除此題
                            </button>
                        `;
                    }

                    const card = document.createElement('div');
                    card.className = "bg-white rounded-3xl shadow-sm border border-gray-200 p-6 md:p-8 relative";
                    
                    const html = `
                         <div class="flex justify-between items-start mb-4">
                            <span class="bg-gray-100 text-gray-600 font-bold rounded px-2 py-1 text-sm">#${q.id} ${q.category}</span>
                            <button onclick="window.toggleFavorite(${q.id}, this)" class="text-2xl p-1">
                                <i class="${starClass}"></i>
                            </button>
                         </div>
                         
                         <h3 class="text-3xl font-bold text-gray-800 leading-relaxed serif mb-6">${q.question}</h3>
                         
                         <div class="space-y-3 mb-6">
                            ${q.options.map((opt, i) => {
                                const isCorrect = i === q.answer;
                                const style = isCorrect 
                                    ? "bg-green-100 border-green-500 text-green-900 font-bold" 
                                    : "bg-gray-50 text-gray-500 border-transparent opacity-70";
                                const icon = isCorrect ? '<i class="fas fa-check float-right mt-1"></i>' : '';
                                return `<div class="p-4 rounded-xl border ${style} text-xl">${['A','B','C','D'][i]}. ${opt} ${icon}</div>`
                            }).join('')}
                         </div>

                         <div class="bg-amber-50 p-6 rounded-2xl border border-amber-100">
                             <div class="font-bold text-amber-800 mb-2 text-xl">解析：</div>
                             <p class="text-gray-800 text-xl leading-relaxed text-justify">${q.explanation}</p>
                         </div>
                         ${extraActionBtn}
                    `;
                    
                    card.innerHTML = html;
                    ui.reviewContainer.appendChild(card);
                });
            }

            window.switchView('view-review-list');
        };


        function updateStats() {
            let correct = 0;
            let wrong = 0;
            const answeredCount = Object.keys(currentState.answers).length;

            questionsData.forEach(q => {
                const ans = currentState.answers[q.id];
                if (ans !== undefined) {
                    if (ans === q.answer) correct++;
                    else wrong++;
                }
            });

            animateValue(ui.statCorrect, parseInt(ui.statCorrect.textContent), correct, 500);
            animateValue(ui.statWrong, parseInt(ui.statWrong.textContent), wrong, 500);
            ui.statProgress.textContent = answeredCount;
        }

        function animateValue(obj, start, end, duration) {
            if (start === end) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end;
                }
            };
            window.requestAnimationFrame(step);
        }

        function saveProgress() {
            if (!isFirebaseReady || !currentState.username) return;
            
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const progressData = {
                answers: currentState.answers,
                isFinished: Object.keys(currentState.answers).length === questionsData.length,
                timestamp: new Date().getTime()
            };

            // Only update progress field, leave lists alone (handled by atomic operations)
            setDoc(userRef, { progress: progressData }, { merge: true })
                .catch(e => console.error("Save error", e));
        }

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot';
            if (type === 'loading') ui.statusDot.classList.add('status-loading');
            else if (type === 'success') ui.statusDot.classList.add('status-success');
            else if (type === 'error') ui.statusDot.classList.add('status-error');
        }

        // Scroll Event for Back To Top & Sticky Shadow
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                ui.btnBackToTop.classList.remove('opacity-0', 'translate-y-10');
            } else {
                ui.btnBackToTop.classList.add('opacity-0', 'translate-y-10');
            }
        });

        // Initialize Logic
        init();

    </script>
</body>
</html>
