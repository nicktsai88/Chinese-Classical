            { id: 17, category: "字形辨析", question: "下列選項中，「」內的字形何者完全正確？", options: ["披褐擁「廉」", "收「斂」骸骨", "眼花「繚」亂", "「鐮」刀割草"], answer: 3, explanation: "(A) 鐮；(B) 殮；(C) 撩。(D) 正確。" },
            { id: 18, category: "句型判斷", question: "「子非有喪，何哭之悲也？」屬於何種句型？", options: ["敘事句", "有無句", "疑問句", "感嘆句"], answer: 2, explanation: "孔子詢問皋魚為何哭得如此悲傷，是個疑問句。" },
            { id: 19, category: "文意推斷", question: "皋魚的三個過失，其共同的根本原因可以歸結為？", options: ["未能妥善管理時間", "未能平衡個人追求與人倫責任", "運氣不好，生不逢時", "缺乏良師益友的引導"], answer: 1, explanation: "三失的核心在於過度追求個人目標而疏忽了親、君、友的人倫責任。" },
            { id: 20, category: "字義通同", question: "「十有三人」的「有」，通假字與用法同於下列何者？", options: ["無中生「有」", "吾「十有五」而志於學", "富有四海", "有求必應"], answer: 1, explanation: "「有」通「又」，用於整數與零數之間。" },
            { id: 21, category: "倒裝句式", question: "「何哭之悲也」是倒裝句，還原後的語序應為？", options: ["悲何哭之也", "哭之何悲也", "哭何悲也（哭得多麼悲傷啊）", "何悲之哭也"], answer: 2, explanation: "此句意即「哭得何等悲傷啊」。" },
            { id: 22, category: "文意理解", question: "皋魚曰：「少而學，遊諸侯」，此處「遊」的意思最接近？", options: ["遊戲玩耍", "游泳健身", "遊歷求官", "悠閒度日"], answer: 2, explanation: "指遊歷各國，尋求被賞識任用的機會。" },
            { id: 23, category: "主旨分析", question: "本篇故事的主旨，與下列哪一句的精神最相近？", options: ["學而时習之，不亦說乎", "父母在，不遠遊，遊必有方", "三人行，必有我師焉", "巧言令色，鮮矣仁"], answer: 1, explanation: "強調行孝要及時，不可因遠遊而忽視父母。" },
            { id: 24, category: "進階思考", question: "「去而不可得見者，親也！」這句話流露出何種情感？", options: ["對親人離去的憤怒", "對生命無常的恐懼", "對無法再盡孝的絕望與痛悔", "對親人背棄自己的怨恨"], answer: 2, explanation: "表達了對父母已逝、終身無法再盡孝的沉痛。" },
            { id: 25, category: "綜合賞析", question: "關於本文的寫作特色，下列敘述何者錯誤？", options: ["以對話推動情節發展", "善用排比句式增強語氣", "運用譬喻修辭說明道理", "結尾孔子嚴厲批評了皋魚的愚蠢"], answer: 3, explanation: "孔子並無嚴厲批評，而是將其當作「足以識矣」的教材。" }
        ];

        // --- State Management ---
        let state = {
            username: '',
            answers: {},     // { qId: optionIdx }
            favorites: [],   // [qId]
            historyMistakes: [], // [qId] - 歷史累積，不隨重新測驗清空
            viewMode: 'all'  // 'all' | 'mistakes' | 'favorites'
        };

        const ui = {
            views: {
                login: document.getElementById('view-login'),
                dashboard: document.getElementById('view-dashboard'),
                list: document.getElementById('view-list')
            },
            statusText: document.getElementById('status-text'),
            statusDot: document.getElementById('status-dot'),
            usernameInput: document.getElementById('username'),
            usernameSpan: document.getElementById('username-span'),
            dashboardUsername: document.getElementById('dashboard-username'),
            recentUsersList: document.getElementById('recent-users-list'),
            quickLoginArea: document.getElementById('quick-login-area'),
            
            stickyStats: document.getElementById('sticky-stats'),
            statsQuizInfo: document.getElementById('stats-quiz-info'),
            listTitleDisplay: document.getElementById('list-title-display'),
            statCorrect: document.getElementById('stat-correct'),
            statWrong: document.getElementById('stat-wrong'),
            statProgress: document.getElementById('stat-progress'),
            statTotal: document.getElementById('stat-total'),
            statLabel: document.getElementById('stat-label'),
            btnBackDashboard: document.getElementById('btn-back-dashboard'),

            listContainer: document.getElementById('quiz-list-container'),
            reviewHeaderInfo: document.getElementById('review-header-info'),
            reviewDescription: document.getElementById('review-description'),
            emptyState: document.getElementById('empty-state'),
            finishBanner: document.getElementById('finish-banner'),
            
            mistakeCount: document.getElementById('dashboard-mistake-count'),
            favoriteCount: document.getElementById('dashboard-favorite-count'),
            btnBackToTop: document.getElementById('btn-back-to-top')
        };

        // --- Firebase Init & Auth ---
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            const initAuth = async () => {
                await signInAnonymously(auth);
            };
            initAuth();

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    userId = user.uid;
                    isFirebaseReady = true;
                    updateConnectionStatus('success', '雲端已連線');
                    loadGlobalUsers();
                }
            });
        } catch (e) {
            console.error(e);
            updateConnectionStatus('error', '系統異常');
        }

        // --- Functions ---

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot ' + (type === 'success' ? 'status-success' : type === 'error' ? 'status-error' : 'status-loading');
        }

        async function loadGlobalUsers() {
            const globalRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'metadata');
            onSnapshot(globalRef, (snap) => {
                if (snap.exists()) {
                    const users = snap.data().users || [];
                    renderRecentUsers(users);
                }
            });
        }

        function renderRecentUsers(users) {
            if (users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = users.slice(-5).map(u => 
                    `<button onclick="window.quickLogin('${u}')" class="px-4 py-2 bg-slate-50 hover:bg-amber-50 text-slate-700 hover:text-amber-700 rounded-xl text-sm border border-slate-200 transition font-bold shadow-sm">
                        ${u}
                    </button>`
                ).join('');
            }
        }

        window.quickLogin = function(name) {
            ui.usernameInput.value = name;
            window.attemptLogin();
        };

        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) return;

            state.username = name;
            ui.usernameSpan.textContent = name;
            ui.dashboardUsername.textContent = name;
            document.getElementById('user-display').classList.remove('hidden');

            // 註冊至全域用戶列表
            const globalRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'metadata');
            setDoc(globalRef, { users: arrayUnion(name) }, { merge: true });

            // 啟動使用者資料監聽
            startUserSync(name);
            switchView('dashboard');
        };

        function startUserSync(name) {
            if (userUnsubscribe) userUnsubscribe();
            const userRef = doc(db, 'artifacts', APP_ID, 'users', name, 'profile');
            userUnsubscribe = onSnapshot(userRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    state.answers = data.answers || {};
                    state.favorites = data.favorites || [];
                    state.historyMistakes = data.historyMistakes || [];
                    
                    updateDashboardStats();
                    if (ui.views.list.offsetParent) renderList();
                }
            });
        }

        function updateDashboardStats() {
            ui.mistakeCount.textContent = state.historyMistakes.length;
            ui.favoriteCount.textContent = state.favorites.length;
        }

        function switchView(viewKey) {
            Object.values(ui.views).forEach(v => v.classList.add('hidden'));
            ui.views[viewKey].classList.remove('hidden');
            window.scrollTo(0, 0);

            // Sticky Stats control
            if (viewKey === 'list') {
                ui.stickyStats.classList.remove('hidden');
            } else {
                ui.stickyStats.classList.add('hidden');
            }
        }

        window.goHome = () => switchView('dashboard');

        window.logout = () => {
            if (confirm('確定要登出嗎？')) location.reload();
        };

        window.startView = (mode) => {
            state.viewMode = mode;
            renderList();
            switchView('list');
        };

        function renderList() {
            ui.listContainer.innerHTML = '';
            ui.emptyState.classList.add('hidden');
            ui.finishBanner.classList.add('hidden');
            ui.reviewHeaderInfo.classList.add('hidden');
            ui.btnBackDashboard.classList.add('hidden');
            ui.statsQuizInfo.classList.remove('hidden');
            ui.listTitleDisplay.classList.add('hidden');

            let filtered = [];
            if (state.viewMode === 'all') {
                filtered = questionsData;
                ui.statLabel.textContent = "進度";
            } else if (state.viewMode === 'mistakes') {
                filtered = questionsData.filter(q => state.historyMistakes.includes(q.id));
                ui.reviewHeaderInfo.classList.remove('hidden');
                ui.reviewDescription.textContent = `錯題複習 (共 ${filtered.length} 題)`;
                ui.statLabel.textContent = "複習中";
                ui.btnBackDashboard.classList.remove('hidden');
                ui.statsQuizInfo.classList.add('hidden');
                ui.listTitleDisplay.classList.remove('hidden');
                ui.listTitleDisplay.textContent = "錯題複習本";
            } else if (state.viewMode === 'favorites') {
                filtered = questionsData.filter(q => state.favorites.includes(q.id));
                ui.reviewHeaderInfo.classList.remove('hidden');
                ui.reviewDescription.textContent = `我的最愛 (共 ${filtered.length} 題)`;
                ui.statLabel.textContent = "瀏覽中";
                ui.btnBackDashboard.classList.remove('hidden');
                ui.statsQuizInfo.classList.add('hidden');
                ui.listTitleDisplay.classList.remove('hidden');
                ui.listTitleDisplay.textContent = "我的最愛";
            }

            if (filtered.length === 0) {
                ui.emptyState.classList.remove('hidden');
                ui.statProgress.textContent = 0;
                ui.statTotal.textContent = 0;
                return;
            }

            ui.statTotal.textContent = filtered.length;
            
            filtered.forEach((q, idx) => {
                const card = createCard(q, idx);
                ui.listContainer.appendChild(card);
            });

            updateListStats();
        }

        function createCard(q, displayIdx) {
            const userAns = state.answers[q.id];
            const isAnswered = userAns !== undefined;
            const isFav = state.favorites.includes(q.id);
            
            const card = document.createElement('div');
            card.className = `bg-white rounded-[2rem] p-6 md:p-10 shadow-lg border-2 transition-all duration-500 relative animate-fade-in-up ${isAnswered ? (userAns === q.answer ? 'border-emerald-200' : 'border-rose-200') : 'border-transparent'}`;
            
            const favIconClass = isFav ? 'fas fa-star text-amber-400' : 'far fa-star text-slate-300';
            
            let html = `
                <div class="flex justify-between items-start mb-6">
                    <div class="flex items-center gap-3">
                        <span class="bg-slate-900 text-white w-10 h-10 rounded-xl flex items-center justify-center font-black">#${displayIdx + 1}</span>
                        <span class="bg-slate-100 text-slate-500 text-sm px-3 py-1 rounded-full font-bold">${q.category}</span>
                    </div>
                    <button onclick="window.toggleFavorite(${q.id})" class="star-btn text-2xl p-2 hover:bg-slate-50 rounded-full transition-all">
                        <i class="${favIconClass}"></i>
                    </button>
                </div>
                <h3 class="text-3xl md:text-4xl font-bold text-slate-800 leading-tight mb-8 serif">${q.question}</h3>
                <div class="grid gap-4">
            `;

            q.options.forEach((opt, oIdx) => {
                let btnStyle = "w-full text-left p-6 rounded-2xl border-2 transition-all flex items-center gap-5 group ";
                let circleStyle = "w-12 h-12 rounded-full border-2 flex items-center justify-center font-black text-xl flex-shrink-0 transition-colors ";
                
                if (isAnswered) {
                    if (oIdx === q.answer) {
                        btnStyle += "bg-emerald-50 border-emerald-500 text-emerald-900 shadow-sm";
                        circleStyle += "bg-emerald-500 border-emerald-500 text-white";
                    } else if (oIdx === userAns) {
                        btnStyle += "bg-rose-50 border-rose-500 text-rose-900 shadow-sm";
                        circleStyle += "bg-rose-500 border-rose-500 text-white";
                    } else {
                        btnStyle += "border-slate-100 text-slate-300 opacity-60";
                        circleStyle += "border-slate-200 text-slate-300";
                    }
                } else {
                    btnStyle += "border-slate-200 hover:border-amber-400 hover:bg-amber-50 cursor-pointer";
                    circleStyle += "border-slate-200 group-hover:bg-amber-500 group-hover:border-amber-500 group-hover:text-white";
                }

                html += `
                    <button ${isAnswered ? 'disabled' : `onclick="window.handleAnswer(${q.id}, ${oIdx})"`} class="${btnStyle}">
                        <div class="${circleStyle}">${['A','B','C','D'][oIdx]}</div>
                        <span class="text-2xl font-bold leading-relaxed">${opt}</span>
                    </button>
                `;
            });

            html += `</div>`;

            if (isAnswered) {
                html += `
                    <div class="mt-10 bg-slate-50 p-8 rounded-3xl border border-slate-200 animate-fade-in-up">
                        <div class="flex items-start gap-5">
                            <div class="bg-amber-100 text-amber-600 w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-lightbulb text-2xl"></i>
                            </div>
                            <div>
                                <h4 class="text-amber-800 font-black text-2xl mb-3">詳解分析</h4>
                                <p class="text-slate-700 text-2xl leading-[1.8] font-medium serif text-justify">${q.explanation}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            card.innerHTML = html;
            return card;
        }

        window.handleAnswer = async (qId, ansIdx) => {
            if (!state.username) return;
            
            const q = questionsData.find(x => x.id === qId);
            const isCorrect = q.answer === ansIdx;
            
            state.answers[qId] = ansIdx;
            
            // 處理歷史錯題累積
            let newMistakes = [...state.historyMistakes];
            if (!isCorrect && !newMistakes.includes(qId)) {
                newMistakes.push(qId);
            }

            // 同步 Firestore
            const userRef = doc(db, 'artifacts', APP_ID, 'users', state.username, 'profile');
            await setDoc(userRef, { 
                answers: state.answers,
                historyMistakes: newMistakes
            }, { merge: true });

            // 本地狀態更新會透過 onSnapshot 反饋，但為了即時感可以先手動 render 或等通知
            // 這裡我們依賴 onSnapshot 自動觸發 renderList()
        };

        window.toggleFavorite = async (qId) => {
            if (!state.username) return;
            
            const isFav = state.favorites.includes(qId);
            const userRef = doc(db, 'artifacts', APP_ID, 'users', state.username, 'profile');
            
            if (isFav) {
                await updateDoc(userRef, { favorites: arrayRemove(qId) });
            } else {
                await updateDoc(userRef, { favorites: arrayUnion(qId) });
            }
        };

        window.resetProgress = async () => {
            if (confirm('確定要清空「目前的作答進度」嗎？\n(「錯題本」與「我的最愛」紀錄將會保留)')) {
                const userRef = doc(db, 'artifacts', APP_ID, 'users', state.username, 'profile');
                await updateDoc(userRef, { answers: {} });
                state.answers = {};
                if (ui.views.list.offsetParent) renderList();
            }
        };

        function updateListStats() {
            let correct = 0;
            let wrong = 0;
            let count = 0;

            const relevantQuestions = state.viewMode === 'all' 
                ? questionsData 
                : questionsData.filter(q => (state.viewMode === 'mistakes' ? state.historyMistakes : state.favorites).includes(q.id));

            relevantQuestions.forEach(q => {
                const ans = state.answers[q.id];
                if (ans !== undefined) {
                    count++;
                    if (ans === q.answer) correct++;
                    else wrong++;
                }
            });

            ui.statCorrect.textContent = correct;
            ui.statWrong.textContent = wrong;
            ui.statProgress.textContent = count;
            
            if (count > 0 && count === relevantQuestions.length) {
                ui.finishBanner.classList.remove('hidden');
            }
        }

        // Scroll logic
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                ui.btnBackToTop.classList.replace('opacity-0', 'opacity-100');
                ui.btnBackToTop.classList.replace('translate-y-10', 'translate-y-0');
            } else {
                ui.btnBackToTop.classList.replace('opacity-100', 'opacity-0');
                ui.btnBackToTop.classList.replace('translate-y-0', 'translate-y-10');
            }
        });

    </script>
</body>
</html>
