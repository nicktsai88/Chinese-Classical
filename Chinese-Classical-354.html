        // ================= 1. 題庫資料萃取 =================
        const questionsData = [
            { id: 1, category: "字音字形", question: "「清旦衣冠而之市」，句中「冠」字的讀音與意思，下列何者正確？", options: ["ㄍㄨㄢ，帽子", "ㄍㄨㄢˋ，戴上帽子", "ㄍㄨㄢ，居第一位", "ㄍㄨㄢˋ，帽子"], answer: 1, explanation: "「衣冠」在此處作動詞用，「衣」讀ㄧˋ，穿衣；「冠」讀ㄍㄨㄢˋ，戴帽。整句意指「穿好衣服、戴好帽子」。" },
            { id: 2, category: "字義測驗", question: "下列「之」字的字義，何者與「清旦衣冠而之市」的「之」相同？", options: ["送孟浩然「之」廣陵", "吏捕得「之」", "心「之」所向", "適鬻金者「之」所"], answer: 0, explanation: "題幹「之」市：動詞，往、去。(A)送孟浩然「之」廣陵：動詞，往、去。(B)代詞，指齊人。(C)助詞，無義。(D)助詞，的。" },
            { id: 3, category: "文意理解", question: "「適鬻金者之所」句中「適」字的意思為何？", options: ["適合", "舒適", "剛好、恰巧", "往、到"], answer: 3, explanation: "「適」在此處解釋為「往、到」。整句翻譯為：前往賣金子的人的地方。" },
            { id: 4, category: "字義測驗", question: "「因攫其金而去」的「攫」字，意思與下列何者最接近？", options: ["偷竊", "奪取", "購買", "乞討"], answer: 1, explanation: "「攫」（ㄐㄩㄝˊ）：抓取、奪取。指用手強行抓取。" },
            { id: 5, category: "字義比較", question: "「適鬻金者之所」，「鬻」字的意思是「賣」。下列成語中的「鬻」字，何者意思相同？", options: ["賣官鬻爵", "阿諛鬻容", "鬻兒賣女", "以上皆是"], answer: 3, explanation: "「鬻」（ㄩˋ）皆指「賣」。(A)賣官位爵位。(B)出賣容顏以奉承他人。(C)賣掉兒女，形容生活困苦。" },
            { id: 6, category: "文意推論", question: "齊人「清旦衣冠而之市」，這個舉動顯示出他的心態為何？", options: ["從容不迫，若無其事", "神智不清，夢遊狀態", "為了掩飾身分，喬裝打扮", "重視禮儀，準備去拜訪朋友"], answer: 0, explanation: "他「清旦衣冠」，意思是早起穿戴整齊，表現得像個體面的正常人，從容地去市場，與後面的搶劫行為形成強烈對比，顯示其「利令智昏」到了若無其事的地步。" },
            { id: 7, category: "文法結構", question: "「徒見金」的「徒」字，詞性與解釋為何？", options: ["名詞，徒弟", "動詞，步行", "副詞，只、僅", "形容詞，空的"], answer: 2, explanation: "「徒」在此為副詞，解釋為「只、僅」。意即「只看見金子」。" },
            { id: 8, category: "主語判斷", question: "「吏捕得之」這句話省略了主語，若要還原，下列何者最恰當？", options: ["齊人", "鬻金者", "旁觀者", "管理市場的官吏"], answer: 3, explanation: "句子的主詞是「吏」（官吏），動詞是「捕」，受詞是「之」（齊人）。本句描述的是官吏的動作。" },
            { id: 9, category: "成語應用", question: "這則故事的寓意，可以用下列哪一個成語來形容？", options: ["掩耳盜鈴", "利令智昏", "一葉障目", "以上皆是"], answer: 3, explanation: "齊人因為想得到金子（利），而看不見旁人（智昏），與「利令智昏」最貼切。「掩耳盜鈴」比喻自欺欺人，「一葉障目」比喻被局部現象迷惑而看不到全局，三者皆有共通之處。" },
            { id: 10, category: "文意理解", question: "齊人回答：「取金之時，不見人，徒見金。」這句話真正的意涵是什麼？", options: ["他的視力有問題，真的沒看到人", "他使用障眼法，以為別人看不到他", "他被貪欲蒙蔽了理智，眼中只有利益", "市場當時真的沒有人，只有金子"], answer: 2, explanation: "這是誇張的說法，強調他因為極度的貪婪，注意力完全集中在金子上，以至於忽略了周圍客觀環境（眾人）的存在。" },
            { id: 11, category: "文句翻譯", question: "「子攫人之金何？」這句話的翻譯，下列何者最通順？", options: ["兒子搶了別人的金子做什麼？", "你在何時搶了別人的金子？", "你為什麼要搶別人的金子？", "你搶別人的金子是誰的？"], answer: 2, explanation: "「子」：你。「何」：為何、為什麼（疑問副詞）。整句意為「你為什麼搶奪別人的金子？」" },
            { id: 12, category: "字形辨析", question: "下列各組字形，何者讀音相同？", options: ["「攫」取 ／ 「瞿」然", "恐「懼」 ／ 「攫」金", "「鬻」金 ／ 「育」兒", "「徒」步 ／ 遷「徙」"], answer: 2, explanation: "(A) ㄐㄩㄝˊ ／ ㄐㄩˋ。(B) ㄐㄩˋ ／ ㄐㄩㄝˊ。(C) ㄩˋ ／ ㄩˋ (同音)。(D) ㄊㄨˊ ／ ㄒㄧˇ。" },
            { id: 13, category: "修辭技巧", question: "「不見人，徒見金」使用了什麼修辭技巧來強調齊人的執迷？", options: ["譬喻", "映襯", "轉化", "誇飾"], answer: 1, explanation: "「不見人」與「見金」形成強烈對比（映襯），凸顯其眼中只有金子而無視他人的荒謬。" },
            { id: 14, category: "虛詞練習", question: "「因攫其金而去」的「而」，用法與下列何者相同？", options: ["學「而」時習之", "出淤泥「而」不染", "人「而」無信，不知其可", "清旦衣冠「而」之市"], answer: 3, explanation: "題幹「而」：連詞，表順接（然後）。(A)順接。(B)轉折。(C)假設。(D)順接（修飾動作）。D與題幹同屬本文且結構最類似。" },
            { id: 15, category: "文意理解", question: "關於《齊人攫金》這則故事的寫作特色，下列敘述何者錯誤？", options: ["文字簡潔，情節生動", "善用對話來刻畫人物心理", "使用大量華麗的形容詞來描寫金子", "具有深刻的諷刺意味"], answer: 2, explanation: "文中並未描寫金子的外觀，而是著重在齊人的行為與心理。" },
            { id: 16, category: "延伸思考", question: "「人皆在焉」的「焉」，詞性與意義為何？", options: ["助詞，無義", "代詞，那裡（指市場/現場）", "疑問詞，哪裡", "形容詞，安顯的樣子"], answer: 1, explanation: "「焉」在此作為兼詞（於是、於此），即「在那裡」。指大家都還在那裡（看著）。" },
            { id: 17, category: "字義測驗", question: "「吏捕得之」與「因攫其金」兩句中的代詞運用，下列說明何者正確？", options: ["前者「之」指金子，後者「其」指鬻金者", "前者「之」指齊人，後者「其」指鬻金者", "前者「之」指齊人，後者「其」指齊人", "前者「之」指金子，後者「其」指齊人"], answer: 1, explanation: "「捕得之」的之代指搶劫的「齊人」；「攫其金」的其代指「賣金子的人」（鬻金者）。" },
            { id: 18, category: "邏輯推演", question: "若要以一句話勸告這位「齊人」，下列何者最不適合？", options: ["君子愛財，取之有道", "法網恢恢，疏而不漏", "人為財死，鳥為食亡", "偷雞不著蝕把米"], answer: 2, explanation: "「人為財死，鳥為食亡」通常是用來描述人為了利益而犧牲的現象，比較像是「描述」而非「勸告」。" },
            { id: 19, category: "國學常識", question: "本故事選自《列子》。關於《列子》一書，下列敘述何者正確？", options: ["是儒家的重要經典", "作者列禦寇是戰國時代法家代表", "內容多寓言故事，富含哲理，屬道家著作", "與《論語》、《孟子》合稱四書"], answer: 2, explanation: "《列子》屬道家經典，內容多寓言。" },
            { id: 20, category: "綜合測驗", question: "下列「」中的字，何者不屬於「動詞」？", options: ["衣「冠」而之市", "適「鬻」金者之所", "「徒」見金", "「攫」其金"], answer: 2, explanation: "(A)戴帽（動詞）。(B)賣（動詞）。(C)只（副詞）。(D)抓取（動詞）。" }
        ];

        // ================= 2. Firebase & 全域狀態設定 =================
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const COLLECTION_NAME = 'Chinese-Classical-354';
        
        let app, auth, db, currentUser = null, unsubscribeSnapshot = null;
        
        window.state = {
            username: '',
            answers: {},
            mistakes: [],
            favorites: []
        };

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase 初始化失敗", e);
        }

        // ================= 3. Custom Modal 工具 (取代 alert/confirm) =================
        window.closeModal = () => {
            document.getElementById('custom-modal').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('flex');
        };

        window.customAlert = (msg) => {
            document.getElementById('modal-content').innerText = msg;
            document.getElementById('modal-actions').innerHTML = `
                <button onclick="window.closeModal()" class="px-8 py-3 bg-rose-400 text-white text-xl font-black rounded-full border-4 border-solid border-rose-500 shadow-[0_4px_0_#e11d48] hover:-translate-y-1 hover:shadow-[0_6px_0_#e11d48] active:shadow-none active:translate-y-1 transition-all">知道囉 ⭕</button>
            `;
            document.getElementById('custom-modal').classList.remove('hidden');
        };

        window._confirmCallback = null;
        window.customConfirm = (msg, callback) => {
            document.getElementById('modal-content').innerText = msg;
            window._confirmCallback = callback;
            document.getElementById('modal-actions').innerHTML = `
                <button onclick="window.closeModal(); window._confirmCallback(false);" class="px-6 py-3 bg-gray-100 text-gray-600 text-lg font-bold rounded-full border-4 border-solid border-gray-300 shadow-[0_4px_0_#d1d5db] hover:-translate-y-1 transition-all active:translate-y-1 active:shadow-none">取消 ❌</button>
                <button onclick="window.closeModal(); window._confirmCallback(true);" class="px-6 py-3 bg-teal-400 text-white text-lg font-black rounded-full border-4 border-solid border-teal-500 shadow-[0_4px_0_#0f766e] hover:-translate-y-1 hover:shadow-[0_6px_0_#0f766e] transition-all active:translate-y-1 active:shadow-none">確定 ✅</button>
            `;
            document.getElementById('custom-modal').classList.remove('hidden');
        };

        // ================= 4. 畫面切換與 UI 工具 =================
        window.switchView = (viewId) => {
            ['view-login', 'view-dashboard', 'view-quiz', 'view-review'].forEach(v => {
                document.getElementById(v).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.renderRecentLogins = () => {
            const recents = JSON.parse(localStorage.getItem('cc-354-recents') || '[]');
            const container = document.getElementById('recent-logins');
            if(recents.length === 0) {
                container.innerHTML = '<span class="text-gray-300 font-bold text-sm">尚無紀錄 🍃</span>';
                return;
            }
            container.innerHTML = recents.map(name => `
                <button onclick="window.quickLogin('${name}')" class="bg-rose-50 border-2 border-solid border-rose-300 text-rose-700 font-bold px-4 py-2 rounded-full hover:bg-rose-100 transition-colors shadow-sm text-sm active:scale-95">
                    🧑‍🎓 ${name}
                </button>
            `).join('');
        };

        window.quickLogin = (name) => {
            document.getElementById('username-input').value = name;
            window.startQuizFlow();
        };

        // ================= 5. Firebase Auth & 資料監聽 =================
        const initAuthFlow = async () => {
            if(!auth) return;
            try {
                if (initialToken) await signInWithCustomToken(auth, initialToken);
                else await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth error", e);
            }
        };

        if(auth) {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    window.renderRecentLogins();
                }
            });
            initAuthFlow();
        }

        window.startQuizFlow = () => {
            const name = document.getElementById('username-input').value.trim();
            if (!name) return window.customAlert('請輸入姓名喔！🧑‍🎓');
            if (!currentUser) return window.customAlert('系統連線中，請稍候再試 ⏳');

            window.state.username = name;
            
            // 儲存最近登入供快選
            let recents = JSON.parse(localStorage.getItem('cc-354-recents') || '[]');
            if (!recents.includes(name)) {
                recents.unshift(name);
                if (recents.length > 5) recents.pop();
                localStorage.setItem('cc-354-recents', JSON.stringify(recents));
            }

            document.getElementById('display-username').innerText = name;
            document.getElementById('header-user').classList.remove('hidden');
            document.getElementById('header-user').classList.add('flex');
            document.getElementById('header-username').innerText = name;

            // 啟動 Firebase 監聽 (Rule 1 & 3)
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, COLLECTION_NAME, name);
            
            unsubscribeSnapshot = onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    window.state.answers = data.answers || {};
                    window.state.mistakes = data.mistakes || [];
                    window.state.favorites = data.favorites || [];
                } else {
                    window.state.answers = {};
                    window.state.mistakes = [];
                    window.state.favorites = [];
                    setDoc(docRef, { answers: {}, mistakes: [], favorites: [] }, { merge: true }).catch(e=>console.error(e));
                }
                
                // 無論身處哪一個畫面，只要資料變更就重新渲染
                window.updateWaterfallUI();
                if (!document.getElementById('view-review').classList.contains('hidden')) {
                    const isMistake = document.getElementById('review-title').innerText.includes('❌');
                    window.renderReview(isMistake ? 'mistakes' : 'favorites');
                }
            }, (err) => {
                console.error("Snapshot error:", err);
                window.customAlert('資料同步失敗 😢');
            });

            window.switchView('view-dashboard');
        };

        const saveToFirebase = () => {
            if(!currentUser || !window.state.username) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, COLLECTION_NAME, window.state.username);
            setDoc(docRef, {
                answers: window.state.answers,
                mistakes: window.state.mistakes,
                favorites: window.state.favorites
            }, { merge: true }).catch(e => console.error(e));
        };

        // ================= 6. 核心業務邏輯與渲染 =================
        window.goHome = () => {
            if (window.state.username) window.switchView('view-dashboard');
            else window.switchView('view-login');
        };

        window.logout = () => {
            window.customConfirm('確定要登出嗎？進度會自動保存在雲端喔！☁️', (confirmed) => {
                if(confirmed) {
                    window.state.username = '';
                    if(unsubscribeSnapshot) {
                        unsubscribeSnapshot();
                        unsubscribeSnapshot = null;
                    }
                    document.getElementById('header-user').classList.add('hidden');
                    document.getElementById('header-user').classList.remove('flex');
                    document.getElementById('username-input').value = '';
                    window.renderRecentLogins();
                    window.switchView('view-login');
                }
            });
        };

        window.goQuiz = () => {
            window.renderWaterfallDOM();
            window.updateWaterfallUI();
            window.switchView('view-quiz');
        };

        // 初次生成瀑布流 DOM 結構
        window.renderWaterfallDOM = () => {
            const container = document.getElementById('quiz-waterfall');
            if(container.children.length > 0) return; // 避免重複生成
            
            container.innerHTML = questionsData.map(q => `
                <div id="q-card-${q.id}" class="p-8 rounded-[2.5rem] border-4 border-solid border-gray-200 bg-white relative transition-colors duration-300 shadow-[0_6px_0_#e5e7eb]">
                    <div class="flex justify-between items-start mb-6 gap-4">
                        <div>
                            <div class="inline-block bg-rose-100 border-2 border-solid border-rose-300 text-rose-700 font-bold px-3 py-1 rounded-full text-sm mb-4 shadow-[0_2px_0_#fda4af]">
                                📌 【${q.category}】
                            </div>
                            <h3 class="text-2xl font-black text-gray-800 leading-relaxed font-serif tracking-wide">
                                ${q.id}. ${q.question}
                            </h3>
                        </div>
                        <button id="fav-btn-${q.id}" onclick="window.toggleFavorite(${q.id})" class="text-4xl hover:scale-110 transition-transform active:scale-95 shrink-0 mt-2">🤍</button>
                    </div>
                    
                    <div id="opts-${q.id}" class="flex flex-col gap-4 mt-6">
                        ${q.options.map((opt, idx) => `
                            <button onclick="window.handleAnswer(${q.id}, ${idx})" class="opt-btn w-full text-left p-5 rounded-[1.5rem] border-4 border-solid border-gray-200 bg-white hover:border-amber-400 hover:bg-amber-50 hover:-translate-y-1 transition-all flex items-center justify-between text-gray-700 font-bold text-xl shadow-[0_4px_0_#e5e7eb] active:shadow-none active:translate-y-1">
                                <div class="flex items-center gap-5">
                                    <span class="opt-prefix w-12 h-12 flex items-center justify-center rounded-full bg-gray-100 border-4 border-solid border-gray-200 font-black text-gray-500 shrink-0 text-xl">${['A','B','C','D'][idx]}</span>
                                    <span class="leading-relaxed">${opt}</span>
                                </div>
                                <span class="opt-suffix font-black text-3xl shrink-0 ml-2"></span>
                            </button>
                        `).join('')}
                    </div>
                    
                    <div id="exp-${q.id}" class="hidden mt-10 pt-6 relative border-t-4 border-dashed border-gray-200">
                        <div class="absolute -top-7 -left-3 text-5xl bg-white rounded-full p-1 border-4 border-solid border-yellow-400 shadow-md z-10 rotate-[-10deg]">💡</div>
                        <div class="bg-yellow-50 border-4 border-solid border-yellow-300 p-6 rounded-[2rem] text-gray-700 leading-relaxed pl-12 font-bold text-lg shadow-[0_4px_0_#fde047]">
                            ${q.explanation}
                        </div>
                    </div>
                </div>
            `).join('');
        };

        // 僅更新 DOM 狀態 (不破壞 Scroll 位置)
        window.updateWaterfallUI = () => {
            let correct = 0, wrong = 0, answered = 0;
            
            questionsData.forEach(q => {
                const card = document.getElementById(`q-card-${q.id}`);
                if (!card) return;
                
                const ans = window.state.answers[q.id];
                const favBtn = document.getElementById(`fav-btn-${q.id}`);
                if(favBtn) favBtn.innerText = window.state.favorites.includes(q.id) ? '⭐' : '🤍';
                
                if (ans !== undefined) {
                    answered++;
                    const isCorrect = ans === q.answer;
                    if(isCorrect) correct++; else wrong++;
                    
                    // 卡片底色
                    card.className = `p-8 rounded-[2.5rem] border-4 border-solid relative transition-colors duration-300 ${isCorrect ? 'bg-teal-50 border-teal-400 shadow-[0_6px_0_#2dd4bf]' : 'bg-rose-50 border-rose-400 shadow-[0_6px_0_#fb7185]'}`;
                    
                    // 選項按鈕狀態
                    const buttons = document.getElementById(`opts-${q.id}`).querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.disabled = true;
                        const prefix = btn.querySelector('.opt-prefix');
                        const suffix = btn.querySelector('.opt-suffix');
                        
                        if (idx === ans) {
                            btn.className = `opt-btn w-full text-left p-5 rounded-[1.5rem] border-4 border-solid transition-all flex items-center justify-between font-black text-xl shadow-none translate-y-1 ${isCorrect ? 'bg-teal-400 border-teal-500 text-white' : 'bg-rose-400 border-rose-500 text-white'}`;
                            prefix.className = `opt-prefix w-12 h-12 flex items-center justify-center rounded-full border-4 border-solid font-black shrink-0 text-xl ${isCorrect ? 'bg-teal-300 border-teal-200 text-teal-800' : 'bg-rose-300 border-rose-200 text-rose-800'}`;
                            suffix.innerText = isCorrect ? '⭕' : '❌';
                        } else if (idx === q.answer) {
                            btn.className = `opt-btn w-full text-left p-5 rounded-[1.5rem] border-4 border-solid transition-all flex items-center justify-between font-black text-xl bg-teal-100 border-teal-300 text-teal-800 shadow-none`;
                            prefix.className = `opt-prefix w-12 h-12 flex items-center justify-center rounded-full border-4 border-solid font-black shrink-0 text-xl bg-teal-200 border-teal-400 text-teal-900`;
                            suffix.innerText = '⭕';
                        } else {
                            btn.className = `opt-btn w-full text-left p-5 rounded-[1.5rem] border-4 border-solid transition-all flex items-center justify-between font-bold text-xl bg-white border-gray-200 text-gray-400 opacity-60 shadow-none`;
                            prefix.className = `opt-prefix w-12 h-12 flex items-center justify-center rounded-full border-4 border-solid font-black shrink-0 text-xl bg-gray-50 border-gray-200 text-gray-400`;
                            suffix.innerText = '';
                        }
                    });
                    
                    document.getElementById(`exp-${q.id}`).classList.remove('hidden');
                } else {
                    // 未作答狀態復原
                    card.className = `p-8 rounded-[2.5rem] border-4 border-solid border-gray-200 bg-white relative transition-colors duration-300 shadow-[0_6px_0_#e5e7eb]`;
                    const buttons = document.getElementById(`opts-${q.id}`).querySelectorAll('.opt-btn');
                    buttons.forEach((btn, idx) => {
                        btn.disabled = false;
                        btn.className = `opt-btn w-full text-left p-5 rounded-[1.5rem] border-4 border-solid border-gray-200 bg-white hover:border-amber-400 hover:bg-amber-50 hover:-translate-y-1 transition-all flex items-center justify-between text-gray-700 font-bold text-xl shadow-[0_4px_0_#e5e7eb] active:shadow-none active:translate-y-1`;
                        const prefix = btn.querySelector('.opt-prefix');
                        prefix.className = `opt-prefix w-12 h-12 flex items-center justify-center rounded-full bg-gray-100 border-4 border-solid border-gray-200 font-black text-gray-500 shrink-0 text-xl`;
                        btn.querySelector('.opt-suffix').innerText = '';
                    });
                    document.getElementById(`exp-${q.id}`).classList.add('hidden');
                }
            });
            
            // 更新頂部數據
            const elCorrect = document.getElementById('stat-correct');
            const elWrong = document.getElementById('stat-wrong');
            const elTotal = document.getElementById('stat-total');
            if(elCorrect) elCorrect.innerText = correct;
            if(elWrong) elWrong.innerText = wrong;
            if(elTotal) elTotal.innerText = `${answered}/${questionsData.length}`;
        };

        window.handleAnswer = (qId, idx) => {
            if(window.state.answers[qId] !== undefined) return; 
            
            window.state.answers[qId] = idx;
            const q = questionsData.find(x => x.id === qId);
            
            if(idx !== q.answer && !window.state.mistakes.includes(qId)) {
                window.state.mistakes.push(qId);
            }
            
            saveToFirebase();
            window.updateWaterfallUI(); // 立即套用以增加流暢感
            
            // 答題後稍微滾動以展示解析
            setTimeout(() => {
               const exp = document.getElementById(`exp-${qId}`);
               if(exp) {
                   const y = exp.getBoundingClientRect().top + window.scrollY - 150;
                   window.scrollTo({top: y, behavior: 'smooth'});
               }
            }, 100);
        };

        window.toggleFavorite = (qId) => {
            const idx = window.state.favorites.indexOf(qId);
            if(idx > -1) window.state.favorites.splice(idx, 1);
            else window.state.favorites.push(qId);
            
            saveToFirebase();
            window.updateWaterfallUI();
            
            // 如果在複習畫面也同步更新
            if (!document.getElementById('view-review').classList.contains('hidden') && document.getElementById('review-title').innerText.includes('⭐')) {
                window.renderReview('favorites');
            }
        };

        window.confirmRestart = () => {
            window.customConfirm('確定要清除「作答紀錄與錯題」並重新開始嗎？🧹 (收藏會保留)', (confirmed) => {
                if(confirmed) {
                    window.state.answers = {};
                    window.state.mistakes = [];
                    saveToFirebase();
                    window.updateWaterfallUI();
                    window.scrollTo({top: 0, behavior: 'smooth'});
                }
            });
        };

        // ================= 7. 錯題本與最愛畫面 =================
        window.goReview = (type) => {
            window.renderReview(type);
            window.switchView('view-review');
        };

        window.renderReview = (type) => {
            const titleText = type === 'mistakes' ? '❌ 錯題本' : '⭐ 我的最愛';
            document.getElementById('review-title').innerText = titleText;
            
            const list = type === 'mistakes' ? window.state.mistakes : window.state.favorites;
            const container = document.getElementById('review-container');
            
            if(list.length === 0) {
                container.innerHTML = `<div class="text-center p-12 bg-white border-4 border-dashed border-gray-300 rounded-[2.5rem] text-gray-400 font-bold text-2xl shadow-sm mt-10">目前空空如也喔！🍃</div>`;
                return;
            }
            
            container.innerHTML = list.map(qId => {
                const q = questionsData.find(x => x.id === qId);
                if(!q) return '';
                const userAns = window.state.answers[q.id];
                const isAnswered = userAns !== undefined;
                
                return `
                <div class="p-8 rounded-[2.5rem] border-4 border-solid border-amber-300 bg-white relative shadow-[0_6px_0_#fcd34d]">
                    <div class="flex justify-between items-start mb-6 gap-4">
                        <div>
                            <div class="inline-block bg-rose-100 border-2 border-solid border-rose-300 text-rose-700 font-bold px-3 py-1 rounded-full text-sm mb-4 shadow-[0_2px_0_#fda4af]">
                                📌 【${q.category}】
                            </div>
                            <h3 class="text-2xl font-black text-gray-800 leading-relaxed font-serif tracking-wide">
                                ${q.id}. ${q.question}
                            </h3>
                        </div>
                        <button onclick="window.toggleFavorite(${q.id})" class="text-4xl hover:scale-110 transition-transform active:scale-95 shrink-0 mt-2">${window.state.favorites.includes(q.id) ? '⭐' : '🤍'}</button>
                    </div>
                    
                    <div class="flex flex-col gap-4 mt-6">
                        ${q.options.map((opt, idx) => {
                            let btnClass = "w-full text-left p-5 rounded-[1.5rem] border-4 border-solid flex items-center justify-between font-bold text-xl transition-colors ";
                            let prefixClass = "w-12 h-12 flex items-center justify-center rounded-full border-4 border-solid font-black shrink-0 text-xl ";
                            let suffixText = "";
                            
                            if (idx === q.answer) {
                                btnClass += "bg-teal-100 border-teal-400 text-teal-800";
                                prefixClass += "bg-teal-200 border-teal-500 text-teal-900";
                                suffixText = "⭕ 正解";
                            } else if (isAnswered && idx === userAns) {
                                btnClass += "bg-rose-100 border-rose-300 text-rose-800 line-through opacity-80";
                                prefixClass += "bg-rose-200 border-rose-400 text-rose-900";
                                suffixText = "❌ 你的作答";
                            } else {
                                btnClass += "bg-gray-50 border-gray-200 text-gray-500 opacity-70";
                                prefixClass += "bg-gray-100 border-gray-300 text-gray-400";
                            }
                            
                            return `
                            <div class="${btnClass}">
                                <div class="flex items-center gap-5">
                                    <span class="${prefixClass}">${['A','B','C','D'][idx]}</span>
                                    <span class="leading-relaxed">${opt}</span>
                                </div>
                                <span class="font-black text-2xl shrink-0 ml-2">${suffixText}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    
                    <div class="mt-10 pt-6 relative border-t-4 border-dashed border-amber-200">
                        <div class="absolute -top-7 -left-3 text-5xl bg-white rounded-full p-1 border-4 border-solid border-yellow-400 shadow-md z-10 rotate-[-10deg]">💡</div>
                        <div class="bg-yellow-50 border-4 border-solid border-yellow-300 p-6 rounded-[2rem] text-gray-700 leading-relaxed pl-12 font-bold text-lg shadow-[0_4px_0_#fde047]">
                            ${q.explanation}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        };

        // 初始化
        window.renderRecentLogins();
    </script>
</body>
</html>
