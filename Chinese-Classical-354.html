            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-msg').textContent = msg;
            const btnGroup = document.getElementById('modal-btn-group');
            btnGroup.innerHTML = `<button onclick="closeModal()" class="btn-hover-effect bg-teal-400 border-2 border-solid border-teal-500 text-white px-6 py-2 rounded-full font-bold">知道囉 ⭕</button>`;
            modal.classList.remove('hide');
        };

        window.customConfirm = function(msg, callback, icon = '🤔') {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-icon').textContent = icon;
            document.getElementById('modal-msg').textContent = msg;
            const btnGroup = document.getElementById('modal-btn-group');
            btnGroup.innerHTML = `
                <button id="modal-btn-yes" class="btn-hover-effect bg-rose-400 border-2 border-solid border-rose-500 text-white px-6 py-2 rounded-full font-bold">確定 ⭕</button>
                <button onclick="closeModal()" class="btn-hover-effect bg-gray-200 border-2 border-solid border-gray-300 text-gray-600 px-6 py-2 rounded-full font-bold">取消 ❌</button>
            `;
            document.getElementById('modal-btn-yes').onclick = () => {
                closeModal();
                if(callback) callback();
            };
            modal.classList.remove('hide');
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hide');
        };

        // --- View Navigation ---
        function switchView(viewId) {
            ['view-login', 'view-dashboard', 'view-quiz'].forEach(id => {
                document.getElementById(id).classList.add('hide');
            });
            document.getElementById(viewId).classList.remove('hide');
            window.scrollTo(0, 0);
        }

        window.goDashboard = function() {
            if (currentUser && currentUserName) {
                switchView('view-dashboard');
                document.getElementById('welcome-text').textContent = `歡迎，${currentUserName}`;
            } else {
                switchView('view-login');
            }
        };

        // --- Firebase Auth & Listeners ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                setupPublicUsersListener();
            } else {
                currentUser = null;
                switchView('view-login');
            }
        });

        function setupPublicUsersListener() {
            if (!currentUser) return;
            const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'Global_Users');
            if (unsubscribePublicSnapshot) unsubscribePublicSnapshot();
            
            unsubscribePublicSnapshot = onSnapshot(publicRef, (docSnap) => {
                const list = document.getElementById('recent-users-list');
                list.innerHTML = '';
                if (docSnap.exists() && docSnap.data().users && docSnap.data().users.length > 0) {
                    docSnap.data().users.forEach(name => {
                        const btn = document.createElement('button');
                        btn.className = "btn-hover-effect bg-white border-2 border-solid border-teal-200 text-teal-600 px-4 py-2 rounded-full font-bold flex items-center gap-2";
                        btn.innerHTML = `<span class="text-2xl">🧑‍🎓</span> ${name}`;
                        btn.onclick = () => {
                            document.getElementById('username').value = name;
                            window.handleLoginSubmit();
                        };
                        list.appendChild(btn);
                    });
                } else {
                    list.innerHTML = '<span class="text-gray-400 text-sm">目前還沒有人挑戰過喔～</span>';
                }
            }, (error) => {
                console.error("Public Snapshot error:", error);
            });
        }

        function setupPrivateListener() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, COLLECTION_NAME, 'Progress');
            
            if (unsubscribeSnapshot) unsubscribeSnapshot();

            unsubscribeSnapshot = onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    localState = docSnap.data();
                    // Ensure arrays exist
                    if (!localState.mistakes) localState.mistakes = [];
                    if (!localState.favorites) localState.favorites = [];
                    if (!localState.answers) localState.answers = {};
                } else {
                    localState = { answers: {}, mistakes: [], favorites: [] };
                }
                
                // If we are in quiz view, we might need to update UI based on incoming state,
                // but usually, state changes are driven by the user themselves.
                // However, updating stats is safe.
                if (!document.getElementById('view-quiz').classList.contains('hide')) {
                    updateStats();
                    // For a robust implementation, we could re-render cards, but it might interrupt UX.
                    // For now, assume single-device active usage.
                }
            }, (error) => {
                console.error("Private Snapshot error:", error);
            });
        }

        async function saveProgressToFirebase() {
            if (!currentUser) return;
            const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, COLLECTION_NAME, 'Progress');
            try {
                await setDoc(docRef, localState, { merge: true });
            } catch (error) {
                console.error("Save Error:", error);
            }
        }

        // --- Login Logic ---
        window.handleLoginSubmit = async function() {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) {
                customAlert('請輸入姓名喔！ 🥺', '📝');
                return;
            }
            
            currentUserName = nameInput;
            document.getElementById('username-span').textContent = currentUserName;
            document.getElementById('user-display').classList.remove('hide');
            
            // Save to public recent users
            if (currentUser) {
                const publicRef = doc(db, 'artifacts', appId, 'public', 'data', 'Global_Users');
                try {
                    const docSnap = await getDoc(publicRef);
                    let users = [];
                    if (docSnap.exists()) users = docSnap.data().users || [];
                    if (!users.includes(currentUserName)) {
                        users.unshift(currentUserName);
                        if (users.length > 6) users.pop();
                        await setDoc(publicRef, { users });
                    }
                } catch (e) { console.error(e); }
                
                setupPrivateListener();
                goDashboard();
            }
        };

        window.logout = function() {
            customConfirm('確定要登出並返回首頁嗎？', () => {
                currentUserName = '';
                document.getElementById('username').value = '';
                document.getElementById('user-display').classList.add('hide');
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                switchView('view-login');
            }, '👋');
        };

        // --- Quiz Logic ---
        window.startQuiz = function(mode) {
            currentQuizMode = mode;
            
            if (mode === 'all') {
                currentQuizQuestions = [...questionsData];
                document.getElementById('quiz-mode-title').innerHTML = '🚀 全真測驗';
            } else if (mode === 'mistakes') {
                currentQuizQuestions = questionsData.filter(q => localState.mistakes.includes(q.id));
                document.getElementById('quiz-mode-title').innerHTML = '📝 錯題本';
            } else if (mode === 'favorites') {
                currentQuizQuestions = questionsData.filter(q => localState.favorites.includes(q.id));
                document.getElementById('quiz-mode-title').innerHTML = '⭐ 我的最愛';
            }

            switchView('view-quiz');
            renderWaterfall();
            updateStats();
        };

        window.confirmRestart = function() {
            customConfirm('確定要重新開始測驗嗎？\n作答紀錄將會被清除喔！', async () => {
                localState.answers = {};
                // Option: clear mistakes too? Usually restart clears answers, keeps favorites/mistakes pool.
                // Let's just clear answers for the current set.
                currentQuizQuestions.forEach(q => {
                    delete localState.answers[q.id];
                });
                await saveProgressToFirebase();
                renderWaterfall();
                updateStats();
            }, '🔄');
        };

        function renderWaterfall() {
            const container = document.getElementById('waterfall-container');
            const emptyState = document.getElementById('empty-state');
            container.innerHTML = '';
            
            if (currentQuizQuestions.length === 0) {
                container.classList.add('hide');
                emptyState.classList.remove('hide');
                return;
            } else {
                container.classList.remove('hide');
                emptyState.classList.add('hide');
            }

            currentQuizQuestions.forEach((q, index) => {
                const isAnswered = localState.answers[q.id] !== undefined;
                const selectedIdx = localState.answers[q.id];
                const isCorrect = isAnswered && selectedIdx === q.answer;
                const isFavorite = localState.favorites.includes(q.id);

                let cardBgClass = 'bg-white';
                let cardBorderClass = 'border-gray-200';
                
                if (isAnswered) {
                    if (isCorrect) {
                        cardBgClass = 'bg-green-50';
                        cardBorderClass = 'border-green-400';
                    } else {
                        cardBgClass = 'bg-rose-50';
                        cardBorderClass = 'border-rose-400';
                    }
                }

                const card = document.createElement('div');
                card.className = `relative p-6 lg:p-8 rounded-[2.5rem] border-4 border-solid ${cardBorderClass} ${cardBgClass} transition-colors duration-300 shadow-sm`;
                card.id = `q-card-${q.id}`;

                // --- Top Bar (Tag + Favorite) ---
                const topBar = document.createElement('div');
                topBar.className = 'flex justify-between items-start mb-4';
                topBar.innerHTML = `
                    <span class="bg-rose-100 text-rose-700 border-2 border-solid border-rose-300 px-3 py-1 rounded-full text-sm font-bold shadow-sm">
                        📌 ${q.category}
                    </span>
                    <button onclick="toggleFavorite(${q.id})" id="fav-btn-${q.id}" class="btn-hover-effect text-3xl focus:outline-none filter drop-shadow-sm transition-transform">
                        ${isFavorite ? '⭐' : '☆'}
                    </button>
                `;

                // --- Question Text ---
                const qTitle = document.createElement('h3');
                qTitle.className = 'font-serif-tc text-2xl font-bold text-gray-800 mb-6 leading-relaxed';
                qTitle.textContent = `${index + 1}. ${q.question}`;

                // --- Options ---
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'flex flex-col gap-3';
                
                q.options.forEach((opt, optIdx) => {
                    const btn = document.createElement('button');
                    
                    // Style logic
                    let btnBaseClass = "w-full text-left p-4 rounded-[1.5rem] border-4 border-solid transition-all duration-200 font-bold text-lg flex items-center gap-4 ";
                    let btnColorClass = "bg-white border-sky-100 hover:border-sky-300 text-gray-700 btn-hover-effect";
                    let iconHtml = `<span class="w-8 h-8 flex items-center justify-center rounded-full bg-sky-100 text-sky-600 border-2 border-solid border-sky-200">${['A','B','C','D'][optIdx]}</span>`;

                    if (isAnswered) {
                        btn.disabled = true;
                        btnBaseClass = btnBaseClass.replace('btn-hover-effect', ''); // remove hover
                        
                        if (optIdx === q.answer) {
                            // The correct option
                            btnColorClass = "bg-green-100 border-green-400 text-green-800";
                            iconHtml = `<span class="text-2xl">⭕</span>`;
                        } else if (optIdx === selectedIdx) {
                            // User selected wrong option
                            btnColorClass = "bg-rose-100 border-rose-400 text-rose-800 opacity-70 line-through";
                            iconHtml = `<span class="text-2xl">❌</span>`;
                        } else {
                            // Unselected wrong options
                            btnColorClass = "bg-white border-gray-100 text-gray-400 opacity-50";
                        }
                    }

                    btn.className = btnBaseClass + btnColorClass;
                    btn.innerHTML = `${iconHtml} <span>${opt}</span>`;
                    
                    if (!isAnswered) {
                        btn.onclick = () => handleAnswer(q.id, optIdx);
                    }
                    optionsDiv.appendChild(btn);
                });

                // --- Explanation (Hidden if unanswered) ---
                const expDiv = document.createElement('div');
                expDiv.id = `exp-div-${q.id}`;
                expDiv.className = `mt-6 bg-yellow-50 border-4 border-solid border-amber-200 rounded-[1.5rem] p-5 shadow-sm ${isAnswered ? '' : 'hide'}`;
                expDiv.innerHTML = `
                    <div class="flex items-start gap-3">
                        <span class="text-3xl">💡</span>
                        <div class="text-gray-700 font-bold leading-relaxed pt-1">
                            ${q.explanation}
                        </div>
                    </div>
                `;

                // Assemble Card
                card.appendChild(topBar);
                card.appendChild(qTitle);
                card.appendChild(optionsDiv);
                card.appendChild(expDiv);
                
                container.appendChild(card);
            });
        }

        window.handleAnswer = async function(questionId, selectedIdx) {
            const q = questionsData.find(item => item.id === questionId);
            if (!q) return;

            const isCorrect = selectedIdx === q.answer;
            localState.answers[questionId] = selectedIdx;

            if (!isCorrect) {
                if (!localState.mistakes.includes(questionId)) {
                    localState.mistakes.push(questionId);
                }
            } else {
                // Remove from mistakes if they got it right this time (optional logic, but standard)
                const mIdx = localState.mistakes.indexOf(questionId);
                if (mIdx > -1) localState.mistakes.splice(mIdx, 1);
            }

            await saveProgressToFirebase();
            updateStats();
            
            // Re-render just this card instead of whole waterfall to keep scroll position
            reRenderCard(questionId);
        };

        window.toggleFavorite = async function(questionId) {
            const index = localState.favorites.indexOf(questionId);
            if (index === -1) {
                localState.favorites.push(questionId);
            } else {
                localState.favorites.splice(index, 1);
            }
            
            // Update button UI immediately
            const btn = document.getElementById(`fav-btn-${questionId}`);
            if(btn) btn.textContent = localState.favorites.includes(questionId) ? '⭐' : '☆';

            await saveProgressToFirebase();
        };

        function reRenderCard(questionId) {
            // Find the index in the current rendering list to maintain sequence numbers if needed
            // Actually, we can just call renderWaterfall() and use a trick to maintain scroll
            // but for simplicity, calling renderWaterfall() is clean if it's fast enough.
            // Let's do a fast localized update to avoid screen jump.
            
            const card = document.getElementById(`q-card-${questionId}`);
            if(!card) return;
            
            const q = questionsData.find(item => item.id === questionId);
            const selectedIdx = localState.answers[questionId];
            const isCorrect = selectedIdx === q.answer;
            
            // Update Card Border/Bg
            card.className = `relative p-6 lg:p-8 rounded-[2.5rem] border-4 border-solid transition-colors duration-300 shadow-sm ${isCorrect ? 'bg-green-50 border-green-400' : 'bg-rose-50 border-rose-400'}`;
            
            // Update Options
            const optionsDiv = card.children[2]; // 0:topBar, 1:title, 2:options
            Array.from(optionsDiv.children).forEach((btn, optIdx) => {
                btn.disabled = true;
                btn.classList.remove('btn-hover-effect', 'bg-white', 'border-sky-100', 'hover:border-sky-300', 'text-gray-700');
                
                let iconSpan = btn.querySelector('span');
                
                if (optIdx === q.answer) {
                    btn.classList.add('bg-green-100', 'border-green-400', 'text-green-800');
                    iconSpan.outerHTML = `<span class="text-2xl">⭕</span>`;
                } else if (optIdx === selectedIdx) {
                    btn.classList.add('bg-rose-100', 'border-rose-400', 'text-rose-800', 'opacity-70', 'line-through');
                    iconSpan.outerHTML = `<span class="text-2xl">❌</span>`;
                } else {
                    btn.classList.add('bg-white', 'border-gray-100', 'text-gray-400', 'opacity-50');
                }
            });

            // Show Explanation
            const expDiv = document.getElementById(`exp-div-${questionId}`);
            if(expDiv) {
                expDiv.classList.remove('hide');
                // Scroll slightly so explanation is in view
                setTimeout(() => {
                    const rect = expDiv.getBoundingClientRect();
                    if (rect.bottom > window.innerHeight) {
                        window.scrollBy({ top: rect.bottom - window.innerHeight + 50, behavior: 'smooth' });
                    }
                }, 100);
            }
        }

        function updateStats() {
            let correct = 0;
            let wrong = 0;
            let answered = 0;
            
            currentQuizQuestions.forEach(q => {
                if (localState.answers[q.id] !== undefined) {
                    answered++;
                    if (localState.answers[q.id] === q.answer) correct++;
                    else wrong++;
                }
            });
            
            document.getElementById('stat-correct').textContent = correct;
            document.getElementById('stat-wrong').textContent = wrong;
            document.getElementById('stat-remain').textContent = currentQuizQuestions.length - answered;
            
            // If all answered in current mode, show a small congrats
            if (answered > 0 && answered === currentQuizQuestions.length) {
                setTimeout(() => {
                   if(correct === currentQuizQuestions.length) {
                       customAlert('太棒了！你完美完成了這個區塊的所有題目！ 🎉', '🏆');
                   } else {
                       customAlert('測驗完成！記得去「錯題本」複習喔！ 💪', '🏁');
                   }
                }, 500);
            }
        }

        // --- Start Application ---
        initAuth();

    </script>
</body>
</html>
