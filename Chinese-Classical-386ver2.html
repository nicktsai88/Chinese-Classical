            { id: 9, category: "詞性判斷", question: "「不辱其身莫觸膚」的「辱」，詞性是？", options: ["名詞，恥辱", "動詞，玷汙、使受辱", "形容詞，羞恥的", "副詞，侮辱地"], answer: 1, explanation: "「不辱其身」意即「不使自身受到玷汙」，故「辱」為動詞（使動用法）。" },

            { id: 13, category: "成語應用", question: "詩中諷刺「人少恥」，下列哪個成語最適合用來形容這類人？", options: ["虛懷若谷", "厚顏無恥", "剛正不阿", "唾面自乾"], answer: 1, explanation: "「厚顏無恥」形容人臉皮厚，不知羞恥。" },

            { id: 16, category: "詩句解讀", question: "「可憐造物亦糊塗」中的「可憐」，意思最接近？", options: ["值得同情", "可愛（如《長恨歌》）", "可惜、可嘆（帶有嘲諷意味）", "悲慘"], answer: 2, explanation: "在此處，「可憐」並非乞憐或可愛，而是「可嘆」、「令人感到荒謬/可惜」的意思。" },

            { id: 18, category: "文法修辭", question: "「野草知羞人少恥」這句詩，在句法結構上屬於？", options: ["對偶句", "排比句", "頂真句", "回文句"], answer: 0, explanation: "「野草」對「人（類）」、「知」對「少」（動詞對副/動，雖不工整但具對仗意）、「羞」對「恥」。具對偶（對仗）性質。" },

            { id: 22, category: "情境應用", question: "若你想勸誡一位行為不檢點的朋友自重，可以用詩中哪一句話？", options: ["不容褻玩似真儒", "野草知羞人少恥", "可憐造物亦糊塗", "不辱其身莫觸膚"], answer: 3, explanation: "「不辱其身」即勸人要愛惜羽毛，不要辱沒了自己的身分與名譽。" },
            { id: 23, category: "詞語代換", question: "「造物亦糊塗」的「糊塗」，替換為下列何詞後，句意改變最小？", options: ["聰明", "昏庸", "嚴苛", "慈悲"], answer: 1, explanation: "糊塗即不明事理，與「昏庸」意近。" },
            { id: 24, category: "寫作特色", question: "關於本詩的寫作特色，下列分析何者正確？", options: ["全詩寫景，不帶感情", "用典深奧，晦澀難懂", "借物抒懷，語言淺白而寓意深遠", "駢散並用，氣勢磅礴"], answer: 2, explanation: "文字淺顯（如糊塗、野草），但寓含深刻的道德諷喻。" },
            { id: 25, category: "綜合賞析", question: "作者認為含羞草「似真儒」，主要是因為它？", options: ["外表柔弱", "生長環境清幽", "具有防衛機制（閉合），展現「有所不為」的氣節", "隨風搖擺，身段柔軟"], answer: 2, explanation: "詩中強調「不容褻玩」、「知羞」、「不辱其身」，將含羞草受觸閉合的生物本能，解讀為儒者潔身自愛、有所不為的氣節。" }
        ];

        let currentState = {
            username: '',
            answers: {}, // { questionId: selectedOptionIndex }
        };

        const ui = {
            usernameInput: document.getElementById('username'),
            userDisplay: document.getElementById('user-display'),
            usernameSpan: document.getElementById('username-span'),
            dashboardUsername: document.getElementById('dashboard-username'),
            recentUsersList: document.getElementById('recent-users-list'),
            quickLoginArea: document.getElementById('quick-login-area'),
            quizListContainer: document.getElementById('quiz-list-container'),
            stickyStatsBar: document.getElementById('sticky-stats-bar'),
            statsCorrect: document.getElementById('stats-correct'),
            statsWrong: document.getElementById('stats-wrong'),
            statsProgress: document.getElementById('stats-progress'),
            dashCorrectCount: document.getElementById('dash-correct-count'),
            dashWrongCount: document.getElementById('dash-wrong-count'),
            connectionStatus: document.getElementById('connection-status'),
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text')
        };

        const views = {
            login: document.getElementById('view-login'),
            dashboard: document.getElementById('view-dashboard'),
            quiz: document.getElementById('view-quiz')
        };

        // --- Firebase Init ---
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            signInAnonymously(auth).catch(console.error);
            isFirebaseReady = true;
        } catch (e) {
            console.error("Firebase Init Error", e);
            updateConnectionStatus('error', '離線模式');
        }

        // --- Core Functions ---

        function init() {
            if (isFirebaseReady) {
                // Listen to Global Users
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                onSnapshot(globalRef, (docSnap) => {
                    updateConnectionStatus('success', '已連線');
                    if (docSnap.exists()) {
                        renderRecentUsers(docSnap.data().users || []);
                    }
                }, (error) => {
                    updateConnectionStatus('error', '連線中斷');
                });
            }
        }

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot';
            if (type === 'loading') ui.statusDot.classList.add('status-loading');
            else if (type === 'success') ui.statusDot.classList.add('status-success');
            else if (type === 'error') ui.statusDot.classList.add('status-error');
        }

        function renderRecentUsers(users) {
            if (users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = '';
                users.forEach(user => {
                    const btn = document.createElement('button');
                    btn.className = 'px-4 py-2 bg-white border border-gray-200 hover:border-orange-500 hover:text-orange-600 rounded-full text-sm transition shadow-sm';
                    btn.textContent = user;
                    btn.onclick = () => {
                        ui.usernameInput.value = user;
                        window.attemptLogin();
                    };
                    ui.recentUsersList.appendChild(btn);
                });
            }
        }

        // --- Login & State ---

        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) return alert('請輸入姓名');

            currentState.username = name;
            ui.userDisplay.classList.remove('hidden');
            ui.userDisplay.classList.add('flex');
            ui.usernameSpan.textContent = name;
            ui.dashboardUsername.textContent = name;

            if (isFirebaseReady) {
                // Add to global list
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                setDoc(globalRef, { users: arrayUnion(name) }, { merge: true }).catch(console.error);

                // Listen to user progress
                startUserListener(name);
            } else {
                switchView('dashboard');
            }
        }

        function startUserListener(username) {
            if (currentUserUnsubscribe) currentUserUnsubscribe();
            
            const userRef = doc(db, COLLECTION_NAME, username);
            ui.connectionStatus.classList.remove('hidden');

            currentUserUnsubscribe = onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentState.answers = data.answers || {};
                    updateStats();
                } else {
                    currentState.answers = {};
                    updateStats();
                }
                
                // Refresh views based on new data
                if (!views.quiz.classList.contains('hidden')) {
                    // If in quiz mode, re-render implies update UI states without full redraw to keep scroll
                    // But for simplicity in this prompt, we'll re-render if data changes externally
                    // Or just let local interaction handle immediate DOM updates
                }
                
                // If we just logged in, go to dashboard
                if (!views.dashboard.classList.contains('hidden') || !views.quiz.classList.contains('hidden')) {
                   // do nothing, let user navigate
                } else {
                   switchView('dashboard');
                }
                
            }, (error) => {
                console.error(error);
                updateConnectionStatus('error', '同步失敗');
            });
        }

        window.startExam = function() {
            switchView('quiz');
            renderWaterfallQuiz();
            scrollToFirstUnanswered();
        }

        window.goHome = function() {
            if (currentState.username) switchView('dashboard');
            else switchView('login');
        }

        window.logout = function() {
            if(confirm("確定要登出嗎？")) {
                location.reload();
            }
        }

        window.resetProgress = function() {
            if(confirm("確定要清除所有作答紀錄嗎？")) {
                currentState.answers = {};
                saveProgress();
                updateStats();
                alert("紀錄已清除");
            }
        }

        function switchView(viewName) {
            Object.values(views).forEach(el => el.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
            window.scrollTo(0, 0);

            if (viewName === 'quiz') {
                ui.stickyStatsBar.classList.remove('hidden');
            } else {
                ui.stickyStatsBar.classList.add('hidden');
            }
        }

        // --- Waterfall Logic ---

        function updateStats() {
            let correct = 0;
            let wrong = 0;
            let total = questionsData.length;
            let answered = 0;

            questionsData.forEach(q => {
                if (currentState.answers[q.id] !== undefined) {
                    answered++;
                    if (currentState.answers[q.id] === q.answer) correct++;
                    else wrong++;
                }
            });

            // Update Sticky Bar
            ui.statsCorrect.textContent = correct;
            ui.statsWrong.textContent = wrong;
            ui.statsProgress.textContent = answered;

            // Update Dashboard
            ui.dashCorrectCount.textContent = correct;
            ui.dashWrongCount.textContent = wrong;
        }

        function renderWaterfallQuiz() {
            const container = ui.quizListContainer;
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const userAnswer = currentState.answers[q.id];
                const isAnswered = userAnswer !== undefined;
                const isCorrect = isAnswered && userAnswer === q.answer;
                const isWrong = isAnswered && !isCorrect;

                // Card Styles
                let borderColor = isAnswered 
                    ? (isCorrect ? 'border-green-500 bg-green-50/30' : 'border-red-500 bg-red-50/30') 
                    : 'border-transparent bg-white';
                
                if (!isAnswered) borderColor += ' hover:border-orange-200 border-2 border-gray-100'; // Default border

                const card = document.createElement('div');
                card.id = `q-card-${q.id}`;
                card.className = `relative rounded-3xl shadow-sm p-6 md:p-10 transition-all duration-300 ${borderColor}`;

                // Header
                const headerHtml = `
                    <div class="flex flex-col md:flex-row md:items-start gap-4 mb-8">
                        <span class="flex-shrink-0 bg-orange-600 text-white font-bold rounded-lg px-4 py-2 text-xl shadow-sm self-start">#${index + 1}</span>
                        <div class="flex-grow">
                            <span class="inline-block bg-orange-100 text-orange-800 text-sm px-3 py-1 rounded-full font-bold mb-3">${q.category}</span>
                            <h3 class="text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed tracking-wide serif">${q.question}</h3>
                        </div>
                    </div>
                `;

                // Options
                let optionsHtml = '<div class="grid gap-4">';
                q.options.forEach((opt, optIdx) => {
                    const letter = ['A','B','C','D'][optIdx];
                    let btnClass = "option-btn w-full text-left p-5 rounded-2xl border-2 flex items-center group transition-all ";
                    let circleClass = "w-10 h-10 flex items-center justify-center rounded-full font-bold mr-5 text-lg flex-shrink-0 transition-colors ";
                    let iconHtml = "";

                    if (isAnswered) {
                        if (optIdx === q.answer) {
                            // Correct Option (Always Green)
                            btnClass += "bg-green-100 border-green-500 text-green-900 shadow-md transform scale-[1.01]";
                            circleClass += "bg-green-600 text-white";
                            iconHtml = '<i class="fas fa-check-circle text-2xl text-green-600 ml-auto"></i>';
                        } else if (optIdx === userAnswer && isWrong) {
                            // Wrong Selected Option
                            btnClass += "bg-red-100 border-red-500 text-red-900 opacity-90";
                            circleClass += "bg-red-600 text-white";
                            iconHtml = '<i class="fas fa-times-circle text-2xl text-red-600 ml-auto"></i>';
                        } else {
                            // Other unselected options
                            btnClass += "bg-white/50 border-transparent text-gray-400 opacity-60 cursor-not-allowed";
                            circleClass += "bg-gray-200 text-gray-500";
                        }
                    } else {
                        // Not Answered State
                        btnClass += "bg-white border-gray-200 hover:border-orange-400 hover:bg-orange-50 cursor-pointer";
                        circleClass += "bg-orange-100 text-orange-600 group-hover:bg-orange-500 group-hover:text-white";
                    }

                    // Onclick logic string
                    const clickHandler = isAnswered ? '' : `onclick="window.handleWaterfallAnswer(${q.id}, ${optIdx})"`;

                    optionsHtml += `
                        <button ${clickHandler} class="${btnClass}" ${isAnswered ? 'disabled' : ''}>
                            <span class="${circleClass}">${letter}</span>
                            <span class="font-medium text-xl">${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation
                let explanationHtml = '';
                if (isAnswered) {
                    explanationHtml = `
                        <div class="mt-8 bg-orange-50/80 p-6 md:p-8 rounded-2xl border border-orange-200 slide-up">
                            <div class="flex items-start gap-4">
                                <div class="flex-shrink-0 mt-1">
                                    <i class="fas fa-lightbulb text-orange-500 text-3xl"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-orange-800 text-xl mb-3">解析</h4>
                                    <p class="text-gray-700 text-xl leading-loose text-justify">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });
        }

        window.handleWaterfallAnswer = function(qId, selectedIdx) {
            // Update State
            currentState.answers[qId] = selectedIdx;
            
            // Re-render only to reflect changes (In a React app we'd just update state, here we rebuild UI or could patch it)
            // For simplicity and to ensure animations trigger, we rebuild the list but preserve scroll? 
            // Better: Re-render the specific Card to avoid jumpiness.
            
            // Save to Cloud
            saveProgress();
            
            // Update UI immediately
            renderWaterfallQuiz(); // Re-render triggers status update logic inside
            updateStats();
        }

        function scrollToFirstUnanswered() {
            setTimeout(() => {
                const firstUnanswered = questionsData.find(q => currentState.answers[q.id] === undefined);
                if (firstUnanswered) {
                    const el = document.getElementById(`q-card-${firstUnanswered.id}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
            }, 300); // Small delay to ensure DOM is ready
        }

        function saveProgress() {
            if (!isFirebaseReady || !currentState.username) return;
            
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            setDoc(userRef, { answers: currentState.answers, timestamp: new Date().getTime() }, { merge: true })
                .catch(console.error);
        }

        // Start
        init();
        
        // Expose function for global scope
        window.handleWaterfallAnswer = window.handleWaterfallAnswer;

    </script>
</body>
</html>
