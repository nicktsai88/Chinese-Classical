        // --- Data (悲摯獸) ---
        const questionsData = [
            { id: 1, category: "詞語釋義", question: "「行其稼穡之側」的「稼穡」，泛指什麼？", options: ["農具", "農事或農作物", "灌溉系統", "田間小路"], answer: 1, explanation: "「稼」是種植，「穡」是收割。稼穡合稱泛指農事或農作物。此處指農夫走在農作物旁邊。" },
            { id: 2, category: "字義測驗", question: "「有苕頃焉」的「苕」，讀音與意思是？", options: ["ㄊㄧㄠˊ，一種蘆葦或豆科植物", "ㄓㄠ，沼澤", "ㄕㄠˊ，樹梢", "ㄉㄠ，稻子"], answer: 0, explanation: "苕（ㄊㄧㄠˊ），植物名，指凌霄花或葦草類。此處指生長在澤邊的植物叢。" },
            { id: 3, category: "詞義推敲", question: "「若有物娭」的「娭」，通「嬉」，意思是？", options: ["嘆息", "嬉戲、玩耍", "嫉妒", "埋伏"], answer: 1, explanation: "「娭」音ㄒㄧ，通「嬉」，嬉戲之意。" },
            { id: 4, category: "字音辨析", question: "「跳踉哮闞」中的「踉」、「闞」讀音分別為？", options: ["ㄌㄧㄤˊ，ㄎㄢˇ", "ㄌㄤˊ，ㄏㄢˇ", "ㄌㄧㄤˊ，ㄏㄢˇ", "ㄌㄤˊ，ㄎㄢˋ"], answer: 2, explanation: "跳踉（ㄌㄧㄤˊ）：跳躍。哮闞（ㄏㄢˇ）：老虎怒吼聲。故選C。（註：闞亦讀ㄎㄢˋ，但作為虎聲多讀ㄏㄢˇ，如《詩經》「闞如虓虎」）。" },
            { id: 5, category: "文句翻譯", question: "「負不勝其喜之態也」的意思是？", options: ["背負著無法承受的重物", "辜負了大家對牠的喜愛", "表現出快樂得不能自已（承受不住）的樣子", "因為太高興而忘記了危險"], answer: 2, explanation: "「負」有懷有、具有之意；「不勝」意為無法承受。指老虎高興到了極點，彷彿承受不住那份喜悅。" },
            { id: 6, category: "詞義測驗", question: "「乃挺矢匿形」的「挺」，在此作何解釋？", options: ["挺立、站直", "拔出、引（弓）或舉起（矢）", "忍受", "勉強"], answer: 1, explanation: "「挺矢」指拿出箭、舉起箭準備射擊。挺有拔出、舉起之意。" },
            { id: 7, category: "字義比較", question: "「雷然而踣」的「踣」，意思與下列何者最接近？", options: ["跑", "跳", "跌倒、仆倒", "踐踏"], answer: 2, explanation: "踣（ㄅㄛˊ），意為僵仆、跌倒（死亡）。" },
            { id: 8, category: "動物辨識", question: "「枕死麕而斃矣」中的「麕」，是指哪種動物？", options: ["兔子", "獐子（一種鹿）", "野豬", "狐狸"], answer: 1, explanation: "麕（ㄐㄩㄣ），同「麇」，即獐子，一種小型的鹿科動物。" },
            { id: 9, category: "邏輯推演", question: "農夫最初看到老虎「跳踉哮闞」時，他心裡的解讀是什麼？（誤解）", options: ["老虎抓到了一隻鹿，很高興", "老虎發瘋了", "老虎看到自己（農夫），正高興準備吃人", "老虎正在求偶"], answer: 2, explanation: "文中提到「農夫謂虎見己，將遇食而喜者」，農夫以為老虎是因為看到他這個「食物」才這麼高興的。" },
            { id: 10, category: "修辭技巧", question: "「雷然而踣」使用了什麼修辭技巧？", options: ["轉化", "譬喻（明喻）", "誇飾", "倒反"], answer: 2, explanation: "形容倒下的聲音像雷一樣大，這是聽覺上的誇飾（兼譬喻，若視為「如雷」），主要強調聲響巨大與倒下的沉重，屬誇飾修辭。" },
            { id: 11, category: "虛詞用法", question: "「意者謂獲其麕」的「意者」，在文言文中常用來表示？", options: ["意外的人", "意志堅定者", "推測之詞（想來、大概是）", "意味深長"], answer: 2, explanation: "「意者」是推測語氣詞，意思是「推測起來」、「想來是」。" },
            { id: 12, category: "文意理解", question: "「不吹而飛」描述的是什麼景象？", options: ["風很大，把花吹飛了", "沒有風，花卻自己飛起來（暗示有物在動）", "花朵自己有翅膀", "農夫吹氣讓花飛起來"], answer: 1, explanation: "「不吹」指沒有風吹，「而飛」指花卻飛舞散落。這是側面描寫，暗示草叢中有動物在劇烈活動。" },
            { id: 13, category: "情節分析", question: "老虎真正的死因，歸根究柢是因為？", options: ["牠想要吃農夫，結果被反殺", "牠沉浸在捕獲獵物的喜悅中，疏於防備（樂極生悲）", "牠生病了，體力不支", "牠為了保護死去的鹿而犧牲"], answer: 1, explanation: "老虎是因為「將食而娭」（吃之前在玩耍），「伺其重娭」（農夫趁牠玩得正起勁）而被殺。死於得意忘形、疏於防備。" },
            { id: 14, category: "字詞活用", question: "「枕死麕而斃矣」的「枕」，詞性與意思是？", options: ["名詞，枕頭", "動詞，以...為枕（靠著）", "形容詞，珍貴的", "副詞，正在"], answer: 1, explanation: "「枕」在此轉品為動詞，意為「枕著」、「靠著頭」。" },
            { id: 15, category: "主旨寓意", question: "本文標題為「悲摯獸」，其「悲」的深層含義最可能是？", options: ["悲嘆老虎不夠兇猛", "悲嘆農夫濫殺無辜", "悲嘆因一時得意忘形（喜）而招致殺身之禍（害）的道理", "悲嘆鹿的命運悲慘"], answer: 2, explanation: "故事結尾「將食而娭，將娭而害」，點出樂極生悲、因喜失防的哲理，這才是作者感嘆（悲）的重點。" },
            { id: 16, category: "比較閱讀", question: "本文中農夫的行為「挺矢匿形，伺其重娭」，顯示出農夫具有何種特質？", options: ["膽小如鼠，只會躲藏", "魯莽衝動，不顧後果", "冷靜機智，善於觀察時機", "慈悲為懷，不忍殺生"], answer: 2, explanation: "農夫誤以為老虎要吃他，但他沒有驚慌逃跑，而是冷靜躲藏，等待老虎玩得最起勁（重娭）且防備最鬆懈時才攻擊，顯示其機智冷靜。" },
            { id: 17, category: "句式判斷", question: "「視之，虎也。」屬於什麼句型？", options: ["敘事句", "有無句", "判斷句", "表態句"], answer: 2, explanation: "「...，虎也」即「（這）是老虎」，以名詞（虎）作為謂語，結尾用「也」表判斷，為標準的判斷句。" },
            { id: 18, category: "字義辨析", question: "「行其稼穡之側」與「伺其重娭」，兩句中的「其」字分別指代？", options: ["皆指農夫", "皆指老虎", "前者指農夫，後者指老虎", "前者指老虎，後者指農夫"], answer: 2, explanation: "「行其（農夫的）稼穡之側」；「伺其（老虎的）重娭」。" },
            { id: 19, category: "文句重組", question: "「將娭而害」省略了主語，補上後應為？", options: ["（農夫）將娭而害", "（麕）將娭而害", "（虎）將娭而害", "（苕）將娭而害"], answer: 2, explanation: "是指老虎正要玩樂（娭）卻被害（害）了。" },
            { id: 20, category: "寫作手法", question: "文中先寫「苕花紛然」，再寫「視之，虎也」，這種寫法屬於？", options: ["開門見山", "未見其形，先聞其聲（或先見其跡），製造懸念", "倒敘法", "擬人法"], answer: 1, explanation: "先寫花亂飛的異象，引起讀者與農夫的注意，再揭示主角是老虎，具有鋪墊與製造懸念的效果。" },
            { id: 21, category: "詞語理解", question: "「匯澤之場」是指什麼樣的地方？", options: ["匯聚人才的考場", "水草豐茂的沼澤地帶", "熱鬧的市場", "乾燥的沙漠"], answer: 1, explanation: "「匯澤」指水流匯聚的沼澤，「場」指處所。配合後文的「苕」（水邊植物）與「農夫」，可知是水邊農田。" },
            { id: 22, category: "虛詞用法", question: "「貫其腋」的「其」，指代部位是？", options: ["農夫的", "老虎的", "鹿的", "弓箭的"], answer: 1, explanation: "指射穿了老虎的腋下。" },
            { id: 23, category: "成語聯想", question: "老虎因「重娭」（過度玩樂）而喪命，這與下列哪句成語的警示意義相通？", options: ["玩物喪志", "樂極生悲", "自食其果", "以卵擊石"], answer: 1, explanation: "老虎因過度高興（喜、娭）而忽略危險導致死亡，正是「樂極生悲」的寫照。" },
            { id: 24, category: "細節觀察", question: "「伺其重娭」中的「重」，解釋為？", options: ["重量大", "重新", "極度、正當...的時候（指程度深）", "重視"], answer: 2, explanation: "「重」在此表程度，指玩得正起勁、正投入的時候。" },
            { id: 25, category: "綜合測驗", question: "下列關於本文的敘述，何者正確？", options: ["這是一篇描寫人虎大戰的武俠小說", "農夫射殺老虎是為了搶奪死鹿", "這是一篇寓言，藉由老虎的故事警惕世人不可得意忘形", "老虎最後是被農夫設下的陷阱捕獲的"], answer: 2, explanation: "(A)非武俠。(B)農夫是誤以為虎要吃人而自衛，非為搶鹿。(D)是被箭射死，非陷阱。" }
        ];

        // --- State ---
        let currentState = {
            username: '',
            answers: {}, // { questionId: selectedOptionIndex }
            mistakes: [], 
            favorites: [], 
            isFinished: false
        };

        // --- UI Refs ---
        const views = {
            login: document.getElementById('view-login'),
            dashboard: document.getElementById('view-dashboard'),
            quiz: document.getElementById('view-quiz'),
            result: document.getElementById('view-result'),
            review: document.getElementById('view-review')
        };
        
        const ui = {
            usernameInput: document.getElementById('username'),
            userDisplay: document.getElementById('user-display'),
            usernameSpan: document.getElementById('username-span'),
            dashboardUsername: document.getElementById('dashboard-username'),
            dashWrongCount: document.getElementById('dash-wrong-count'),
            dashFavCount: document.getElementById('dash-fav-count'),
            quickLoginArea: document.getElementById('quick-login-area'),
            recentUsersList: document.getElementById('recent-users-list'),
            resultScore: document.getElementById('result-score'),
            resultCorrect: document.getElementById('result-correct'),
            resultWrong: document.getElementById('result-wrong'),
            reviewList: document.getElementById('review-list'),
            reviewTitle: document.getElementById('review-title'),
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            stickyStatsBar: document.getElementById('sticky-stats-bar'),
            stickyCorrect: document.getElementById('sticky-correct'),
            stickyWrong: document.getElementById('sticky-wrong'),
            stickyProgress: document.getElementById('sticky-progress'),
            btnBackToTop: document.getElementById('btn-back-to-top'),
            quizListContainer: document.getElementById('quiz-list-container')
        };

        // --- Initialization ---
        function init() {
            // Scroll event for FAB
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    ui.btnBackToTop.classList.remove('hidden');
                } else {
                    ui.btnBackToTop.classList.add('hidden');
                }
            });

            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                onSnapshot(globalRef, (docSnap) => {
                    updateConnectionStatus('success', '已同步');
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        renderRecentUsers(data.users || []);
                    } else {
                        renderRecentUsers([]);
                    }
                }, (error) => {
                    console.error("Global listen error", error);
                    updateConnectionStatus('error', '同步失敗');
                });
            } else {
                renderRecentUsers([]); 
            }
        }

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot';
            if (type === 'loading') ui.statusDot.classList.add('status-loading');
            else if (type === 'success') ui.statusDot.classList.add('status-success');
            else if (type === 'error') ui.statusDot.classList.add('status-error');
        }

        function renderRecentUsers(users) {
            if (users && users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = '';
                users.forEach(user => {
                    const btn = document.createElement('button');
                    btn.className = 'px-4 py-2 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-full text-sm border border-orange-200 transition mb-2';
                    btn.innerHTML = `<i class="fas fa-user-circle mr-1"></i>${user}`;
                    btn.onclick = () => quickLogin(user);
                    ui.recentUsersList.appendChild(btn);
                });
            } else {
                 ui.quickLoginArea.classList.remove('hidden');
                 ui.recentUsersList.innerHTML = '<p class="text-sm text-gray-400 w-full text-center py-2">尚無挑戰者紀錄，歡迎加入！</p>';
            }
        }

        window.quickLogin = function(name) {
            ui.usernameInput.value = name;
            window.attemptLogin();
        }

        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) {
                alert('請輸入姓名');
                return;
            }
            currentState.username = name;
            
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                setDoc(globalRef, { users: arrayUnion(name) }, { merge: true }).catch(console.error);
                startUserListener(name);
            }

            ui.userDisplay.classList.remove('hidden');
            ui.userDisplay.classList.add('flex');
            ui.usernameSpan.textContent = name;
            switchView('dashboard');
        }

        function startUserListener(username) {
            if (currentUserUnsubscribe) currentUserUnsubscribe();
            const userRef = doc(db, COLLECTION_NAME, username);
            
            currentUserUnsubscribe = onSnapshot(userRef, (docSnap) => {
                updateConnectionStatus('success', '已同步');
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentState.favorites = data.favorites || [];
                    currentState.mistakes = data.mistakes || [];
                    
                    ui.dashWrongCount.textContent = currentState.mistakes.length;
                    ui.dashFavCount.textContent = currentState.favorites.length;

                    if (data.progress) {
                        currentState.answers = data.progress.answers || {};
                        currentState.isFinished = data.progress.isFinished || false;
                        
                        // If in quiz view, re-render to update UI states (e.g. from other device)
                        // But avoid re-rendering if user is actively interacting to prevent jumps
                        const quizView = document.getElementById('view-quiz');
                        if (!quizView.classList.contains('hidden')) {
                            updateStatsBar(); // Update sticky header
                            // Ideally we would update DOM classes here without full re-render
                            // For simplicity in this structure, we'll re-render if needed
                            // or rely on local clicks for immediate feedback
                        }
                    }
                } else {
                    currentState.favorites = [];
                    currentState.mistakes = [];
                    currentState.answers = {};
                    currentState.isFinished = false;
                }
            }, (error) => {
                console.error("User listen error", error);
                updateConnectionStatus('error', '同步失敗');
            });
        }

        function switchView(viewName) {
            Object.values(views).forEach(el => el.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
            window.scrollTo(0, 0);

            // Toggle Sticky Stats Bar
            if (viewName === 'quiz') {
                ui.stickyStatsBar.classList.remove('hidden');
            } else {
                ui.stickyStatsBar.classList.add('hidden');
            }
        }

        window.startExam = function() {
            if (!currentState.isFinished && Object.keys(currentState.answers).length > 0) {
                 const resume = confirm(`系統發現您上次已作答 ${Object.keys(currentState.answers).length} 題，是否繼續？`);
                 if (resume) {
                     switchView('quiz');
                     renderWaterfallQuiz();
                     return;
                 }
            }
            window.restartQuiz();
        }

        window.showDashboard = function() {
            switchView('dashboard');
        }

        window.restartQuiz = function() {
            currentState.answers = {};
            currentState.isFinished = false;
            saveProgress(); 
            switchView('quiz');
            renderWaterfallQuiz();
        }

        function saveProgress() {
            if (!isFirebaseReady || !currentState.username) return;
            updateConnectionStatus('loading', '儲存中...');
            
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const progressData = {
                answers: currentState.answers,
                isFinished: currentState.isFinished,
                timestamp: new Date().getTime()
            };

            setDoc(userRef, { progress: progressData }, { merge: true })
                .then(() => updateConnectionStatus('success', '已同步'))
                .catch(e => {
                    console.error(e);
                    updateConnectionStatus('error', '同步失敗');
                });
        }

        function saveUserData(type) {
            if (!isFirebaseReady || !currentState.username) return;
            updateConnectionStatus('loading', '儲存中...');
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const data = {};
            data[type] = currentState[type];
            setDoc(userRef, data, { merge: true })
                .then(() => updateConnectionStatus('success', '已同步'))
                .catch(e => {
                    console.error(e);
                    updateConnectionStatus('error', '同步失敗');
                });
        }

        window.logout = function() {
            if (confirm("確定要登出嗎？您的作答進度與錯題本已自動同步至雲端。")) {
                if (currentUserUnsubscribe) currentUserUnsubscribe();
                currentState.username = '';
                ui.userDisplay.classList.add('hidden');
                ui.userDisplay.classList.remove('flex');
                ui.usernameInput.value = '';
                switchView('login');
            }
        }
        
        window.goHome = function() {
            if (currentState.username) window.showDashboard();
            else switchView('login');
        }

        window.scrollToTop = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- Waterfall Quiz Logic ---

        function renderWaterfallQuiz() {
            const container = ui.quizListContainer;
            container.innerHTML = '';
            
            questionsData.forEach((q, index) => {
                const userAnswer = currentState.answers[q.id];
                const isAnswered = userAnswer !== undefined;
                const isCorrect = isAnswered && userAnswer === q.answer;
                const isFavorite = currentState.favorites.includes(q.id);

                // Card Styles
                let cardBorder = "border-gray-100";
                let cardBg = "bg-white";
                if (isAnswered) {
                    cardBorder = isCorrect ? "border-green-400" : "border-red-400";
                    cardBg = isCorrect ? "bg-green-50/30" : "bg-red-50/30";
                }

                const card = document.createElement('div');
                card.id = `q-card-${q.id}`;
                card.className = `relative rounded-2xl shadow-sm border-2 p-6 md:p-8 transition-all duration-300 ${cardBorder} ${cardBg}`;

                // Header
                const favClass = isFavorite ? "fas text-amber-500" : "far text-gray-300";
                
                let headerHtml = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="flex items-start gap-4">
                            <span class="flex-shrink-0 bg-orange-500 text-white font-bold rounded-lg px-3 py-1 text-lg shadow-sm mt-1">#${index + 1}</span>
                            <div>
                                <span class="inline-block bg-orange-100 text-orange-700 text-sm px-2.5 py-0.5 rounded-md font-bold mb-2 tracking-wide">${q.category}</span>
                                <h3 class="text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed tracking-wide serif text-justify">${q.question}</h3>
                            </div>
                        </div>
                        <button onclick="window.toggleWaterfallFavorite(${q.id})" class="text-2xl p-2 transition hover:scale-110 active:scale-95" title="加入最愛">
                            <i id="fav-icon-${q.id}" class="${favClass} fa-star"></i>
                        </button>
                    </div>
                `;

                // Options
                let optionsHtml = '<div class="grid gap-4">';
                q.options.forEach((opt, optIdx) => {
                    const letters = ['A','B','C','D'];
                    let btnClass = "bg-white border-gray-200 hover:border-orange-300 hover:bg-orange-50 text-gray-700";
                    let circleClass = "bg-orange-100 text-orange-600 group-hover:bg-orange-500 group-hover:text-white";
                    let statusIcon = "";

                    if (isAnswered) {
                        if (optIdx === q.answer) {
                            // Correct Option
                            btnClass = "bg-green-100 border-green-500 text-green-900 shadow-md transform scale-[1.01]";
                            circleClass = "bg-green-500 text-white";
                            statusIcon = '<i class="fas fa-check-circle text-green-600 text-2xl ml-auto"></i>';
                        } else if (optIdx === userAnswer) {
                            // Wrong Selection
                            btnClass = "bg-red-100 border-red-500 text-red-900";
                            circleClass = "bg-red-500 text-white";
                            statusIcon = '<i class="fas fa-times-circle text-red-600 text-2xl ml-auto"></i>';
                        } else {
                            // Other Options
                            btnClass = "bg-gray-50 border-gray-100 text-gray-400 opacity-60";
                            circleClass = "bg-gray-200 text-gray-500";
                        }
                    }

                    const disabledAttr = isAnswered ? 'disabled' : '';
                    const cursorClass = isAnswered ? 'cursor-default' : 'cursor-pointer';

                    optionsHtml += `
                        <button ${disabledAttr} onclick="window.handleWaterfallAnswer(${index}, ${optIdx})" 
                            class="option-btn w-full text-left p-5 rounded-xl border-2 flex items-center group transition-all duration-200 ${btnClass} ${cursorClass}">
                            <span class="w-10 h-10 flex items-center justify-center rounded-full font-bold mr-5 text-lg flex-shrink-0 transition-colors ${circleClass}">
                                ${letters[optIdx]}
                            </span>
                            <span class="font-medium text-xl leading-snug">${opt}</span>
                            ${statusIcon}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation
                let explanationHtml = '';
                if (isAnswered) {
                    const expBg = isCorrect ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200";
                    explanationHtml = `
                        <div class="mt-8 p-6 rounded-2xl border ${expBg} animate-fade-in-up">
                            <div class="flex items-start gap-4">
                                <div class="mt-1">
                                    <i class="fas fa-lightbulb text-orange-500 text-2xl"></i>
                                </div>
                                <div>
                                    <span class="font-bold text-orange-700 block mb-3 text-xl">解析：</span>
                                    <p class="text-gray-800 text-xl leading-9 text-justify font-medium">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });

            updateStatsBar();
        }

        window.handleWaterfallAnswer = function(qIndex, selectedIdx) {
            const q = questionsData[qIndex];
            
            // Prevent re-answering
            if (currentState.answers[q.id] !== undefined) return;

            // Update State
            currentState.answers[q.id] = selectedIdx;
            
            // Calculate correctness
            const isCorrect = selectedIdx === q.answer;
            if (!isCorrect) {
                if (!currentState.mistakes.includes(q.id)) {
                    currentState.mistakes.push(q.id);
                    saveUserData('mistakes');
                }
            }

            // Save Progress
            saveProgress();

            // Update DOM immediately for speed (Partial Re-render logic)
            // Instead of re-rendering whole list, we re-render just this card
            // But to keep code clean and robust, we can cheat by replacing the card's innerHTML
            // Or just call renderWaterfallQuiz() but we need to maintain scroll position.
            // Since we have vertical list, full re-render might jump. 
            // Better: Re-generate HTML for this single card and swap it.
            
            // Simple approach: Re-render ALL is fine if we are careful, but let's do single card update
            updateSingleCard(qIndex);
            updateStatsBar();
        }

        function updateSingleCard(qIndex) {
            const q = questionsData[qIndex];
            const userAnswer = currentState.answers[q.id];
            const isAnswered = true;
            const isCorrect = userAnswer === q.answer;
            const isFavorite = currentState.favorites.includes(q.id);
            const card = document.getElementById(`q-card-${q.id}`);
            
            if (!card) return;

            // Update classes
            card.className = `relative rounded-2xl shadow-sm border-2 p-6 md:p-8 transition-all duration-300 ${isCorrect ? "border-green-400 bg-green-50/30" : "border-red-400 bg-red-50/30"}`;

            // Rebuild Content (Copy-paste logic from render mainly)
            // Header
            const favClass = isFavorite ? "fas text-amber-500" : "far text-gray-300";
            let headerHtml = `
                <div class="flex justify-between items-start mb-6">
                    <div class="flex items-start gap-4">
                        <span class="flex-shrink-0 bg-orange-500 text-white font-bold rounded-lg px-3 py-1 text-lg shadow-sm mt-1">#${qIndex + 1}</span>
                        <div>
                            <span class="inline-block bg-orange-100 text-orange-700 text-sm px-2.5 py-0.5 rounded-md font-bold mb-2 tracking-wide">${q.category}</span>
                            <h3 class="text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed tracking-wide serif text-justify">${q.question}</h3>
                        </div>
                    </div>
                    <button onclick="window.toggleWaterfallFavorite(${q.id})" class="text-2xl p-2 transition hover:scale-110 active:scale-95">
                        <i id="fav-icon-${q.id}" class="${favClass} fa-star"></i>
                    </button>
                </div>
            `;

            // Options
            let optionsHtml = '<div class="grid gap-4">';
            q.options.forEach((opt, optIdx) => {
                const letters = ['A','B','C','D'];
                let btnClass, circleClass, statusIcon;

                if (optIdx === q.answer) {
                    btnClass = "bg-green-100 border-green-500 text-green-900 shadow-md transform scale-[1.01]";
                    circleClass = "bg-green-500 text-white";
                    statusIcon = '<i class="fas fa-check-circle text-green-600 text-2xl ml-auto"></i>';
                } else if (optIdx === userAnswer) {
                    btnClass = "bg-red-100 border-red-500 text-red-900";
                    circleClass = "bg-red-500 text-white";
                    statusIcon = '<i class="fas fa-times-circle text-red-600 text-2xl ml-auto"></i>';
                } else {
                    btnClass = "bg-gray-50 border-gray-100 text-gray-400 opacity-60";
                    circleClass = "bg-gray-200 text-gray-500";
                }

                optionsHtml += `
                    <button disabled class="option-btn w-full text-left p-5 rounded-xl border-2 flex items-center group transition-all duration-200 ${btnClass} cursor-default">
                        <span class="w-10 h-10 flex items-center justify-center rounded-full font-bold mr-5 text-lg flex-shrink-0 transition-colors ${circleClass}">
                            ${letters[optIdx]}
                        </span>
                        <span class="font-medium text-xl leading-snug">${opt}</span>
                        ${statusIcon}
                    </button>
                `;
            });
            optionsHtml += '</div>';

            // Explanation
            const expBg = isCorrect ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200";
            const explanationHtml = `
                <div class="mt-8 p-6 rounded-2xl border ${expBg} animate-fade-in-up">
                    <div class="flex items-start gap-4">
                        <div class="mt-1">
                            <i class="fas fa-lightbulb text-orange-500 text-2xl"></i>
                        </div>
                        <div>
                            <span class="font-bold text-orange-700 block mb-3 text-xl">解析：</span>
                            <p class="text-gray-800 text-xl leading-9 text-justify font-medium">${q.explanation}</p>
                        </div>
                    </div>
                </div>
            `;

            card.innerHTML = headerHtml + optionsHtml + explanationHtml;
        }

        window.toggleWaterfallFavorite = function(id) {
            const index = currentState.favorites.indexOf(id);
            if (index === -1) {
                currentState.favorites.push(id);
            } else {
                currentState.favorites.splice(index, 1);
            }
            saveUserData('favorites');
            
            // Update Icon Only
            const icon = document.getElementById(`fav-icon-${id}`);
            if (icon) {
                if (currentState.favorites.includes(id)) {
                    icon.className = "fas fa-star text-amber-500";
                } else {
                    icon.className = "far fa-star text-gray-300";
                }
            }
        }

        function updateStatsBar() {
            let correct = 0;
            let wrong = 0;
            let answered = 0;

            questionsData.forEach(q => {
                if (currentState.answers[q.id] !== undefined) {
                    answered++;
                    if (currentState.answers[q.id] === q.answer) {
                        correct++;
                    } else {
                        wrong++;
                    }
                }
            });

            ui.stickyCorrect.textContent = correct;
            ui.stickyWrong.textContent = wrong;
            ui.stickyProgress.textContent = answered;
        }

        window.finishQuizCheck = function() {
            const answeredCount = Object.keys(currentState.answers).length;
            if (answeredCount < questionsData.length) {
                if(!confirm(`您還有 ${questionsData.length - answeredCount} 題未作答，確定要交卷嗎？`)) {
                    return;
                }
            }
            finishQuiz();
        }

        function finishQuiz() {
            currentState.isFinished = true;
            saveProgress();
            
            // Calc Stats
            let correctCount = 0;
            questionsData.forEach(q => {
                if (currentState.answers[q.id] === q.answer) {
                    correctCount++;
                }
            });
            const score = Math.round((correctCount / questionsData.length) * 100);
            
            ui.resultScore.textContent = score;
            ui.resultCorrect.textContent = correctCount;
            ui.resultWrong.textContent = questionsData.length - correctCount;
            
            switchView('result');
        }

        // --- Review & List Logic ---
        window.showReview = function(type) {
            const ids = type === 'wrong' ? currentState.mistakes : currentState.favorites;
            ui.reviewTitle.textContent = type === 'wrong' ? '錯題本 (歷史累計)' : '我的最愛';
            renderReviewList(ids);
            switchView('review');
        }

        window.backToHomeOrResult = function() {
            if (currentState.isFinished) {
                switchView('result');
            } else {
                switchView('dashboard');
            }
        }
        
        window.clearData = function() {
            if(confirm("警告：此操作僅清除「本機」暫存狀態，雲端資料將保留。\n若要重新開始測驗，請點擊「重新測驗」。")) {
                location.reload();
            }
        }

        function renderReviewList(ids) {
            ui.reviewList.innerHTML = '';
            if (ids.length === 0) {
                ui.reviewList.innerHTML = `
                    <div class="text-center py-10 bg-white rounded-xl shadow-sm border border-orange-100">
                        <i class="far fa-folder-open text-4xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500 text-lg">目前沒有紀錄。</p>
                    </div>`;
                return;
            }

            ids.forEach(id => {
                const q = questionsData.find(item => item.id === id);
                if (!q) return;

                const item = document.createElement('div');
                item.className = 'bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-orange-100';
                
                const optionsHtml = q.options.map((opt, idx) => {
                    const isCorrect = idx === q.answer;
                    const isUserSelected = currentState.answers[q.id] === idx;
                    
                    let classStr = "ml-3 p-3 rounded-xl border flex items-center text-lg md:text-xl ";
                    let icon = "";
                    
                    if (isCorrect) {
                        classStr += "bg-green-100 border-green-300 text-green-900 font-bold";
                        icon = '<i class="fas fa-check text-green-700 mr-3"></i>';
                    } else if (isUserSelected && !isCorrect) {
                        classStr += "bg-red-50 border-red-200 text-red-800 line-through opacity-75";
                        icon = '<i class="fas fa-times text-red-600 mr-3"></i>';
                    } else {
                        classStr += "border-transparent text-gray-500";
                        icon = '<span class="w-6 inline-block"></span>';
                    }
                    return `<div class="${classStr}">${icon} ${['A','B','C','D'][idx]}. ${opt}</div>`;
                }).join('');

                item.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-orange-100 text-orange-800 text-sm px-3 py-1 rounded-lg font-bold">${q.category}</span>
                        <span class="text-gray-300 text-sm">#${q.id}</span>
                    </div>
                    <p class="font-bold text-2xl md:text-3xl mb-6 text-gray-800 serif leading-relaxed">${q.question}</p>
                    <div class="space-y-3 mb-6">
                        ${optionsHtml}
                    </div>
                    <div class="bg-amber-50 p-6 rounded-xl text-xl text-gray-700 border border-amber-100 leading-9">
                        <span class="font-bold text-orange-600 block mb-2"><i class="fas fa-lightbulb mr-1"></i>解析：</span> ${q.explanation}
                    </div>
                `;
                ui.reviewList.appendChild(item);
            });
        }

        init();
    </script>
</body>
</html>
