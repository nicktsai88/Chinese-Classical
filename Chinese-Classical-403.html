            background: #d97706; /* amber-600 */

        /* 標籤樣式 */
        .tab-btn {
            position: relative;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .tab-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background-color: #d97706; /* amber-600 */
            transition: width 0.3s ease;
        }
        .tab-btn.active {
            color: #92400e; /* amber-800 */
            background-color: #fef3c7; /* amber-100 */
        }
        .tab-btn.active::after {
            width: 100%;
        }

        /* 互動文字樣式 */
        .interactive-word {
            cursor: pointer;
            border-bottom: 2px dotted #f59e0b; /* amber-500 */
            transition: all 0.2s;
            padding-bottom: 1px;
            position: relative;
            z-index: 20;
            color: #b45309; /* amber-700 */
            font-weight: 600;
        }
        .interactive-word:hover {
            background-color: #fde68a; /* amber-200 */
            color: #78350f; /* amber-900 */
            border-bottom-style: solid;
        }

        /* 彈出註釋 */
        .note-popup {
            animation: fadeIn 0.2s ease-out;
            box-shadow: 0 10px 25px -5px rgba(245, 158, 11, 0.2), 0 8px 10px -6px rgba(245, 158, 11, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) translateX(-50%); }
            to { opacity: 1; transform: translateY(0) translateX(-50%); }
        }

        /* 懸停翻譯效果 */
        .hover-trans-container:hover .hover-translation {
            display: block;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 聊天氣泡 */
        .chat-bubble {
            max-width: 85%;
            border-radius: 1rem;
            padding: 0.75rem 1rem;
            margin-bottom: 1rem;
            position: relative;
            line-height: 1.6;
        }
        .chat-user {
            background-color: #fef3c7; /* Amber-100 */
            color: #92400e;
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }
        .chat-ai {
            background-color: #fff;
            border: 1px solid #fde68a;
            color: #44403c;
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }
        
        /* 故事模式樣式 */
        .story-choice:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(217, 119, 6, 0.1), 0 2px 4px -1px rgba(217, 119, 6, 0.06);
        }
        .fade-in-image {
            animation: fadeInImg 0.8s ease-out forwards;
        }
        @keyframes fadeInImg {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 地圖與關係圖樣式 */
        .map-node {
            cursor: pointer;
            transition: r 0.3s ease, fill 0.3s ease;
        }
        .map-node:hover {
            fill: #d97706; 
            r: 12;
            stroke: #fffbeb;
            stroke-width: 3;
        }
        .tooltip {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            color: #44403c;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 100;
            max-width: 260px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border: 1px solid #fcd34d;
        }
        
        /* 禁用狀態的樣式 */
        input[type="radio"]:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .disabled-label {
            cursor: not-allowed !important;
            opacity: 0.7;
        }

        /* 正在播放音頻時的按鈕動畫 */
        .playing-audio {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;

        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
            100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
        }

                text: "【True Ending: 萬里封侯】相士仔細端詳了你，驚嘆道：「祭酒，生燕頷虎頸，飛而食肉，此萬里侯相也！」後來，你果真投筆從戎，出使西域三十一年，降服五十餘國，受封定遠侯，成就了一代傳奇！",
                choices: [{ text: "重溫英雄之路", next: "start" }],
                isEnding: true,
                win: true
            }
        };

        function renderStory(container) {
            if(!window.currentStoryNode) window.currentStoryNode = 'start';
            const node = storyNodes[window.currentStoryNode];
            const localPath = `Chinese-Classical-403-images/rpg_${window.currentStoryNode}.jpg`;

            let imageContent = `
                <div class="w-full overflow-hidden rounded-t-xl bg-gray-100">
                    <img src="${localPath}" class="w-full h-auto fade-in-image" alt="場景圖" onerror="this.style.display='none'">
                </div>
            `;

            container.innerHTML = `<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-orange-100">${imageContent}<div class="p-8 sm:p-10"><div class="flex items-center mb-6 text-amber-800 text-sm font-bold uppercase tracking-widest border-b border-orange-100 pb-2"><i class="fas fa-compass mr-2"></i> 抉擇時刻</div><p class="text-xl sm:text-2xl leading-relaxed text-amber-900 mb-10 font-serif">${node.text}</p>${node.isEnding ? (node.win ? `<div class="text-center mb-8 text-green-700 font-bold text-2xl p-6 bg-green-50 rounded-xl border border-green-200 shadow-sm"><i class="fas fa-check-circle mr-3"></i>名垂青史</div>` : `<div class="text-center mb-8 text-gray-700 font-bold text-2xl p-6 bg-gray-50 rounded-xl border border-gray-200 shadow-sm"><i class="fas fa-redo mr-3"></i>歸於平庸</div>`) : ''}<div class="grid gap-4">${node.choices.map(c => `<button onclick="nextStoryNode('${c.next}')" class="story-choice w-full py-5 px-8 bg-white hover:bg-orange-50 border-2 border-orange-200 hover:border-amber-500 rounded-xl text-amber-900 font-bold text-xl transition duration-200 flex items-center justify-between group shadow-sm hover:shadow-md text-left"><span>${c.text}</span><i class="fas fa-chevron-right text-amber-300 group-hover:text-amber-600 transition transform group-hover:translate-x-1"></i></button>`).join('')}</div></div></div>`;
            if(node.win) { try { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); } catch (e) { console.log("Confetti not loaded"); } }
        }

        function nextStoryNode(nodeId) {
            window.currentStoryNode = nodeId;
            renderStory(document.getElementById('content-display'));
        }

        function checkAnswer(idx, val, ans) {
            if (userAnswers[idx] !== undefined) return; 

            userAnswers[idx] = val; 
            
            const radios = document.getElementsByName(`q-${idx}`);
            for (let radio of radios) {
                radio.disabled = true;
                radio.parentElement.classList.add('disabled-label');
            }

            const feedbackEl = document.getElementById(`feedback-${idx}`);
            const card = document.getElementById(`quiz-card-${idx}`);
            const qData = contentData.quiz[idx];
            if (!feedbackEl || !card) return;
            
            feedbackEl.className = 'mt-4 p-4 rounded-lg text-base animate-fade-in border';
            card.classList.remove('bg-white');

            if (val === ans) {
                feedbackEl.innerHTML = `<strong class="block mb-1 text-lg"><i class="fas fa-check-circle mr-2"></i>答對了！</strong>${qData.exp}`;
                feedbackEl.classList.add('bg-green-50', 'border-green-200', 'text-green-900');
                card.classList.add('bg-green-50/30', 'border-green-500');
            } else {
                const correctOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === ans);
                const userOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === val);
                
                feedbackEl.innerHTML = `
                    <div class="mb-2">
                        <span class="block font-bold text-red-700 text-lg"><i class="fas fa-times-circle mr-2"></i>答錯了</span>
                        <span class="block text-amber-800 mt-1">您的答案：${userOption}</span>
                        <span class="block text-green-700 font-bold mt-1">正確答案：${correctOption}</span>
                    </div>
                    <div class="pt-2 border-t border-red-200 mt-2 text-amber-900">
                        <strong><i class="fas fa-lightbulb text-yellow-500 mr-1"></i>解析：</strong>${qData.exp}
                    </div>
                `;
                feedbackEl.classList.add('bg-red-50', 'border-red-200', 'text-amber-900');
                card.classList.add('bg-red-50/30', 'border-red-500');
            }
            feedbackEl.classList.remove('hidden');
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-amber-600 font-bold text-5xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                if(score >= 80) {
                    confetti({
                        particleCount: 200,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } catch(e) {}
        }

        function closeScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('hidden');
        }
        
        function showNote(key, segIdx, el, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const popup = document.getElementById('note-template');
            const content = document.getElementById('note-content');
            let noteData = null;
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) { noteData = contentData.segments[segIdx].notes[key]; } else if (allKeywords[key]) { noteData = allKeywords[key]; }
            if(!noteData) return;
            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-amber-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-amber-900 font-serif">${key}</h4>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-amber-700 mb-2 font-mono bg-orange-50 px-2 py-1 rounded inline-block">${noteData.zhuyin}</p>
                <p class="text-amber-800 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            // Adjust position if too close to right edge
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }

        function processTextWithNotes(text) {
            let processedText = marked.parse(text);
            const sortedKeys = Object.keys(allKeywords).sort((a, b) => b.length - a.length);
            
            sortedKeys.forEach(key => {
                const regex = new RegExp(`(?<!<[^>]*)${key}`, "g");
                processedText = processedText.replace(regex, `<span class="interactive-word bg-orange-50 px-1 rounded" onclick="showNote('${key}', undefined, this, event)">${key}</span>`);
            });
            return processedText;
        }

        // -------------------------------------------------------------------------
        //  語音朗讀核心優化 (Text-to-Speech Optimization)
        // -------------------------------------------------------------------------
        
        let currentSpeechTimeout = null; // 用於管理 setTimeout 斷句

        // 1. 優先選擇高品質女聲的演算法
        function getPreferredVoice(voices) {
            const preferredVoices = [
                "Google 國語",      // Chrome (Android/Desktop) - 非常自然
                "Mei-Jia",          // Edge/Windows - 微軟神經網路語音 (高品質)
                "Microsoft Hanhan", // Windows - 傳統高品質
                "Ting-Ting",        // macOS/iOS - 蘋果中文女聲
                "Lili",             // macOS - 蘋果中文
                "HiuGaai",          // iOS (粵語，但有時會被混用，放在後面)
                "Ya-Ting"           // Android 常見
            ];

            let selectedVoice = null;
            
            for (let name of preferredVoices) {
                selectedVoice = voices.find(v => v.name.includes(name));
                if (selectedVoice) break;
            }

            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW');
            }

            if (!selectedVoice) {
                selectedVoice = voices.find(v => v.lang.startsWith('zh'));
            }

            return selectedVoice;
        }

        // 2. 播放音頻主函式
        function playAudio(text, btnElement) {
            if (!('speechSynthesis' in window)) { 
                showError("您的瀏覽器不支援語音朗讀功能。"); 
                return; 
            }

            // 停止當前所有語音
            window.speechSynthesis.cancel();
            if (currentSpeechTimeout) clearTimeout(currentSpeechTimeout);
            
            // UI 狀態更新
            document.querySelectorAll('.playing-audio').forEach(btn => btn.classList.remove('playing-audio'));
            if(btnElement) btnElement.classList.add('playing-audio');

            const voices = window.speechSynthesis.getVoices();
            const targetVoice = getPreferredVoice(voices);

            // 3. 擬真斷句處理：根據標點符號分割字串
            const segments = text.split(/([。！？；：\n]+)/).filter(s => s.trim().length > 0);
            
            let queue = [];
            for (let i = 0; i < segments.length; i += 2) {
                let seg = segments[i];
                let punct = segments[i+1] || ""; 
                if (seg.trim()) {
                    queue.push({ text: seg + punct, punctuation: punct });
                }
            }
            
            if (queue.length === 0 && text.trim().length > 0) {
                queue.push({ text: text, punctuation: "" });
            }

            let index = 0;

            function speakSegment() {
                if (index >= queue.length) {
                    if(btnElement) btnElement.classList.remove('playing-audio');
                    return;
                }

                const item = queue[index];
                const utterance = new SpeechSynthesisUtterance(item.text);

                if (targetVoice) utterance.voice = targetVoice;
                utterance.lang = 'zh-TW';
                utterance.rate = 0.85;  
                utterance.pitch = 1.05; 
                
                utterance.onend = function() {
                    index++;
                    let pauseTime = 100; 
                    
                    if (/[。！？]/.test(item.punctuation)) {
                        pauseTime = 600; 
                    } else if (/[；：]/.test(item.punctuation)) {
                        pauseTime = 400; 
                    } else if (/[，、]/.test(item.text)) { 
                        pauseTime = 150; 
                    }

                    currentSpeechTimeout = setTimeout(speakSegment, pauseTime);
                };

                utterance.onerror = function(e) {
                    console.error("Audio error", e);
                    if(btnElement) btnElement.classList.remove('playing-audio');
                };

                window.speechSynthesis.speak(utterance);
            }

            speakSegment();
        }

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

                } else if (currentPersona === 'bangu') {

                } else {

                chatBox.innerHTML += `<div class="chat-bubble chat-ai shadow-sm animate-fade-in">${marked.parse(responseText)}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

    </script>
