                imgPrompt: "Realistic style. Gaoyu's lifeless body standing stiff like a withered tree by the roadside. Confucius and disciples looking on with reverence and sadness.",
                imageData: null,
                choices: [{ text: "重啟人生", next: "start" }],
                isEnding: true
            }
        };

        function renderStory(container) {
            if(!window.currentStoryNode) window.currentStoryNode = 'start';
            const node = storyNodes[window.currentStoryNode];
            const localPath = `Chinese-Classical-383-images/rpg_${window.currentStoryNode}.jpg`;
            const hasGenImage = !!node.imageData;

            let imageContent = `
                <div class="relative w-full overflow-hidden rounded-t-xl bg-gray-100 min-h-[300px]">
                    <img 
                        src="${hasGenImage ? node.imageData : localPath}" 
                        class="w-full h-auto object-cover fade-in-image shadow-inner" 
                        alt="場景圖"
                        onerror="this.style.display='none'; document.getElementById('story-ph').style.display='flex';"
                        onload="this.style.display='block'; document.getElementById('story-ph').style.display='none';"
                    >
                    <div id="story-ph" class="${hasGenImage ? 'hidden' : 'flex'} absolute inset-0 flex flex-col items-center justify-center bg-gray-50 border-b border-gray-200">
                        <div class="z-10 text-center text-gray-400">
                            <i class="fas fa-image text-6xl mb-4"></i>
                            <p class="text-sm mb-4">場景準備中...</p>
                             <button onclick="generateStoryImage('${window.currentStoryNode}')" class="px-4 py-2 bg-amber-600 text-white rounded-lg shadow hover:bg-amber-700 transition">
                                <i class="fas fa-magic mr-2"></i>生成此場景
                            </button>
                        </div>
                    </div>
                    ${node.isLoading ? `<div class="absolute inset-0 bg-white/80 flex items-center justify-center z-20"><div class="animate-pulse flex flex-col items-center"><i class="fas fa-palette text-5xl text-amber-500 mb-4"></i><p class="text-amber-700 font-bold">AI 繪製中...</p></div></div>` : ''}
                </div>
            `;

            container.innerHTML = `<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-amber-100">${imageContent}<div class="p-8 sm:p-10"><div class="flex items-center mb-6 text-amber-800 text-sm font-bold uppercase tracking-widest border-b border-amber-100 pb-2"><i class="fas fa-compass mr-2"></i> 抉擇時刻</div><p class="text-xl sm:text-2xl leading-relaxed text-gray-800 mb-10 font-serif">${node.text}</p>${node.isEnding ? (node.win ? `<div class="text-center mb-8 text-green-700 font-bold text-2xl p-6 bg-green-50 rounded-xl border border-green-200 shadow-sm"><i class="fas fa-leaf mr-3"></i>無悔的人生</div>` : `<div class="text-center mb-8 text-red-700 font-bold text-2xl p-6 bg-red-50 rounded-xl border border-red-200 shadow-sm"><i class="fas fa-tombstone mr-3"></i>千古之恨</div>`) : ''}<div class="grid gap-4">${node.choices.map(c => `<button onclick="nextStoryNode('${c.next}')" class="story-choice w-full py-5 px-8 bg-white hover:bg-amber-50 border-2 border-amber-200 hover:border-amber-500 rounded-xl text-amber-900 font-bold text-xl transition duration-200 flex items-center justify-between group shadow-sm hover:shadow-md text-left"><span>${c.text}</span><i class="fas fa-chevron-right text-amber-300 group-hover:text-amber-600 transition transform group-hover:translate-x-1"></i></button>`).join('')}</div></div></div>`;
            if(node.win) { try { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); } catch (e) { console.log("Confetti not loaded"); } }
        }

        function nextStoryNode(nodeId) {
            window.currentStoryNode = nodeId;
            renderStory(document.getElementById('content-display'));
        }
        
        async function preloadStoryImages() {
            if (hasPreloadedStory) return;
            hasPreloadedStory = true;
            // 預載邏輯暫緩，改為點擊觸發以免消耗過多資源
        }

        async function generateSingleImage(idx) {
             if (isGeneratingImage) return;
             isGeneratingImage = true;
             const btn = document.querySelector(`#placeholder-${idx} button`);
             if(btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> 繪製中...';
             
             try {
                const prompt = contentData.segments[idx].imagePrompt;
                const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instances: [{ prompt: prompt }], parameters: { sampleCount: 1 } }) });
                const data = await response.json();
                if (data.predictions && data.predictions[0].bytesBase64Encoded) {
                    const b64 = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                    contentData.segments[idx].imageData = b64;
                    // Refresh view
                    renderReading(document.getElementById('content-display'));
                } else {
                    throw new Error("API Error");
                }
             } catch(e) {
                 showError("圖片生成失敗，請檢查 API Key 或稍後再試。");
                 if(btn) btn.innerHTML = '<i class="fas fa-magic mr-1"></i> 重試';
             } finally {
                 isGeneratingImage = false;
             }
        }

        async function generateStoryImage(nodeId) {
            const node = storyNodes[nodeId];
            if (node.isLoading) return; 
            
            node.isLoading = true;
            renderStory(document.getElementById('content-display'));
            
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instances: [{ prompt: node.imgPrompt }], parameters: { sampleCount: 1 } }) });
                const data = await response.json();
                if (data.predictions && data.predictions[0].bytesBase64Encoded) { node.imageData = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`; } else { throw new Error("No image data returned"); }
            } catch (err) { console.error(`Story image failed for ${nodeId}:`, err); showError("生成失敗，請確認 API Key"); } 
            finally { 
                node.isLoading = false; 
                renderStory(document.getElementById('content-display'));
            }
        }

        async function generateAllImages() {
            if (isGeneratingImage) return;
            const btn = document.getElementById('btn-gen-all');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>AI 畫師繪製中...';
            isGeneratingImage = true;
            
            try {
                for (let i = 0; i < contentData.segments.length; i++) {
                    if (contentData.segments[i].imageData) continue;
                    const prompt = contentData.segments[i].imagePrompt;
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;
                    const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instances: [{ prompt: prompt }], parameters: { sampleCount: 1 } }) });
                    const data = await response.json();
                    if (data.predictions && data.predictions[0].bytesBase64Encoded) {
                        contentData.segments[i].imageData = `data:image/png;base64,${data.predictions[0].bytesBase64Encoded}`;
                        // 更新 UI 顯示進度
                         btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i>繪製中 (${i+1}/${contentData.segments.length})...`;
                    }
                }
                renderReading(document.getElementById('content-display'));
            } catch (err) { showError("圖片生成過程中遇到了一些問題，請稍後再試。"); console.error(err); } finally { isGeneratingImage = false; btn.disabled = false; btn.innerHTML = '<i class="fas fa-check mr-2"></i>繪製完成'; }
        }

        // 下載功能 - 確保資料夾結構正確
        async function downloadAllImages() {
            const zip = new JSZip();
            let count = 0;
            const title = "Gaoyu_Story"; 
            // 關鍵修改：設定資料夾名稱符合 GitHub 需求
            const folder = zip.folder("Chinese-Classical-383-images");

            // Reading segments
            contentData.segments.forEach((seg, index) => {
                if (seg.imageData) {
                    const base64Data = seg.imageData.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
                    folder.file(`segment_${index + 1}.jpg`, base64Data, {base64: true});
                    count++;
                }
            });

            // RPG nodes
            Object.entries(storyNodes).forEach(([nodeId, node]) => {
                if (node.imageData) {
                    const base64Data = node.imageData.replace(/^data:image\/(png|jpg|jpeg);base64,/, "");
                    folder.file(`rpg_${nodeId}.jpg`, base64Data, {base64: true});
                    count++;
                }
            });

            if (count === 0) {
                showError("目前沒有快取圖片，請先點擊「生成全篇」或手動放入圖片。");
                return;
            }

            const content = await zip.generateAsync({type: "blob"});
            saveAs(content, `${title}_assets.zip`);
            showError(`已下載 ${count} 張圖片，請解壓縮並將資料夾上傳至 GitHub。`);
        }

        function checkAnswer(idx, val, ans) {
            if (userAnswers[idx] !== undefined) return; 

            userAnswers[idx] = val; 
            
            const radios = document.getElementsByName(`q-${idx}`);
            for (let radio of radios) {
                radio.disabled = true;
                radio.parentElement.classList.add('disabled-label');
            }

            const feedbackEl = document.getElementById(`feedback-${idx}`);
            const card = document.getElementById(`quiz-card-${idx}`);
            const qData = contentData.quiz[idx];
            if (!feedbackEl || !card) return;
            
            feedbackEl.className = 'mt-4 p-4 rounded-lg text-base animate-fade-in border';
            card.classList.remove('bg-white');

            if (val === ans) {
                feedbackEl.innerHTML = `<strong class="block mb-1 text-lg"><i class="fas fa-check-circle mr-2"></i>答對了！</strong>${qData.exp}`;
                feedbackEl.classList.add('bg-green-50', 'border-green-200', 'text-green-900');
                card.classList.add('bg-green-50/30', 'border-green-500');
            } else {
                const correctOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === ans);
                const userOption = qData.opts.find((opt, i) => ["A","B","C","D"][i] === val);
                
                feedbackEl.innerHTML = `
                    <div class="mb-2">
                        <span class="block font-bold text-red-700 text-lg"><i class="fas fa-times-circle mr-2"></i>答錯了</span>
                        <span class="block text-gray-600 mt-1">您的答案：${userOption}</span>
                        <span class="block text-green-700 font-bold mt-1">正確答案：${correctOption}</span>
                    </div>
                    <div class="pt-2 border-t border-red-200 mt-2 text-gray-700">
                        <strong><i class="fas fa-lightbulb text-amber-500 mr-1"></i>解析：</strong>${qData.exp}
                    </div>
                `;
                feedbackEl.classList.add('bg-red-50', 'border-red-200', 'text-gray-800');
                card.classList.add('bg-red-50/30', 'border-red-500');
            }
            feedbackEl.classList.remove('hidden');
        }

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');
            scoreText.innerHTML = `您的總分是 <span class="text-amber-600 font-bold text-5xl">${score}</span> 分`;
            
            const modal = document.getElementById('score-modal');
            modal.classList.remove('hidden');
            
            try {
                if(score >= 80) {
                    confetti({
                        particleCount: 200,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } catch(e) {}
        }

        function closeScoreModal() {
            const modal = document.getElementById('score-modal');
            modal.classList.add('hidden');
        }
        
        function showNote(key, segIdx, el, e) {
            if (e && e.stopPropagation) e.stopPropagation();
            const popup = document.getElementById('note-template');
            const content = document.getElementById('note-content');
            let noteData = null;
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) { noteData = contentData.segments[segIdx].notes[key]; } else if (allKeywords[key]) { noteData = allKeywords[key]; }
            if(!noteData) return;
            content.innerHTML = `
                <div class="flex items-baseline justify-between border-b border-amber-100 pb-2 mb-2">
                    <h4 class="text-xl font-bold text-amber-900 font-serif">${key}</h4>
                    <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full font-bold">${noteData.type || noteData.pos}</span>
                </div>
                <p class="text-sm text-gray-500 mb-2 font-mono bg-gray-50 px-2 py-1 rounded inline-block">${noteData.zhuyin}</p>
                <p class="text-gray-700 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }

        function processTextWithNotes(text) {
            let processedText = marked.parse(text);
            const sortedKeys = Object.keys(allKeywords).sort((a, b) => b.length - a.length);
            
            sortedKeys.forEach(key => {
                const regex = new RegExp(`(?<!<[^>]*)${key}`, "g");
                processedText = processedText.replace(regex, `<span class="interactive-word bg-amber-50 px-1 rounded" onclick="showNote('${key}', undefined, this, event)">${key}</span>`);
            });
            return processedText;
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; 
            utterance.rate = 0.85; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            let targetVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW') && (v.name.includes('Google') || v.name.includes('Hanhan') || v.name.includes('Mei-Jia') || v.name.includes('Yating')));
            if (!targetVoice) { targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); }
            if (!targetVoice) { targetVoice = voices.find(v => v.lang.startsWith('zh')); }
            if (targetVoice) { utterance.voice = targetVoice; }
            utterance.onerror = (e) => { console.error("Speech synthesis error:", e); showError("語音播放發生錯誤，可能是瀏覽器限制或網路問題。"); };
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

        // Chat logic
        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="chat-bubble chat-user shadow-sm animate-fade-in">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="chat-bubble chat-ai shadow-sm"><div class="typing-dot"><i class="fas fa-ellipsis-h animate-pulse"></i></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(async () => {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                
                let responseText = "";
                const p = personas[currentPersona];
                
                // Fallback responses if no API key
                if (currentPersona === 'confucius') {
                    responseText = "善哉問也。樹欲靜而風不止，時光如流水，一去不復返。汝當以此為鑑，回家多陪伴雙親，莫待親不在而空留遺憾。此乃孝之大義也。";
                } else if (currentPersona === 'gaoyu') {
                    responseText = "唉...年輕人，你問得好。我當初若是知道這些，就不會落得如此下場。名利如浮雲，唯有親情最真。快回家看看吧...";
                } else {
                    responseText = "夫子所言極是。我聽了皋魚的故事，心裡也很難過。我們應該把握當下，不要讓未來的自己後悔。";
                }
                
                if (apiKey && apiKey.length > 10) {
                     try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{
                                role: "user",
                                parts: [{ text: `你現在扮演${p.name}。${p.systemPrompt}。使用者的問題是：${message}` }]
                            }]
                        };
                        const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                        const data = await res.json();
                        if(data.candidates && data.candidates[0].content) {
                            responseText = data.candidates[0].content.parts[0].text;
                        }
                    } catch(e) { console.error(e); }
                }

                chatBox.innerHTML += `<div class="chat-bubble chat-ai shadow-sm animate-fade-in">${marked.parse(responseText)}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

    </script>
