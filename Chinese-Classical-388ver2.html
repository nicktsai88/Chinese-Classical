    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

        // --- Configuration ---

        const firebaseConfig = {
            apiKey: "AIzaSyAxQFt76ZPXE7d0i1XeNZ1yiiD2WYNIfHs",
            authDomain: "chinese-learning-47f4d.firebaseapp.com",
            projectId: "chinese-learning-47f4d",

            appId: "1:76289812052:web:898384a916f9f341f62fc1"

        let app, db, auth;

        } catch (e) {
            console.error("Firebase init error:", e);
            updateConnectionStatus('error', '初始化失敗');
        }

        // --- Questions Data (張相遇盜) ---
        const questionsData = [
            { id: 1, category: "詞語釋義", question: "「孤貧落魄，卻『倜儻』有大度」的「倜儻」意思最接近？", options: ["生活困頓", "灑脫不拘，豪爽不群", "言行輕浮", "相貌堂堂"], answer: 1, explanation: "倜儻（ㄊㄧˋ ㄊㄤˇ）：形容人灑脫不拘，卓異不群。" },
            { id: 2, category: "情節分析", question: "張相遇盜時，其他居民的反應為何？", options: ["與盜賊搏鬥", "準備酒食款待", "東逃西匿，躲藏起來", "報官抓人"], answer: 2, explanation: "文中云：「居民恐怕拿住，東逃西匿，連店主多去躲藏。」" },
            { id: 3, category: "文意理解", question: "張相「岸然」走到群盜面前的「岸然」，形容什麼樣子？", options: ["靠近河岸的樣子", "嚴肅莊重，傲氣凜然的樣子", "不知所措的樣子", "卑躬屈膝的樣子"], answer: 1, explanation: "岸然：形容嚴肅莊重，高傲不屈的樣子（道貌岸然）。" },
            { id: 4, category: "人物心態", question: "群盜見張相「秀才乃肯自屈」，為何感到高興（大喜）？", options: ["因為可以搶劫秀才", "因為秀才願意降低身分與他們結交", "因為秀才帶了酒肉來", "因為秀才認識官府的人"], answer: 1, explanation: "強盜自認身分低微（貧疏），見讀書人（秀才）肯屈尊相交，故感到大喜。" },
            { id: 5, category: "句式判斷", question: "「何不可之有？」的句型結構與下列何者相同？", options: ["唯利是圖", "有事弟子服其勞", "牡丹，花之富貴者也", "蓮，花之君子者也"], answer: 0, explanation: "「何不可之有」即「有何不可」，為倒裝句（賓語前置）。「唯利是圖」即「唯圖利」，亦為倒裝句。" },
            { id: 6, category: "詞語理解", question: "張相說「『盜』非是齷齪兒郎做得的」，這裡的「齷齪」意指？", options: ["骯髒不衛生", "心地狹窄，拘泥小節", "身材矮小", "聲音難聽"], answer: 1, explanation: "此處「齷齪」並非指骯髒，而是指氣量狹小、拘泥小節的人做不了「大盜」。" },
            { id: 7, category: "細節觀察", question: "張相吃豬蹄時的動作「略擘一擘開」，「擘」的意思是？", options: ["用刀切開", "用牙齒咬", "用手分開、撕開", "用筷子夾"], answer: 2, explanation: "擘（ㄅㄛˋ）：用手分開（擘開）。" },
            { id: 8, category: "成語運用", question: "形容張相吃東西「狼吞虎嚥」，與下列哪個成語意思相反？", options: ["風捲殘雲", "細嚼慢嚥", "大快朵頤", "鯨吞蠶食"], answer: 1, explanation: "狼吞虎嚥形容吃東西又急又猛。細嚼慢嚥形容慢慢進食。" },
            { id: 9, category: "文意推斷", question: "群盜認為張相「真宰相器量」，主要依據是什麼？", options: ["他長得像宰相", "他能預知未來", "他不拘小節，面對強盜仍能豪邁飲食", "他身上帶了很多金銀珠寶"], answer: 2, explanation: "盜云：「能如此不拘小節，決非凡品。」" },
            { id: 10, category: "詞語釋義", question: "張相離開時說了一聲「聒噪」，這在當時的語境下是表示？", options: ["你們太吵了", "打擾了（客套話，意同多謝款待）", "我要去告發你們", "我不怕你們"], answer: 1, explanation: "「聒噪」在早期白話小說中常作為客套話，意為「打擾了」、「多謝款待」。" },
            { id: 11, category: "人物性格", question: "張相將強盜贈送的金帛「盡付之酒家」，顯示他具有何種性格？", options: ["揮霍無度，不知節儉", "視錢財如糞土，豪邁不羈", "膽小怕事，不敢留著贓款", "想用錢賄賂酒家"], answer: 1, explanation: "顯示其「倜儻有大度」，不將金錢放在心上，視為身外之物。" },
            { id: 12, category: "詩句賞析", question: "詩云「等閑卿相在塵埃」，「等閑」的意思是？", options: ["等待空閒", "平常、輕易（指看上去像個普通人）", "相等", "閒暇無事"], answer: 1, explanation: "「等閑」意指尋常、普通。指這位未來的卿相現在混跡在塵埃（貧賤）之中，看似尋常。" },
            { id: 13, category: "主旨分析", question: "本故事主要想傳達的意旨為何？", options: ["強盜也有善良的一面", "人不可貌相", "大人物在微賤時便展現出不凡的氣度與膽識", "遇到強盜要用智取"], answer: 2, explanation: "結尾點題：「只此一段氣魄，在貧賤時就與人不同了。」強調大人物在微賤時即有非凡氣度。" },
            { id: 14, category: "字音辨析", question: "群盜「共相唏咤」的「咤」，讀音為？", options: ["ㄊㄨㄛ", "ㄓㄚˋ", "ㄔㄚˋ", "ㄗㄜˊ"], answer: 2, explanation: "咤（ㄔㄚˋ）：嘆詞，表示驚異、讚嘆。唏咤（ㄒㄧ ㄔㄚˋ）。" },
            { id: 15, category: "詞性活用", question: "「宰制天下」的「宰」，詞性與解釋為？", options: ["名詞，宰相", "動詞，屠殺", "動詞，主宰、治理", "形容詞，主要的"], answer: 2, explanation: "宰制：主宰、治理。宰為動詞。" },
            { id: 16, category: "修辭技巧", question: "「槍刀森列，形狀猙獰」運用了何種描寫手法？", options: ["側面描寫", "視覺摹寫", "聽覺摹寫", "心理描寫"], answer: 1, explanation: "描寫看到的景象（刀槍林立、樣貌兇惡），屬於視覺摹寫。" },
            { id: 17, category: "文意理解", question: "群盜說：「秀才乃肯自屈」，「自屈」是指？", options: ["自己委屈受苦", "自我彎曲身體", "降低身分（與強盜同席）", "承認自己失敗"], answer: 2, explanation: "指讀書人願意降低身分，不嫌棄強盜。" },
            { id: 18, category: "邏輯推論", question: "為什麼強盜會主動贈送張相金帛？", options: ["張相威脅他們", "張相騙他們說自己沒錢回家", "強盜被張相的氣度折服，想預先結交這位未來的貴人", "強盜錢太多花不完"], answer: 2, explanation: "文中盜云：「他日做了宰相...今日塵埃中，願先結納」，顯示是英雄惜英雄，且想預先結善緣。" },
            { id: 19, category: "詞語比較", question: "「慷慨之士」的「慷慨」，意思與下列何者最相近？", options: ["大方（金錢上）", "情緒激昂，氣度豪爽", "悲傷嘆息", "憤世嫉俗"], answer: 1, explanation: "慷慨：此指志氣昂揚，性格豪爽。" },
            { id: 20, category: "細節理解", question: "張相將金帛「一一簡取」，「簡」的意思是？", options: ["簡單", "挑選", "簡略", "竹簡"], answer: 1, explanation: "簡：通「撿」，挑選、取用。" },
            { id: 21, category: "文化常識", question: "文中張相自稱「小生」，這是古代哪一種人的自稱？", options: ["老人的謙稱", "讀書人的謙稱", "商人的自稱", "官員的自稱"], answer: 1, explanation: "小生：傳統戲曲或古代讀書人（年輕男子）的自稱。" },
            { id: 22, category: "句義理解", question: "「直教劇盜也憐才」的「憐」，解釋為？", options: ["可憐", "憐憫", "愛惜、欣賞", "鄰居"], answer: 2, explanation: "憐才：愛惜人才。指連大強盜也懂得欣賞人才。" },
            { id: 23, category: "文意深究", question: "張相說：「欲就大夫求一醉飽」，稱強盜為「大夫」，用意是？", options: ["諷刺強盜假裝斯文", "害怕被殺，故用尊稱討好", "展現豪爽，視強盜為英雄豪傑而不以賊視之", "認錯人了"], answer: 2, explanation: "張相個性「倜儻有大度」，稱盜為大夫、將軍等，是視其為草莽英雄，展現不拘世俗的豪氣。" },
            { id: 24, category: "字形辨析", question: "下列選項中，字形完全正確的是？", options: ["巾漬（頭巾）", "魁梧（身材高大）", "醒醐灌頂", "狼吞虎煙"], answer: 1, explanation: "(A) 巾幘；(C) 醍醐；(D) 狼吞虎嚥。" },
            { id: 25, category: "綜合賞析", question: "關於這篇短文的寫作特色，下列敘述何者錯誤？", options: ["運用對話凸顯人物性格", "透過強盜的視角側面烘托主角的不凡", "結局悲慘，帶有警世意味", "語言帶有早期白話小說的風格（如：這、那、吃得）"], answer: 2, explanation: "結局是張相得到資助且後來做了宰相，並非悲慘結局。" }
        ];

        // --- State Management ---
        let currentState = {
            username: '',
            answers: {}, // { questionId: selectedOptionIndex }
            mistakes: [], 
            favorites: []
        };

        // --- DOM Elements ---
        const views = {
            login: document.getElementById('view-login'),
            quiz: document.getElementById('view-quiz')
        };
        
        const ui = {
            usernameInput: document.getElementById('username'),
            userDisplay: document.getElementById('user-display'),
            usernameSpan: document.getElementById('username-span'),
            quickLoginArea: document.getElementById('quick-login-area'),
            recentUsersList: document.getElementById('recent-users-list'),
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            quizContainer: document.getElementById('quiz-list-container'),
            statCorrect: document.getElementById('stat-correct'),
            statWrong: document.getElementById('stat-wrong'),
            statProgress: document.getElementById('stat-progress'),
            statTotal: document.getElementById('stat-total')
        };

        // --- Initialization ---
        function init() {
            ui.statTotal.textContent = questionsData.length;

            if (isFirebaseReady) {
                // Listen to Global Users
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                onSnapshot(globalRef, (docSnap) => {
                    updateConnectionStatus('success', '已連線');
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        renderRecentUsers(data.users || []);
                    } else {
                        renderRecentUsers([]);
                    }
                }, (error) => {
                    console.error("Global listen error", error);
                    updateConnectionStatus('error', '同步失敗');
                });
            } else {
                renderRecentUsers([]); 
            }
        }

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot';
            if (type === 'loading') ui.statusDot.classList.add('status-loading');
            else if (type === 'success') ui.statusDot.classList.add('status-success');
            else if (type === 'error') ui.statusDot.classList.add('status-error');
        }

        function renderRecentUsers(users) {
            if (users && users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = '';
                users.forEach(user => {
                    const btn = document.createElement('button');
                    btn.className = 'px-4 py-2 bg-orange-50 hover:bg-orange-100 text-orange-700 rounded-full text-sm border border-orange-200 transition font-medium';
                    btn.innerHTML = `<i class="fas fa-user-circle mr-1"></i>${user}`;
                    btn.onclick = () => quickLogin(user);
                    ui.recentUsersList.appendChild(btn);
                });
            } else {
                 ui.quickLoginArea.classList.add('hidden');
            }
        }

        // --- Login Logic ---
        window.quickLogin = function(name) {
            ui.usernameInput.value = name;
            window.attemptLogin();
        }

        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) {
                alert('請輸入姓名');
                return;
            }
            
            currentState.username = name;
            
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                setDoc(globalRef, { users: arrayUnion(name) }, { merge: true }).catch(console.error);
                startUserListener(name);
            } else {
                // Offline mode: just render the quiz empty or with local storage if implemented (skipping for this demo)
                renderWaterfallQuiz();
                updateStats();
            }

            ui.userDisplay.classList.remove('hidden');
            ui.userDisplay.classList.add('flex');
            ui.usernameSpan.textContent = name;
            
            switchView('quiz');
        }

        function startUserListener(username) {
            if (currentUserUnsubscribe) currentUserUnsubscribe();

            const userRef = doc(db, COLLECTION_NAME, username);
            
            currentUserUnsubscribe = onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Update state from cloud
                    if (data.progress && data.progress.answers) {
                        currentState.answers = data.progress.answers;
                    }
                    if (data.mistakes) currentState.mistakes = data.mistakes;
                    if (data.favorites) currentState.favorites = data.favorites;

                    // Re-render UI to reflect cloud state
                    renderWaterfallQuiz();
                    updateStats();
                } else {
                    // New user, init view
                    renderWaterfallQuiz();
                    updateStats();
                }
            });
        }

        function switchView(viewName) {
            views.login.classList.add('hidden');
            views.quiz.classList.add('hidden');
            
            views[viewName].classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // --- Waterfall Quiz Logic ---
        function renderWaterfallQuiz() {
            const container = ui.quizContainer;
            // Note: In a real React app we wouldn't clear innerHTML, but for vanilla JS this is simplest 
            // to ensure state consistency without complex diffing.
            // To prevent scroll jumping during re-renders, we could implement a smarter update, 
            // but since onSnapshot updates are infrequent (only on other device changes), this is acceptable.
            // For local interactions, we will manipulate the DOM directly first.
            container.innerHTML = ''; 

            questionsData.forEach((q, index) => {
                const answeredIdx = currentState.answers[q.id];
                const isAnswered = answeredIdx !== undefined;
                const isCorrect = isAnswered && answeredIdx === q.answer;

                // Card Styling
                let borderClass = 'border-2 border-gray-200';
                let bgClass = 'bg-white';
                if (isAnswered) {
                    if (isCorrect) {
                        borderClass = 'border-2 border-green-400';
                        bgClass = 'bg-green-50/30';
                    } else {
                        borderClass = 'border-2 border-red-400';
                        bgClass = 'bg-red-50/30';
                    }
                }

                const card = document.createElement('div');
                card.id = `card-${q.id}`;
                card.className = `relative rounded-2xl shadow-sm p-6 md:p-8 transition-all duration-300 ${borderClass} ${bgClass}`;
                
                // Header (Question)
                const headerHtml = `
                    <div class="flex justify-between items-start mb-6">
                        <div class="flex items-start gap-4 w-full">
                            <span class="flex-shrink-0 bg-orange-500 text-white font-bold rounded-lg px-4 py-2 text-xl shadow-sm mt-1">#${index + 1}</span>
                            <h3 class="text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed tracking-wide serif">${q.question}</h3>
                        </div>
                    </div>
                `;

                // Options
                let optionsHtml = '<div class="grid gap-4">';
                q.options.forEach((opt, optIdx) => {
                    const letters = ['A','B','C','D'];
                    let btnClass = 'bg-white border-2 border-gray-200 hover:border-orange-300 hover:bg-orange-50 text-gray-700';
                    let circleClass = 'bg-gray-100 text-gray-600';
                    let iconHtml = '';

                    if (isAnswered) {
                        // Disable interactions visuals
                        btnClass = 'cursor-default'; 
                        
                        if (optIdx === q.answer) {
                            // Correct Answer (Always Green)
                            btnClass = 'bg-green-100 border-green-500 text-green-900';
                            circleClass = 'bg-green-500 text-white';
                            iconHtml = '<i class="fas fa-check text-green-600 text-2xl ml-auto"></i>';
                        } else if (optIdx === answeredIdx && !isCorrect) {
                            // User Selected Wrong Answer (Red)
                            btnClass = 'bg-red-100 border-red-500 text-red-900';
                            circleClass = 'bg-red-500 text-white';
                            iconHtml = '<i class="fas fa-times text-red-600 text-2xl ml-auto"></i>';
                        } else {
                            // Other options fade out
                            btnClass = 'bg-white border-gray-100 text-gray-400 opacity-60';
                        }
                    }

                    optionsHtml += `
                        <button onclick="window.handleAnswer(${index}, ${optIdx})" 
                                ${isAnswered ? 'disabled' : ''}
                                class="option-btn w-full text-left p-5 rounded-xl flex items-center group transition-all duration-200 ${btnClass}">
                            <span class="w-10 h-10 flex items-center justify-center rounded-full font-bold mr-5 text-lg flex-shrink-0 transition-colors ${circleClass}">${letters[optIdx]}</span>
                            <span class="font-medium text-xl leading-relaxed">${opt}</span>
                            ${iconHtml}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation (Show immediately if answered)
                let explanationHtml = '';
                if (isAnswered) {
                    explanationHtml = `
                        <div class="mt-8 bg-white/60 p-6 rounded-2xl border border-orange-200 animate-fade-in-up">
                            <div class="flex items-start gap-4">
                                <div class="bg-orange-100 p-3 rounded-full flex-shrink-0">
                                    <i class="fas fa-lightbulb text-orange-600 text-2xl"></i>
                                </div>
                                <div>
                                    <span class="font-bold text-orange-700 block mb-3 text-xl">解析：</span>
                                    <p class="text-gray-800 text-xl leading-9 text-justify font-medium">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });
        }

        window.handleAnswer = function(qIndex, selectedIdx) {
            const q = questionsData[qIndex];
            
            // 1. Update State
            currentState.answers[q.id] = selectedIdx;
            
            // 2. Local Logic (Mistakes)
            const isCorrect = selectedIdx === q.answer;
            if (!isCorrect) {
                if (!currentState.mistakes.includes(q.id)) {
                    currentState.mistakes.push(q.id);
                }
            }

            // 3. Save to Firebase (Debounced or immediate)
            saveProgress();

            // 4. Update UI immediately (Re-render this specific card or whole list)
            // Re-rendering whole list ensures consistency with the "RenderWaterfallQuiz" logic
            renderWaterfallQuiz();
            updateStats();
        }

        function updateStats() {
            let correct = 0;
            let answered = 0;
            
            questionsData.forEach(q => {
                const ans = currentState.answers[q.id];
                if (ans !== undefined) {
                    answered++;
                    if (ans === q.answer) correct++;
                }
            });

            const wrong = answered - correct;

            // Animate numbers (simple text update)
            ui.statCorrect.textContent = correct;
            ui.statWrong.textContent = wrong;
            ui.statProgress.textContent = answered;
        }

        function saveProgress() {
            if (!isFirebaseReady || !currentState.username) return;
            
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const data = {
                progress: {
                    answers: currentState.answers,
                    timestamp: new Date().getTime()
                },
                mistakes: currentState.mistakes
            };

            setDoc(userRef, data, { merge: true }).catch(console.error);
        }

        window.logout = function() {
            if (confirm("確定要登出嗎？進度已自動儲存。")) {
                if (currentUserUnsubscribe) currentUserUnsubscribe();
                currentState.username = '';
                ui.usernameInput.value = '';
                switchView('login');
            }
        }
        
        window.goHome = function() {
            if (currentState.username) {
               // Already on quiz page or do nothing
            } else {
                switchView('login');
            }
        }

        // Start
        init();

    </script>
</body>
</html>
