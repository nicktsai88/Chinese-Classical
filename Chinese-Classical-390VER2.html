        // --- Questions Data (葉公好龍) ---

            { id: 1, category: "字音辨析", question: "「葉公子高『好』龍」與「『好』夫似龍而非龍者也」，兩句中「好」的讀音與詞性分別為？", options: ["皆讀ㄏㄠˇ，形容詞", "皆讀ㄏㄠˋ，動詞", "前讀ㄏㄠˋ，後讀ㄏㄠˇ", "前讀ㄏㄠˇ，後讀ㄏㄠˋ"], answer: 1, explanation: "好：讀ㄏㄠˋ，喜愛，動詞。" },
            { id: 2, category: "詞義測驗", question: "「鉤以『寫』龍」的「寫」，在文中的意思是？", options: ["書寫文字", "描繪、畫", "卸下", "抄寫"], answer: 1, explanation: "寫：描繪、繪畫（如寫生）。" },

            { id: 4, category: "詞義辨析", question: "「棄而『還』走」的「還」，正確讀音與解釋是？", options: ["ㄏㄞˊ，依然", "ㄏㄨㄢˊ，歸還", "ㄒㄩㄢˊ，通「旋」，轉身", "ㄏㄨㄢˋ，逃跑"], answer: 2, explanation: "還：通「旋」（ㄒㄩㄢˊ），轉身、掉轉。" },
            { id: 5, category: "成語理解", question: "「五色無主」形容葉公當時處於何種狀態？", options: ["色彩繽紛，不知選哪個", "臉色蒼白，神情驚恐不定", "非常憤怒", "興奮過度"], answer: 1, explanation: "五色無主：形容極度驚恐，神色不定。" },
            { id: 6, category: "文意理解", question: "葉公「棄而還走」中的「走」，意思是？", options: ["走路", "奔跑、逃跑", "離開", "散步"], answer: 1, explanation: "走：在古漢語中多指「奔跑」。" },
            { id: 7, category: "虛詞用法", question: "「於是天龍聞而下『之』」的「之」，指代的是？", options: ["葉公", "龍的圖案", "屋室", "（無義，助詞）"], answer: 0, explanation: "下之：下（到）他（葉公）那裡。之代指葉公及其住所。" },
            { id: 8, category: "文意推斷", question: "天龍為什麼會「聞而下之」？", options: ["因為天龍想要吃掉葉公", "因為天龍被葉公畫的假龍激怒了", "因為天龍誤以為葉公是真心喜愛龍，被其感動", "因為天龍剛好路過"], answer: 2, explanation: "天龍「聞」葉公好龍之名，以為遇到知音，故降臨。" },
            { id: 9, category: "字音辨析", question: "「『施』尾於堂」的「施」，在此處讀音與意義為？", options: ["ㄕ，給予", "ㄧˋ，通「迤」，延伸、置放", "ㄕ，實行", "ㄕˇ，通「矢」"], answer: 1, explanation: "施：在此通「迤」（ㄧˋ），指延伸、拖著（尾巴）。亦可解為「置放」。" },
            { id: 10, category: "句型判斷", question: "「是葉公非好龍也」屬於何種句型？", options: ["敘事句", "有無句", "表態句", "判斷句"], answer: 3, explanation: "「是......也」結構，意為「這（葉公）不是好龍啊」，表判斷。" },
            { id: 11, category: "詞語理解", question: "「鉤以寫龍，鑿以寫龍」中的「鉤」與「鑿」是指？", options: ["釣魚的鉤子與鑿子", "鉤刀與鑿子（刻畫工具或裝飾物）", "彎曲與筆直", "兵器"], answer: 1, explanation: "指用鉤刀（或衣帶鉤）和鑿子等工具/物品來刻畫裝飾龍的圖案。" },
            { id: 12, category: "虛詞詳解", question: "「好『夫』似龍而非龍者也」的「夫」，詞性與解釋是？", options: ["名詞，丈夫", "名詞，農夫", "代詞，那、那個（指示代詞）", "助詞，無義"], answer: 2, explanation: "夫（ㄈㄨˊ）：指示代詞，指「那些」、「那種」。" },
            { id: 13, category: "主旨分析", question: "「葉公好龍」這則寓言主要用來諷刺哪一種人？", options: ["言行一致的人", "喜歡動物的人", "口頭上說愛好某事物，實際上卻懼怕或並不真正愛好的人", "喜歡藝術創作的人"], answer: 2, explanation: "諷刺表裡不一，口是心非，似愛實怕的人。" },
            { id: 14, category: "比較閱讀", question: "葉公對龍的態度，與下列哪句成語最為接近？", options: ["口是心非", "表裡如一", "愛屋及烏", "情有獨鍾"], answer: 0, explanation: "葉公表面愛龍，實則怕龍，正是「口是心非」。" },
            { id: 15, category: "情境應用", question: "某政客高喊支持改革，但當改革真的推行影響到他利益時，他卻極力反對。這種行為可用哪句成語形容？", options: ["畫蛇添足", "葉公好龍", "畫龍點睛", "魚躍龍門"], answer: 1, explanation: "形容表面支持/愛好，真面目（真龍）來時卻恐懼排斥。" },
            { id: 16, category: "修辭技巧", question: "文中描寫葉公「鉤以寫龍，鑿以寫龍，屋室雕文以寫龍」，使用了何種修辭來強調他對龍的喜愛？", options: ["排比", "譬喻", "轉化", "設問"], answer: 0, explanation: "連用三個「...以寫龍」，結構相似，語氣連貫，為排比。" },
            { id: 17, category: "細節觀察", question: "天龍降臨後的具體動作是？", options: ["直接飛進屋內抓人", "在天上吼叫", "頭探進窗戶，尾巴拖在大堂", "化身為人與葉公對話"], answer: 2, explanation: "文中云：「窺頭於牖，施尾於堂」。" },
            { id: 18, category: "文化常識", question: "「失其魂魄」中的「魂魄」，在中國傳統文化中，人死後魂與魄的去向通常被認為是？", options: ["魂升天，魄入地", "魂入地，魄升天", "魂魄皆散於風中", "魂魄皆入地府"], answer: 0, explanation: "古人認為「魂氣歸于天，形魄歸于地」。" },
            { id: 19, category: "文意轉折", question: "文章前半段極力描寫葉公到處畫龍，其作用是？", options: ["讚美葉公的藝術天分", "說明龍的形象多變", "為後文葉公見真龍後的恐懼作「鋪墊」與「反襯」", "強調裝潢的重要性"], answer: 2, explanation: "先極寫其愛龍之深（表象），是為了反襯後文見真龍之恐（真相），增強諷刺效果。" },
            { id: 20, category: "字形辨析", question: "下列選項中，字形完全正確的是？", options: ["屋室雕文", "窺頭於牆", "施尾於塘", "棄而環走"], answer: 0, explanation: "(B) 牖；(C) 堂；(D) 還。" },
            { id: 21, category: "邏輯思辨", question: "從葉公的反應來看，他所喜愛的「似龍而非龍者」，本質上是什麼？", options: ["真實的生物", "具有生命力的神獸", "僅具裝飾性且無威脅性的符號或藝術品", "能帶來好運的吉祥物"], answer: 2, explanation: "他喜歡的是不會動、沒有殺傷力、可被掌控的圖像（假龍），而非具有強大力量的真龍。" },
            { id: 22, category: "詞性判斷", question: "「窺頭於牖」的「窺」，詞性是？", options: ["名詞", "動詞", "形容詞", "副詞"], answer: 1, explanation: "窺：偷看、探看，動詞。" },
            { id: 23, category: "成語延伸", question: "下列與「龍」有關的成語，何者帶有負面含義？", options: ["龍飛鳳舞", "龍騰虎躍", "龍蛇雜處", "畫龍點睛"], answer: 2, explanation: "龍蛇雜處：比喻好人和壞人混雜在一起。其餘皆為正面。" },
            { id: 24, category: "文法結構", question: "「鉤以寫龍」中的「以」，用法最接近下列何者？", options: ["徐噴「以」煙（介詞，用）", "不「以」人廢言（介詞，因為）", "「以」叢草為林（介詞，把）", "可以「以」一當十（介詞，憑藉/用）"], answer: 0, explanation: "鉤以寫龍 = 以鉤寫龍（倒裝），意即「用」鉤刀來畫龍。與(A)徐噴以煙（以煙噴之）用法相近，皆表工具/憑藉。" },
            { id: 25, category: "綜合賞析", question: "關於《葉公好龍》的敘事結構，下列分析何者正確？", options: ["先議後敘，先發表評論再講故事", "先敘後議，先講故事再點出寓意", "夾敘夾議，邊講邊評", "純粹敘事，不含評論"], answer: 1, explanation: "前段敘述葉公畫龍與見龍的故事，最後一句「是葉公非好龍也...」則是作者的評論（議），點出主旨。" }
        ];

        // --- State Management ---
        let currentState = {
            username: '',
            answers: {}, // { questionId: selectedOptionIndex }
            mistakes: [], 
            favorites: [],
        };

        const ui = {
            usernameInput: document.getElementById('username'),
            userDisplay: document.getElementById('user-display'),
            usernameSpan: document.getElementById('username-span'),
            quickLoginArea: document.getElementById('quick-login-area'),
            recentUsersList: document.getElementById('recent-users-list'),
            statCorrect: document.getElementById('stat-correct'),
            statWrong: document.getElementById('stat-wrong'),
            quizListContainer: document.getElementById('quiz-list-container'),
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            views: {
                login: document.getElementById('view-login'),
                quiz: document.getElementById('view-quiz')
            }
        };

        // --- Initialization ---
        function init() {
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                onSnapshot(globalRef, (docSnap) => {
                    updateConnectionStatus('success', '已同步');
                    if (docSnap.exists()) {
                        renderRecentUsers(docSnap.data().users || []);
                    }
                }, (error) => {
                    console.error("Global listen error", error);
                    updateConnectionStatus('error', '雲端同步失敗');
                });
            } else {
                updateConnectionStatus('error', '未連線');
                renderRecentUsers([]); 
            }
        }

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot';
            if (type === 'loading') ui.statusDot.classList.add('status-loading');
            else if (type === 'success') ui.statusDot.classList.add('status-success');
            else if (type === 'error') ui.statusDot.classList.add('status-error');
        }

        function renderRecentUsers(users) {
            if (users && users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = '';
                users.forEach(user => {
                    const btn = document.createElement('button');
                    btn.className = 'px-3 py-1.5 bg-white hover:bg-orange-50 text-gray-700 rounded-full text-sm border border-gray-200 transition mb-2 shadow-sm';
                    btn.innerHTML = `<i class="fas fa-user-circle mr-1 text-orange-400"></i>${user}`;
                    btn.onclick = () => {
                        ui.usernameInput.value = user;
                        window.attemptLogin();
                    };
                    ui.recentUsersList.appendChild(btn);
                });
            } else {
                 ui.quickLoginArea.classList.add('hidden');
            }
        }

        // --- Login Logic ---
        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) { alert('請輸入姓名'); return; }
            
            currentState.username = name;
            
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                setDoc(globalRef, { users: arrayUnion(name) }, { merge: true })
                    .catch(e => console.error("Global user update error:", e));
                startUserListener(name);
            }

            ui.userDisplay.classList.remove('hidden');
            ui.userDisplay.classList.add('flex');
            ui.usernameSpan.textContent = name;
            
            switchView('quiz');
        }

        function startUserListener(username) {
            if (currentUserUnsubscribe) currentUserUnsubscribe();

            const userRef = doc(db, COLLECTION_NAME, username);
            
            currentUserUnsubscribe = onSnapshot(userRef, (docSnap) => {
                updateConnectionStatus('success', '資料同步');
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentState.favorites = data.favorites || [];
                    currentState.mistakes = data.mistakes || [];
                    if (data.progress) {
                         currentState.answers = data.progress.answers || {};
                    }
                } else {
                    // New User
                    currentState.favorites = [];
                    currentState.mistakes = [];
                    currentState.answers = {};
                }
                // Render the quiz list with new data
                renderWaterfallQuiz();
            }, (error) => {
                console.error("User listen error", error);
                updateConnectionStatus('error', '同步失敗');
            });
        }

        function switchView(viewName) {
            Object.values(ui.views).forEach(el => el.classList.add('hidden'));
            ui.views[viewName].classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // --- Waterfall Render Logic ---
        function renderWaterfallQuiz() {
            const container = ui.quizListContainer;
            // Don't wipe everything if we are just updating, but for simplicity we re-render
            // Ideally we should diff, but re-rendering 25 items is fast enough.
            container.innerHTML = ''; 

            let correctCount = 0;
            let wrongCount = 0;

            questionsData.forEach((q, index) => {
                const userAnswer = currentState.answers[q.id];
                const isAnswered = userAnswer !== undefined;
                const isCorrect = isAnswered && userAnswer === q.answer;
                
                if (isAnswered) {
                    if (isCorrect) correctCount++;
                    else wrongCount++;
                }

                // Determine Card Border Color
                let borderColor = 'border-gray-200';
                let bgColor = 'bg-white';
                if (isAnswered) {
                    if (isCorrect) {
                        borderColor = 'border-green-400';
                        bgColor = 'bg-green-50/10';
                    } else {
                        borderColor = 'border-red-400';
                        bgColor = 'bg-red-50/10';
                    }
                }

                // Card Element
                const card = document.createElement('div');
                card.className = `relative rounded-xl shadow-sm border-2 p-5 md:p-6 transition-all duration-300 ${borderColor} ${bgColor}`;
                
                // Header
                const headerHtml = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-start gap-3">
                            <span class="flex-shrink-0 bg-orange-500 text-white font-bold rounded px-2.5 py-1 text-sm shadow-sm">
                                #${index + 1}
                            </span>
                            <h3 class="text-lg font-bold text-gray-800 leading-relaxed tracking-wide font-serif">
                                ${q.question}
                            </h3>
                        </div>
                        <button onclick="window.toggleFavorite(${q.id})" class="text-2xl transition transform hover:scale-110 ${currentState.favorites.includes(q.id) ? 'text-amber-400' : 'text-gray-200 hover:text-amber-300'}">
                            <i class="${currentState.favorites.includes(q.id) ? 'fas' : 'far'} fa-star"></i>
                        </button>
                    </div>
                `;

                // Options
                let optionsHtml = '<div class="grid gap-3">';
                q.options.forEach((opt, optIdx) => {
                    const letter = ['A','B','C','D'][optIdx];
                    let btnClass = "option-btn w-full text-left p-3.5 rounded-lg border flex items-center group transition-colors ";
                    let badgeClass = "w-8 h-8 flex items-center justify-center rounded-full font-bold mr-3 text-sm ";
                    
                    if (isAnswered) {
                        if (optIdx === q.answer) {
                            // This is the correct answer -> GREEN
                            btnClass += "bg-green-100 border-green-500 text-green-900";
                            badgeClass += "bg-green-500 text-white";
                        } else if (optIdx === userAnswer) {
                            // This is the WRONG answer selected by user -> RED
                            btnClass += "bg-red-100 border-red-500 text-red-900";
                            badgeClass += "bg-red-500 text-white";
                        } else {
                            // Other options
                            btnClass += "bg-white border-gray-100 text-gray-400 opacity-60";
                            badgeClass += "bg-gray-100 text-gray-400";
                        }
                    } else {
                        // Not answered yet
                        btnClass += "bg-white border-gray-200 hover:border-orange-300 hover:bg-orange-50 text-gray-700";
                        badgeClass += "bg-gray-100 text-gray-500 group-hover:bg-orange-500 group-hover:text-white transition-colors";
                    }

                    // Click handler string
                    const clickAction = isAnswered ? "" : `onclick="window.handleAnswer(${q.id}, ${optIdx})"`;
                    const cursor = isAnswered ? "cursor-default" : "cursor-pointer";

                    optionsHtml += `
                        <button ${clickAction} class="${btnClass} ${cursor}" ${isAnswered ? 'disabled' : ''}>
                            <span class="${badgeClass}">${letter}</span>
                            <span class="font-medium text-base">${opt}</span>
                            ${(isAnswered && optIdx === q.answer) ? '<i class="fas fa-check-circle ml-auto text-green-600 text-lg"></i>' : ''}
                            ${(isAnswered && optIdx === userAnswer && optIdx !== q.answer) ? '<i class="fas fa-times-circle ml-auto text-red-500 text-lg"></i>' : ''}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation Block (Visible only if answered)
                let explanationHtml = '';
                if (isAnswered) {
                    explanationHtml = `
                        <div class="mt-5 bg-orange-50 p-4 rounded-lg border border-orange-100 animate-fade-in-up">
                            <div class="flex items-start gap-2">
                                <i class="fas fa-lightbulb text-orange-500 mt-1"></i>
                                <div>
                                    <span class="font-bold text-orange-700 block mb-1">解析：</span>
                                    <p class="text-gray-700 text-base leading-7 text-justify">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });

            // Update Stats
            ui.statCorrect.textContent = correctCount;
            ui.statWrong.textContent = wrongCount;
        }

        window.handleAnswer = function(qId, selectedIdx) {
            if (!currentState.username) return;

            // Update State
            currentState.answers[qId] = selectedIdx;
            
            // Check correctness for immediate logging (optional)
            const q = questionsData.find(x => x.id === qId);
            const isCorrect = q.answer === selectedIdx;
            
            if (!isCorrect) {
                if (!currentState.mistakes.includes(qId)) {
                    currentState.mistakes.push(qId);
                    saveUserData('mistakes');
                }
            }

            // Save Progress
            saveProgress();

            // Re-render UI (Fast enough for 25 items)
            renderWaterfallQuiz();
        }

        window.toggleFavorite = function(qId) {
            if (!currentState.username) return;
            
            const idx = currentState.favorites.indexOf(qId);
            if (idx === -1) currentState.favorites.push(qId);
            else currentState.favorites.splice(idx, 1);
            
            saveUserData('favorites');
            renderWaterfallQuiz(); // Refresh UI to toggle star
        }

        // --- Persistence Helpers ---
        function saveProgress() {
            if (!isFirebaseReady || !currentState.username) return;
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const progressData = {
                answers: currentState.answers,
                timestamp: new Date().getTime()
            };
            setDoc(userRef, { progress: progressData }, { merge: true });
        }

        function saveUserData(type) {
            if (!isFirebaseReady || !currentState.username) return;
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const data = {};
            data[type] = currentState[type];
            setDoc(userRef, data, { merge: true });
        }

        window.logout = function() {
            if (confirm("確定要登出嗎？")) {
                if (currentUserUnsubscribe) currentUserUnsubscribe();
                currentState.username = '';
                ui.views.login.classList.remove('hidden');
                ui.views.quiz.classList.add('hidden');
                document.getElementById('username').value = '';
            }
        }
        
        window.goHome = function() {
            if (currentState.username) {
                // Already in view, maybe scroll top
                window.scrollTo({top:0, behavior:'smooth'});
            } else {
                window.location.reload();
            }
        }

        // CSS Animation for explanation appearance
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.3s ease-out forwards;
            }
        `;
        document.head.appendChild(style);

        // Start
        init();

    </script>
</body>
</html>
