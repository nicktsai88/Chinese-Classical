    <script>
        // ----------------------------------------------------
        // 1. 教材資料結構 (Content Data) - 葉公好龍
        // ----------------------------------------------------
        const contentData = {
            metadata: {
                title: "(推與敲) 第49篇 葉公好龍",
                author: "劉向",
                source: "《新序·雜事五》"
            },
            summary: "葉公（子高）非常喜歡龍，家裡的衣帶鉤、酒器上都刻著龍，屋裡的樑柱門窗上也雕刻著龍。天上的真龍聽說了這件事，深受感動，便降臨到葉公家裡。龍頭從窗口探進來窺視，龍尾則橫在廳堂上。葉公看到真龍，嚇得轉身就跑，魂飛魄散，臉色都變了。原來葉公並不是真的喜歡龍，他喜歡的只是那些像龍卻不是真龍的東西罷了。",
            
            meaning: "這則寓言故事用來諷刺那些名不符實、表裡不一的人。1. **表面愛好 vs 真實恐懼**：人們往往聲稱喜愛某種事物（如賢才、真理），但當真實的事物出現時，卻因為無法承受其帶來的挑戰或現實而感到恐懼並拒絕。2. **諷刺虛偽**：批評那些口頭上說得好聽，實際上卻言行不一的偽君子。3. **求賢若渴的假象**：在政治上常用來比喻統治者表面上招賢納士，實際上卻害怕並排斥真正的人才。",
            
            rhetoric: [
                "**譬喻 (Metaphor):** 「龍」比喻賢才或真理；「葉公」比喻虛偽的當權者或偽君子。",
                "**映襯 (Contrast):** 葉公平日「鉤以寫龍，鑿以寫龍」的熱愛表現，與見到真龍時「棄而還走，失其魂魄」的恐懼反應形成強烈對比，突顯其虛偽。",
                "**誇飾 (Hyperbole):** 「失其魂魄，五色無主」生動誇張地描繪了葉公極度驚恐的神態。",
                "**排比 (Parallelism):** 「鉤以寫龍，鑿以寫龍，屋室雕文以寫龍」增強了語氣，強調葉公好龍之深。"
            ],
            
            // 36個詳盡語詞精解
            vocabulary: [
                { word: "葉公", zhuyin: "ㄕㄜˋ ㄍㄨㄥ", pos: "名詞", meaning: "楚國貴族沈諸梁，封地在葉（今河南葉縣），故稱葉公。" },
                { word: "子高", zhuyin: "ㄗˇ ㄍㄠ", pos: "名詞", meaning: "葉公的字。" },
                { word: "好", zhuyin: "ㄏㄠˋ", pos: "動詞", meaning: "喜愛、愛好。" },
                { word: "龍", zhuyin: "ㄌㄨㄥˊ", pos: "名詞", meaning: "傳說中的神獸，能興雲降雨。" },
                { word: "鉤", zhuyin: "ㄍㄡ", pos: "名詞", meaning: "衣帶鉤，類似今日的皮帶扣。" },
                { word: "以", zhuyin: "ㄧˇ", pos: "介詞", meaning: "用來。" },
                { word: "寫", zhuyin: "ㄒㄧㄝˇ", pos: "動詞", meaning: "描繪、畫、雕刻。" },
                { word: "鑿", zhuyin: "ㄗㄠˊ", pos: "名詞", meaning: "鑿子，此指刻鏤的器具或器物上的雕刻。" },
                { word: "屋室", zhuyin: "ㄨ ㄕˋ", pos: "名詞", meaning: "房屋居室。" },
                { word: "雕文", zhuyin: "ㄉㄧㄠ ㄨㄣˊ", pos: "名詞", meaning: "雕刻的紋飾、圖案。" },
                { word: "於是", zhuyin: "ㄩˊ ㄕˋ", pos: "連接詞", meaning: "就在這時候、因此。" },
                { word: "天龍", zhuyin: "ㄊㄧㄢ ㄌㄨㄥˊ", pos: "名詞", meaning: "天上的真龍。" },
                { word: "聞", zhuyin: "ㄨㄣˊ", pos: "動詞", meaning: "聽說。" },
                { word: "而", zhuyin: "ㄦˊ", pos: "連接詞", meaning: "就、然後。" },
                { word: "下", zhuyin: "ㄒㄧㄚˋ", pos: "動詞", meaning: "降臨、下來。" },
                { word: "之", zhuyin: "ㄓ", pos: "代詞", meaning: "代指葉公的家。" },
                { word: "窺", zhuyin: "ㄎㄨㄟ", pos: "動詞", meaning: "偷看、探視。" },
                { word: "頭", zhuyin: "ㄊㄡˊ", pos: "名詞", meaning: "頭部。" },
                { word: "於", zhuyin: "ㄩˊ", pos: "介詞", meaning: "在、從。" },
                { word: "牖", zhuyin: "ㄧㄡˇ", pos: "名詞", meaning: "窗戶。" },
                { word: "施", zhuyin: "ㄧˋ", pos: "動詞", meaning: "延伸、拖著（通「迤」）。" },
                { word: "尾", zhuyin: "ㄨㄟˇ", pos: "名詞", meaning: "尾巴。" },
                { word: "堂", zhuyin: "ㄊㄤˊ", pos: "名詞", meaning: "廳堂。" },
                { word: "見", zhuyin: "ㄐㄧㄢˋ", pos: "動詞", meaning: "看見。" },
                { word: "棄", zhuyin: "ㄑㄧˋ", pos: "動詞", meaning: "丟下、放棄（指不顧一切）。" },
                { word: "還", zhuyin: "ㄒㄩㄢˊ", pos: "動詞", meaning: "轉身、旋轉（通「旋」）。" },
                { word: "走", zhuyin: "ㄗㄡˇ", pos: "動詞", meaning: "跑、逃跑（古義）。" },
                { word: "失", zhuyin: "ㄕ", pos: "動詞", meaning: "喪失、丟失。" },
                { word: "其", zhuyin: "ㄑㄧˊ", pos: "代詞", meaning: "他的。" },
                { word: "魂魄", zhuyin: "ㄏㄨㄣˊ ㄆㄛˋ", pos: "名詞", meaning: "精神、靈魂。" },
                { word: "五色", zhuyin: "ㄨˇ ㄙㄜˋ", pos: "名詞", meaning: "臉色（指神色）。" },
                { word: "無主", zhuyin: "ㄨˊ ㄓㄨˇ", pos: "形容詞", meaning: "無法做主，指神色不定、驚慌失措。" },
                { word: "是", zhuyin: "ㄕˋ", pos: "代詞", meaning: "這、由此可見。" },
                { word: "非", zhuyin: "ㄈㄟ", pos: "副詞", meaning: "不是。" },
                { word: "夫", zhuyin: "ㄈㄨˊ", pos: "助詞", meaning: "那（指示代詞）。" },
                { word: "似", zhuyin: "ㄙˋ", pos: "動詞", meaning: "像、相似。" }
            ],

            // ----------------------------------------------------
            // [發音修正說明]
            // audioText 為了配合瀏覽器 TTS 引擎對古文破音字的限制，
            // 採用了「同音字替換」策略，以確保讀音正確。
            // 1. 葉 -> 涉 (shè, 避免讀 yè)
            // 2. 好 -> 號 (hào, 避免讀 hǎo)
            // 3. 施 -> 義 (yì, 通迤, 避免讀 shī)
            // 4. 還 -> 旋 (xuán, 通旋, 避免讀 hái 或 huán)
            // ----------------------------------------------------

        function submitQuiz() {
            const total = contentData.quiz.length;
            const answered = Object.keys(userAnswers).length;
            
            if (answered < total) {
                showError(`您還有 ${total - answered} 題未完成，請作答完畢後再交卷！`);
                return;
            }
            
            let correctCount = 0;
            for (let i = 0; i < total; i++) {
                if (userAnswers[i] === contentData.quiz[i].ans) {
                    correctCount++;
                }
            }
            
            const score = Math.round((correctCount / total) * 100);

            const scoreText = document.getElementById('score-text');

                        spread: 70,
                        origin: { y: 0.6 }

            } catch(e) {}
        }

            let noteData = null;
            if (segIdx !== undefined && contentData.segments[segIdx] && contentData.segments[segIdx].notes[key]) { noteData = contentData.segments[segIdx].notes[key]; } else if (allKeywords[key]) { noteData = allKeywords[key]; }

                <p class="text-gray-700 leading-relaxed font-medium">${noteData.def || noteData.meaning}</p>
            `;
            const rect = el.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            let left = rect.left + scrollLeft;
            let top = rect.bottom + scrollTop + 8; 
            
            if (left + 300 > document.body.clientWidth) { left = document.body.clientWidth - 310; }
            
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.classList.remove('hidden');
        }

        function processTextWithNotes(text) {
            let processedText = marked.parse(text);
            const sortedKeys = Object.keys(allKeywords).sort((a, b) => b.length - a.length);
            
            sortedKeys.forEach(key => {
                const regex = new RegExp(`(?<!<[^>]*)${key}`, "g");
                processedText = processedText.replace(regex, `<span class="interactive-word bg-amber-50 px-1 rounded" onclick="showNote('${key}', undefined, this, event)">${key}</span>`);
            });
            return processedText;
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) { showError("您的瀏覽器不支援語音朗讀功能。"); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; 
            utterance.rate = 0.85; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            let targetVoice = voices.find(v => (v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW') && (v.name.includes('Google') || v.name.includes('Hanhan') || v.name.includes('Mei-Jia') || v.name.includes('Yating')));
            if (!targetVoice) { targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'cmn-Hant-TW'); }
            if (!targetVoice) { targetVoice = voices.find(v => v.lang.startsWith('zh')); }
            if (targetVoice) { utterance.voice = targetVoice; }
            utterance.onerror = (e) => { console.error("Speech synthesis error:", e); showError("語音播放發生錯誤，可能是瀏覽器限制或網路問題。"); };
            window.speechSynthesis.speak(utterance);
        }
        window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            document.getElementById('error-msg').innerText = msg;
            toast.classList.remove('hidden');
            requestAnimationFrame(() => { toast.classList.remove('translate-y-10', 'opacity-0'); });
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.classList.add('hidden'), 300); }, 4000);
        }

        // Chat logic
        async function handleChatSubmit(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="chat-bubble chat-user shadow-sm animate-fade-in">${message}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="chat-bubble chat-ai shadow-sm"><div class="typing-dot"><i class="fas fa-ellipsis-h animate-pulse"></i></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(async () => {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                
                let responseText = "";
                const p = personas[currentPersona];
                
                // Mock responses since API is removed
                if (currentPersona === 'yegong') {
                    responseText = "唉...我也不是不愛龍，只是...你見過那種頭比房子還大的怪物嗎？那眼神，簡直要吃人！我那時候跑都來不及了，哪還顧得上形象啊...";
                } else if (currentPersona === 'dragon') {
                    responseText = "吾遨遊九天，聽聞下界有一知己，滿屋皆是吾之畫像。未曾想，吾親臨其舍，彼竟棄吾而去。看來世人之愛，多為虛妄。";
                } else {
                    responseText = "夫子常教導我們「聽其言而觀其行」。葉公好龍這件事，正好說明了許多人只愛虛名，不務實際。為政者若像葉公一樣，賢才怎敢親近呢？";
                }

                chatBox.innerHTML += `<div class="chat-bubble chat-ai shadow-sm animate-fade-in">${marked.parse(responseText)}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }

    </script>
