        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #ffffff;
            /* 可愛藍粉點點背景 */
            background-image: 
                radial-gradient(#bae6fd 1.5px, transparent 1.5px),

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 選項按鈕基礎樣式 - 手帳可愛風 */
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 6px 12px rgba(251, 113, 133, 0.15); /* rose shadow */
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(0) scale(0.99);
        }

        /* 狀態燈號 */
        .status-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-loading { background-color: #fbbf24; box-shadow: 0 0 5px #fbbf24; }
        .status-success { background-color: #34d399; box-shadow: 0 0 5px #34d399; }
        .status-error { background-color: #ef4444; box-shadow: 0 0 5px #ef4444; }

        /* 滾動條美化 (可愛粉色系) */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; border: 2px solid #fff; }
        ::-webkit-scrollbar-thumb:hover { background: #f472b6; }
        
        /* 雙欄滾動優化 */
        .custom-sticky {
            position: sticky;
            top: 5.5rem; 
        }

        /* 自訂 Modal 動畫 */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

        const COLLECTION_NAME = 'Chinese-Classical-296';
        const DOC_GLOBAL = 'global';

        const firebaseConfig = {
          apiKey: "AIzaSyAxQFt76ZPXE7d0i1XeNZ1yiiD2WYNIfHs",
          authDomain: "chinese-learning-47f4d.firebaseapp.com",
          projectId: "chinese-learning-47f4d",
          storageBucket: "chinese-learning-47f4d.firebasestorage.app",
          messagingSenderId: "76289812052",
          appId: "1:76289812052:web:898384a916f9f341f62fc1"
        };

        let app, db, auth;
        let isFirebaseReady = false;
        let currentUserUnsubscribe = null;

        // 客製化彈窗系統 (避免使用原生的 alert / confirm 導致 UI 中斷)
        window.customAlert = function(msg) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-icon').innerText = '🔔';
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="document.getElementById('custom-modal').classList.add('hidden')" class="bg-rose-400 hover:bg-rose-500 text-white font-bold py-3 px-8 rounded-full shadow-md transition transform active:scale-95">知道啦 💖</button>
            `;
            modal.classList.remove('hidden');
        };

        window.customConfirm = function(msg, confirmCallback) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-icon').innerText = '🤔';
            document.getElementById('modal-message').innerText = msg;
            
            // 將 callback 綁定到 window 上以便 HTML 觸發
            window._tempConfirmCallback = () => {
                modal.classList.add('hidden');
                if (confirmCallback) confirmCallback();
            };
            window._tempCancelCallback = () => {
                modal.classList.add('hidden');
            };

            document.getElementById('modal-buttons').innerHTML = `
                <button onclick="window._tempCancelCallback()" class="bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold py-3 px-6 rounded-full transition transform active:scale-95">先不要 🙅</button>
                <button onclick="window._tempConfirmCallback()" class="bg-teal-400 hover:bg-teal-500 text-white font-bold py-3 px-8 rounded-full shadow-md transition transform active:scale-95">確定 ✅</button>
            `;
            modal.classList.remove('hidden');
        };

        try {
            if(firebaseConfig.apiKey) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                signInAnonymously(auth).catch(console.error);
                isFirebaseReady = true;
            } else {
                updateConnectionStatus('error', '未連線');
            }
        } catch (e) {
            updateConnectionStatus('error', '連線錯誤');
        }

        // --- 全新高鑑別度題庫 (完全無舊資料，不使用跨文本比較) ---
        const questionsData = [
            { 
                id: 1, category: "字音字形", 
                question: "下列選項「」中字詞的讀音，何者標示完全正確？", 
                options: ["性命「微」：ㄨㄟˊ / 「巢」中：ㄔㄠˊ", "「骨」肉：ㄍㄨ / 望母「歸」：ㄍㄨㄟˋ", "「勸」君：ㄑㄩㄢ / 「枝」頭：ㄗ", "「一」般：ㄧˋ / 「莫」打：ㄇㄨˋ"], 
                answer: 0, explanation: "(A)正確。微(ㄨㄟˊ)；巢(ㄔㄠˊ)。(B)骨(ㄍㄨˇ)；歸(ㄍㄨㄟ)。(C)勸(ㄑㄩㄢˋ)；枝(ㄓ)。(D)一(ㄧ)；莫(ㄇㄛˋ)。" 
            },
            { 
                id: 2, category: "字義辨析", 
                question: "「誰道群生性命微」中的「微」字，與下列哪一個選項中的「微」字意思最相近？", 
                options: ["「微」管仲，吾其被髮左衽矣", "地位卑「微」", "見「微」知著", "造化鍾神秀，陰陽割昏「曉」（此選項無微字為陷阱）"], 
                answer: 1, explanation: "(B)正確。題幹的「微」指「輕賤、微賤、不重要」。(A)無、沒有。(B)卑微、微賤，與題意相同。(C)細小、隱微。" 
            },
            { 
                id: 3, category: "詞語理解", 
                question: "「一般骨肉一般皮」中的「一般」，在詩中的精確含義為何？", 
                options: ["指外表尋常、毫不特別", "指大眾普遍都具有的特徵", "指一模一樣、完全相同", "指品質中等、不上不下"], 
                answer: 2, explanation: "(C)正確。此處的「一般」作「一樣、相同」解。全句意指動物（鳥類）與人類一樣，同樣都是血肉之軀，同樣具有感知痛苦的能力與親情。" 
            },
            { 
                id: 4, category: "句法與翻譯", 
                question: "關於「誰道群生性命微？」一語的句法特徵，下列分析何者最為精確？", 
                options: ["此為直述句，客觀陳述群生性命確實微小的社會現象", "此為激問句（反詰句），作者藉由提問強烈表達「群生性命絕非微小」的立場", "此為懸問句，作者心中充滿疑惑，希望能找到提出這個觀點的人", "此為祈使句，強烈要求世人不可輕視生命的微小價值"], 
                answer: 1, explanation: "(B)正確。「誰道」意即「誰說」，表面上是疑問，實際上是答案在問題反面的「激問（反問）」，強烈反駁了「群生性命微小」的觀點，強調生命無分貴賤。" 
            },
            { 
                id: 5, category: "修辭辨識", 
                question: "「一般骨肉一般皮」使用了「一般...一般...」的句型，這種反覆使用相同字詞來增強語氣的修辭手法稱為何者？", 
                options: ["借代", "擬人", "類疊", "轉化"], 
                answer: 2, explanation: "(C)正確。同一個詞語（一般）在句子中接連或間隔反覆出現，屬於「類疊」修辭中的「類字」，能有效加強「萬物平等、同構同源」的語氣。" 
            },
            { 
                id: 6, category: "文意推敲", 
                question: "作者白居易在詩中「勸君莫打枝頭鳥」的最直接且感性的原因為何？", 
                options: ["因為枝頭鳥是農民的益鳥，能幫忙捕捉害蟲", "因為鳥類擁有美麗的外表，打死牠們會破壞自然和諧", "因為母鳥若死，巢中苦苦等待的幼鳥將失去依靠甚至餓死", "因為佛教主張不殺生，隨意打鳥會讓自己死後墮入地獄"], 
                answer: 2, explanation: "(C)正確。詩文末句「子在巢中望母歸」給出了最直接的情感理由：以「幼鳥等待母親」的親情畫面，喚醒打鳥人的同理心，使其不忍下手。" 
            },

        let currentState = {
            username: '',
            answers: {}, 
            mistakes: [], 
            favorites: [],
            viewMode: 'all', 
        };

        const ui = {
            usernameInput: document.getElementById('username'),
            userDisplay: document.getElementById('user-display'),
            usernameSpan: document.getElementById('username-span'),
            dashboardUsername: document.getElementById('dashboard-username'),
            dashWrongCount: document.getElementById('dash-wrong-count'),
            dashFavCount: document.getElementById('dash-fav-count'),
            quickLoginArea: document.getElementById('quick-login-area'),
            recentUsersList: document.getElementById('recent-users-list'),
            statCorrect: document.getElementById('stat-correct'),
            statWrong: document.getElementById('stat-wrong'),
            quizListContainer: document.getElementById('quiz-list-container'),
            statusDot: document.getElementById('status-dot'),
            statusText: document.getElementById('status-text'),
            views: {
                login: document.getElementById('view-login'),
                dashboard: document.getElementById('view-dashboard'),
                quiz: document.getElementById('view-quiz')
            }
        };

        // --- STREAMING_CHUNK:Handling global initializations... ---
        function init() {
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                onSnapshot(globalRef, (docSnap) => {
                    updateConnectionStatus('success', '已同步');
                    if (docSnap.exists()) {
                        renderRecentUsers(docSnap.data().users || []);
                    }
                }, (error) => {
                    console.error("Global listen error", error);
                    updateConnectionStatus('error', '雲端同步失敗');
                });
            } else {
                updateConnectionStatus('error', '未連線');
                renderRecentUsers([]); 
            }
        }

        function updateConnectionStatus(type, text) {
            ui.statusText.textContent = text;
            ui.statusDot.className = 'status-dot';
            if (type === 'loading') ui.statusDot.classList.add('status-loading');
            else if (type === 'success') ui.statusDot.classList.add('status-success');
            else if (type === 'error') ui.statusDot.classList.add('status-error');
        }

        function renderRecentUsers(users) {
            if (users && users.length > 0) {
                ui.quickLoginArea.classList.remove('hidden');
                ui.recentUsersList.innerHTML = '';
                users.forEach(user => {
                    const btn = document.createElement('button');
                    // 大幅加大歷史頭像與按鈕視覺
                    btn.className = 'px-5 py-3 bg-white hover:bg-rose-50 text-rose-600 rounded-full border-2 border-solid border-rose-300 transition hover:scale-105 shadow-sm font-black flex items-center gap-3';
                    btn.innerHTML = `<span class="text-4xl">🧑‍🎓</span><span class="text-lg">${user}</span>`;
                    btn.onclick = () => {
                        ui.usernameInput.value = user;
                        window.attemptLogin();
                    };
                    ui.recentUsersList.appendChild(btn);
                });
            } else {
                 ui.quickLoginArea.classList.add('hidden');
            }
        }

        window.attemptLogin = async function() {
            const name = ui.usernameInput.value.trim();
            if (!name) { 
                window.customAlert('哎呀！你忘記輸入名字囉 🥺\n請輸入名字後再進入測驗！'); 
                return; 
            }
            
            currentState.username = name;
            
            if (isFirebaseReady) {
                const globalRef = doc(db, COLLECTION_NAME, DOC_GLOBAL);
                setDoc(globalRef, { users: arrayUnion(name) }, { merge: true })
                    .catch(e => console.error("Global user update error:", e));
                startUserListener(name);
            }

            ui.userDisplay.classList.remove('hidden');
            ui.userDisplay.classList.add('flex');
            ui.usernameSpan.textContent = name;
            ui.dashboardUsername.textContent = name;
            
            switchView('dashboard');
        }

        function startUserListener(username) {
            if (currentUserUnsubscribe) currentUserUnsubscribe();

            const userRef = doc(db, COLLECTION_NAME, username);
            
            currentUserUnsubscribe = onSnapshot(userRef, (docSnap) => {
                updateConnectionStatus('success', '資料同步');
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentState.favorites = data.favorites || [];
                    currentState.mistakes = data.mistakes || [];
                    ui.dashWrongCount.textContent = `${currentState.mistakes.length} 題`;
                    ui.dashFavCount.textContent = `${currentState.favorites.length} 題`;

                    if (data.progress) {
                           currentState.answers = data.progress.answers || {};
                    }
                } else {
                    currentState.favorites = [];
                    currentState.mistakes = [];
                    currentState.answers = {};
                    ui.dashWrongCount.textContent = '0 題';
                    ui.dashFavCount.textContent = '0 題';
                }
                renderWaterfallQuiz();
            }, (error) => {
                updateConnectionStatus('error', '同步失敗');
            });
        }

        function switchView(viewName) {
            Object.values(ui.views).forEach(el => el.classList.add('hidden'));
            ui.views[viewName].classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // --- STREAMING_CHUNK:Implementing Quiz Logic... ---
        window.startExam = function() {
            currentState.viewMode = 'all';
            switchView('quiz');
            renderWaterfallQuiz();
        }

        window.showDashboard = function() {
            switchView('dashboard');
        }

        window.restartQuizLogic = function() {
            currentState.answers = {};
            saveProgress();
            renderWaterfallQuiz();
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function renderWaterfallQuiz() {
            const container = ui.quizListContainer;
            container.innerHTML = ''; 

            let questionsToRender = questionsData;
            let titleHtml = '';

            if (currentState.viewMode === 'wrong') {
                questionsToRender = questionsData.filter(q => currentState.mistakes.includes(q.id));
                titleHtml = `<span class="mr-2">❌</span><span>錯題本複習 (${questionsToRender.length}題)</span>`;
                
                if (questionsToRender.length === 0) {
                    container.innerHTML = `<div class="text-center py-16 bg-white/60 rounded-[2rem] border-2 border-solid border-gray-200"><span class="text-6xl mb-4 block">🎉</span><p class="text-2xl font-bold text-gray-500">太棒了！目前沒有錯題紀錄 💖</p></div>`;
                }
            } else if (currentState.viewMode === 'favorite') {
                questionsToRender = questionsData.filter(q => currentState.favorites.includes(q.id));
                titleHtml = `<span class="mr-2">⭐</span><span>我的最愛 (${questionsToRender.length}題)</span>`;
                
                if (questionsToRender.length === 0) {
                    container.innerHTML = `<div class="text-center py-16 bg-white/60 rounded-[2rem] border-2 border-solid border-gray-200"><span class="text-6xl mb-4 block">🫙</span><p class="text-2xl font-bold text-gray-500">目前沒有收藏的題目唷 🌟</p></div>`;
                }
            } else {
                questionsToRender = questionsData;
                titleHtml = `<span class="mr-2">📝</span><span>全真模擬試題 (${questionsData.length}題)</span>`;
            }

            document.getElementById('quiz-title-text').innerHTML = titleHtml;

            let correctCount = 0;
            let wrongCount = 0;

            questionsToRender.forEach((q) => {
                const userAnswer = currentState.answers[q.id];
                const isAnswered = userAnswer !== undefined;
                const isCorrect = isAnswered && userAnswer === q.answer;
                
                if (isAnswered) {
                    if (isCorrect) correctCount++;
                    else wrongCount++;
                }

                // 顏色狀態判定：使用柔和粉彩色系
                let borderColor = 'border-gray-200';
                let bgColor = 'bg-white/95';
                if (isAnswered) {
                    if (isCorrect) {
                        borderColor = 'border-teal-300';
                        bgColor = 'bg-teal-50/60';
                    } else {
                        borderColor = 'border-rose-300';
                        bgColor = 'bg-rose-50/60';
                    }
                }

                const card = document.createElement('div');
                card.className = `relative rounded-[2rem] shadow-sm border-2 border-solid p-6 md:p-8 transition-all duration-300 backdrop-blur-sm ${borderColor} ${bgColor}`;
                
                // Header (可愛風標籤)
                const headerHtml = `
                    <div class="flex justify-between items-start mb-6 w-full">
                        <div class="flex flex-col w-full gap-3">
                            <div>
                                <span class="text-sm font-black text-rose-500 bg-rose-100 border border-solid border-rose-200 rounded-full px-3 py-1 tracking-wider shadow-sm">
                                    📌 ${q.category}
                                </span>
                            </div>
                            <div class="flex items-start gap-3 w-full">
                                <span class="flex-shrink-0 bg-rose-400 text-white font-black rounded-xl px-3 py-1.5 text-base shadow-sm mt-1">
                                    #${q.id}
                                </span>
                                <h3 class="text-xl md:text-2xl font-bold text-gray-700 leading-relaxed tracking-wide font-serif">
                                    ${q.question}
                                </h3>
                            </div>
                        </div>
                        <button onclick="window.toggleFavorite(${q.id})" class="text-4xl transition transform hover:scale-110 flex-shrink-0 mt-2 ${currentState.favorites.includes(q.id) ? 'text-amber-400 drop-shadow-md' : 'text-gray-200 hover:text-amber-300'}">
                            ${currentState.favorites.includes(q.id) ? '⭐' : '☆'}
                        </button>
                    </div>
                `;

                // Options (大圓角手帳按鈕)
                let optionsHtml = '<div class="grid gap-3 md:gap-4">';
                q.options.forEach((opt, optIdx) => {
                    const letter = ['A','B','C','D'][optIdx];
                    let btnClass = "option-btn w-full text-left p-4 md:p-5 rounded-[1.5rem] border-2 border-solid flex items-center group transition-colors ";
                    let badgeClass = "w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full font-black mr-4 md:mr-5 text-lg md:text-xl flex-shrink-0 shadow-sm transition-colors ";
                    
                    if (isAnswered) {
                        if (optIdx === q.answer) {
                            btnClass += "bg-teal-50 border-teal-400 text-teal-800 shadow-sm";
                            badgeClass += "bg-teal-400 text-white";
                        } else if (optIdx === userAnswer) {
                            btnClass += "bg-rose-50 border-rose-400 text-rose-800";
                            badgeClass += "bg-rose-400 text-white";
                        } else {
                            btnClass += "bg-white/50 border-gray-200 text-gray-400 opacity-70";
                            badgeClass += "bg-gray-100 text-gray-400";
                        }
                    } else {
                        btnClass += "bg-white border-pink-200 hover:border-rose-400 hover:bg-rose-50 text-gray-600";
                        badgeClass += "bg-pink-100 text-pink-500 group-hover:bg-rose-400 group-hover:text-white";
                    }

                    const clickAction = isAnswered ? "" : `onclick="window.handleAnswer(${q.id}, ${optIdx})"`;
                    const cursor = isAnswered ? "cursor-default" : "cursor-pointer";

                    optionsHtml += `
                        <button ${clickAction} class="${btnClass} ${cursor}" ${isAnswered ? 'disabled' : ''}>
                            <span class="${badgeClass}">${letter}</span>
                            <span class="font-bold text-lg md:text-xl leading-relaxed">${opt}</span>
                            ${(isAnswered && optIdx === q.answer) ? '<span class="ml-auto text-3xl">⭕</span>' : ''}
                            ${(isAnswered && optIdx === userAnswer && optIdx !== q.answer) ? '<span class="ml-auto text-3xl">❌</span>' : ''}
                        </button>
                    `;
                });
                optionsHtml += '</div>';

                // Explanation Block (可愛對話框風格)
                let explanationHtml = '';
                if (isAnswered) {
                    explanationHtml = `
                        <div class="mt-6 bg-yellow-50 p-6 rounded-[1.5rem] border-2 border-solid border-yellow-300 animate-fade-in-up relative">
                            <div class="absolute -top-4 left-6 bg-yellow-300 w-6 h-6 rotate-45 border-l-2 border-t-2 border-solid border-yellow-300 hidden md:block"></div>
                            <div class="flex items-start gap-4 relative z-10">
                                <span class="text-3xl mt-1">💡</span>
                                <div>
                                    <span class="font-black text-amber-600 block mb-2 text-xl tracking-wider">詳解說明：</span>
                                    <p class="text-gray-700 text-lg md:text-xl leading-relaxed font-medium">${q.explanation}</p>
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = headerHtml + optionsHtml + explanationHtml;
                container.appendChild(card);
            });

            ui.statCorrect.textContent = correctCount;
            ui.statWrong.textContent = wrongCount;
        }

        // --- STREAMING_CHUNK:Finalizing Interactions... ---
        window.handleAnswer = function(qId, selectedIdx) {
            if (!currentState.username) return;

            currentState.answers[qId] = selectedIdx;
            
            const q = questionsData.find(x => x.id === qId);
            const isCorrect = q.answer === selectedIdx;
            
            if (!isCorrect) {
                if (!currentState.mistakes.includes(qId)) {
                    currentState.mistakes.push(qId);
                    saveUserData('mistakes');
                }
            }

            saveProgress();
            renderWaterfallQuiz();
        }

        window.toggleFavorite = function(qId) {
            if (!currentState.username) return;
            
            const idx = currentState.favorites.indexOf(qId);
            if (idx === -1) currentState.favorites.push(qId);
            else currentState.favorites.splice(idx, 1);
            
            saveUserData('favorites');
            renderWaterfallQuiz(); 
        }

        window.showReview = function(type) {
            if (!currentState.username) return;

            if (type === 'wrong') {
                if (currentState.mistakes.length === 0) {
                    window.customAlert("目前沒有錯題紀錄！\n你太棒了！ 🎉");
                    return;
                }
                currentState.viewMode = 'wrong';
            } else if (type === 'favorite') {
                if (currentState.favorites.length === 0) {
                    window.customAlert("目前沒有收藏任何題目唷 🌟\n趕快去測驗區把喜歡的題目打星號吧！");
                    return;
                }
                currentState.viewMode = 'favorite';
            } else {
                currentState.viewMode = 'all';
            }
            
            switchView('quiz');
            renderWaterfallQuiz();
        }

        function saveProgress() {
            if (!isFirebaseReady || !currentState.username) return;
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const progressData = {
                answers: currentState.answers,
                timestamp: new Date().getTime()
            };
            setDoc(userRef, { progress: progressData }, { merge: true });
        }

        function saveUserData(type) {
            if (!isFirebaseReady || !currentState.username) return;
            const userRef = doc(db, COLLECTION_NAME, currentState.username);
            const data = {};
            data[type] = currentState[type];
            setDoc(userRef, data, { merge: true });
        }

        window.logout = function() {
            if (currentUserUnsubscribe) currentUserUnsubscribe();
            currentState.username = '';
            ui.views.login.classList.remove('hidden');
            ui.views.dashboard.classList.add('hidden');
            ui.views.quiz.classList.add('hidden');
            document.getElementById('username').value = '';
            window.scrollTo({top:0, behavior:'smooth'});
        }
        
        window.goHome = function() {
            if (currentState.username) {
                window.scrollTo({top:0, behavior:'smooth'});
                switchView('dashboard');
            } else {
                window.location.reload();
            }
        }

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .animate-fade-in-up {
                animation: fadeInUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            }
        `;
        document.head.appendChild(style);

        init();

    </script>
</body>
</html>
